name: CI

# Quality guardrails: type-check, lint and unit tests are BLOCKING.
#
# Triggers are deduped so each change runs the suite ONCE:
#   - pull_request → the canonical check for every feature/fix branch (branch protection uses it).
#   - push → only main and release/** (post-merge verification). Feature/fix branches are NOT
#     built on push; they always land through a PR, so a push trigger here only duplicated the
#     pull_request run and competed for hosted runners.
# The concurrency group cancels an in-progress run when the same PR/branch is pushed again.
on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests + coverage floor (jest)
        run: npm run test:coverage

      - name: Obsidian guideline lint (blocking)
        run: npm run lint:obsidian

  # Performance budgets (#457, epic #452) — BLOCKING, and deliberately its own job.
  #
  # It builds synthetic vaults of up to 50,000 notes, so it is far too slow to sit inside the
  # `quality` job that every push waits on. A budget is a ceiling with a stated reason
  # (test/perf/budgets.ts); exceeding one fails here and prints by how much.
  #
  # `--runInBand` is not optional: parallel workers compete for the same cores and turn every
  # timing into a measurement of the other workers.
  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Budgets (blocking)
        run: npm run test:perf
