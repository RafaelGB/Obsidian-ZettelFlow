name: CI

# Quality guardrails for every pull request and feature-branch push:
# type-check, lint and unit tests are BLOCKING; the Obsidian guideline lint is advisory
# until the tracked violations are fixed (then make it blocking).
on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (jest)
        run: npm test

      - name: Obsidian guideline lint (blocking)
        run: npm run lint:obsidian
