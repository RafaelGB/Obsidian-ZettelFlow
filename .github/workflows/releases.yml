name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: |
          npm ci
          npm run release

      - name: Verify release artifacts and tag match manifest.version
        run: |
          set -euo pipefail
          test -f dist/main.js
          test -f dist/styles.css
          test -f manifest.json
          version="$(node -p "require('./manifest.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not equal manifest.version '$version'. Tag with the manifest version."
            exit 1
          fi

      - name: Create GitHub release with the three artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Publish the curated house-format notes when present (RELEASE_NOTES.md, rewritten
          # each release); fall back to auto-generated so a tag never fails for lack of them.
          if [ -f RELEASE_NOTES.md ]; then
            notes=(--notes-file RELEASE_NOTES.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            "${notes[@]}" \
            dist/main.js manifest.json dist/styles.css
