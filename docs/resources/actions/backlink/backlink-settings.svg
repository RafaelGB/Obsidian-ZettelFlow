<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Configuring the Backlink action in the step builder">
<rect width="1200" height="700" fill="#1e1e1e"/><rect x="24" y="24" width="1152" height="540" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="48" y="60" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Step builder</text><text x="48" y="92" fill="#dcddde" font-family="sans-serif" font-size="19" font-weight="650" text-anchor="start">Backlink</text><text x="48" y="116" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Action to insert backlink of the new note in the target note</text><line x1="24" y1="132" x2="1176" y2="132" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="162" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Insert pattern</text><text x="48" y="182" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Preview: - [[note link]]</text><rect x="832" y="154" width="320" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="842" y="175.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">- {{wikilink}}</text><line x1="48" y1="198" x2="1152" y2="198" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="226" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Enable default file</text><text x="48" y="246" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Enable or disable default file. If enabled. the UI will be disabled and the default file will be used.</text><rect x="1112" y="224" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="1141" cy="235" r="8" fill="#fff" stroke="none" stroke-width="2"/><line x1="48" y1="262" x2="1152" y2="262" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="290" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Default file</text><text x="48" y="310" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Search for the default file where you want to insert the backlink</text><rect x="832" y="282" width="320" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="842" y="303.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Projects/Debt essay.md</text><line x1="48" y1="326" x2="1152" y2="326" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="354" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Default file heading</text><text x="48" y="374" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Search for the heading where you want to insert the backlink</text><rect x="832" y="346" width="320" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="842" y="367.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">## Sources</text><line x1="48" y1="390" x2="1152" y2="390" stroke="#3a3a3a" stroke-width="1"/><circle cx="34" cy="162" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="167" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="34" cy="226" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="231" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="34" cy="322" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="327" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">What gets inserted: your text around {{wikilink}}, previewed as you type.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">With a default file, the wizard asks nothing — it shows the result and a Continue button.</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The default note and heading the backlink always goes to.</text>
</svg>
