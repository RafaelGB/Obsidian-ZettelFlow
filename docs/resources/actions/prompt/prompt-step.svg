<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="The Prompt action as a wizard step: a text area and Confirm">
<rect width="1200" height="700" fill="#1e1e1e"/><rect x="24" y="24" width="760" height="540" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="44" y="54" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Step 2</text><text x="90" y="54" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">· about 1 left · Will be created at Zettel/</text><text x="762" y="54" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><rect x="44" y="68" width="46.4" height="26" rx="13" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="67.2" y="86" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Idea</text><text x="94.4" y="86" fill="#5c5f66" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">›</text><rect x="104.4" y="68" width="84.39999999999999" height="26" rx="13" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="146.6" y="86" fill="#fff" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Statement</text><line x1="24" y1="108" x2="784" y2="108" stroke="#3a3a3a" stroke-width="1"/><text x="44" y="130" fill="#dcddde" font-family="sans-serif" font-size="19" font-weight="650" text-anchor="start">What is the idea, in one sentence?</text><rect x="808" y="24" width="368" height="540" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="824" y="50" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Live preview</text><text x="824" y="76" fill="#8b8e94" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">---</text><text x="824" y="97" fill="#8b8e94" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">state: fleeting</text><text x="824" y="118" fill="#a99cf7" font-family="monospace" font-size="13" font-weight="600" text-anchor="start">idea: Notes owe nothing</text><text x="824" y="139" fill="#8b8e94" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">---</text><text x="824" y="160" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start"></text><text x="824" y="181" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start"># Notes owe nothing</text><g transform="translate(0,14)"><rect x="44" y="140" width="720" height="200" rx="8" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="60" y="170" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">Notes owe nothing until you return to them.</text><text x="60" y="194" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">An old note costs nothing; only a decision does.</text><line x1="60" y1="204" x2="60" y2="222" stroke="#7f6df2" stroke-width="2"/><rect x="44" y="360" width="110" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="99.0" y="381.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Confirm</text><text x="168" y="381" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Press Ctrl+Enter to confirm. Enter is a new line.</text><circle cx="34" cy="160" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="165" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="34" cy="376" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="381" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="1166" cy="98" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="1166" y="103" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The label you gave the action is the step's question; the placeholder is a hint inside the box.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Enter writes a new line; Ctrl+Enter (or Confirm) saves the answer and moves on.</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The answer lands under its key — in the frontmatter, the body or the flow's context.</text></g>
</svg>
