<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Configuring the Selector action in the step builder">
<rect width="1200" height="700" fill="#1e1e1e"/><rect x="24" y="24" width="1152" height="540" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="48" y="60" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Step builder</text><text x="48" y="92" fill="#dcddde" font-family="sans-serif" font-size="19" font-weight="650" text-anchor="start">Selector</text><text x="48" y="116" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Add options to your step that will be displayed in the menu of the action.</text><line x1="24" y1="132" x2="1176" y2="132" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="162" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Element type zone options</text><text x="48" y="182" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Choose where you want to place the element.</text><rect x="932" y="154" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="942" y="175.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Frontmatter</text><polyline points="1129,168 1134,173 1139,168" fill="none" stroke="#8b8e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="48" y1="198" x2="1152" y2="198" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="226" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Key of the property</text><text x="48" y="246" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The metatada key asigned to the element</text><rect x="932" y="218" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="942" y="239.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">type</text><line x1="48" y1="262" x2="1152" y2="262" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="290" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Enable multiple</text><text x="48" y="310" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Enable or disable multiple selection in the selector</text><rect x="1112" y="288" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="1123" cy="299" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><line x1="48" y1="326" x2="1152" y2="326" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="354" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Options</text><rect x="48" y="366" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="58" y="387.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">question</text><rect x="280" y="366" width="420" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="290" y="387.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">A question I am asking</text><text x="724" y="388" fill="#8b8e94" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">☆</text><text x="752" y="387" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">✕</text><rect x="48" y="406" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="58" y="427.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">claim</text><rect x="280" y="406" width="420" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="290" y="427.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">A claim I can argue for</text><text x="724" y="428" fill="#7f6df2" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">☆</text><text x="752" y="427" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">✕</text><rect x="48" y="446" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="58" y="467.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">source</text><rect x="280" y="446" width="420" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="290" y="467.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Something I read</text><text x="724" y="468" fill="#8b8e94" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="start">☆</text><text x="752" y="467" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">✕</text><rect x="48" y="490" width="130" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="113.0" y="511.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">+ Add option</text><circle cx="34" cy="162" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="167" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="34" cy="302" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="307" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="34" cy="352" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="357" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Where the choice goes, and under which key.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">One choice, or several (the wizard then shows checkboxes and a Confirm).</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Each option is a value and a description; the star marks the default.</text>
</svg>
