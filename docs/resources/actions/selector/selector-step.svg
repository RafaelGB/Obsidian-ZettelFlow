<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="The Selector action as a wizard step: a list of options to pick from">
<rect width="1200" height="700" fill="#1e1e1e"/><rect x="24" y="24" width="760" height="540" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="44" y="54" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Step 2</text><text x="90" y="54" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">· about 1 left · Will be created at Zettel/</text><text x="762" y="54" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><rect x="44" y="68" width="46.4" height="26" rx="13" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="67.2" y="86" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Idea</text><text x="94.4" y="86" fill="#5c5f66" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">›</text><rect x="104.4" y="68" width="46.4" height="26" rx="13" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="127.60000000000001" y="86" fill="#fff" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Type</text><line x1="24" y1="108" x2="784" y2="108" stroke="#3a3a3a" stroke-width="1"/><text x="44" y="130" fill="#dcddde" font-family="sans-serif" font-size="19" font-weight="650" text-anchor="start">What kind of note is it?</text><rect x="808" y="24" width="368" height="540" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="824" y="50" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Live preview</text><text x="824" y="76" fill="#8b8e94" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">---</text><text x="824" y="97" fill="#8b8e94" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">idea: Notes owe nothing</text><text x="824" y="118" fill="#a99cf7" font-family="monospace" font-size="13" font-weight="600" text-anchor="start">type: claim</text><text x="824" y="139" fill="#8b8e94" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">---</text><g transform="translate(0,14)"><rect x="44" y="140" width="720" height="48" rx="8" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="66" cy="164" r="6" fill="#8b8e94" stroke="none" stroke-width="2"/><text x="84" y="162" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">A question I am asking</text><text x="84" y="179" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">question</text><rect x="44" y="198" width="720" height="48" rx="8" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="66" cy="222" r="6" fill="#fff" stroke="none" stroke-width="2"/><text x="84" y="220" fill="#fff" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">A claim I can argue for</text><text x="84" y="237" fill="#e6e1ff" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">claim</text><rect x="44" y="256" width="720" height="48" rx="8" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="66" cy="280" r="6" fill="#8b8e94" stroke="none" stroke-width="2"/><text x="84" y="278" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">Something I read</text><text x="84" y="295" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">source</text><rect x="44" y="314" width="720" height="48" rx="8" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="66" cy="338" r="6" fill="#8b8e94" stroke="none" stroke-width="2"/><text x="84" y="336" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">A concrete case</text><text x="84" y="353" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">example</text><text x="56" y="390" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">↑ ↓ to move · Enter to choose</text><circle cx="34" cy="222" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="227" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="34" cy="386" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="391" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="1166" cy="140" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="1166" y="145" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Each option shows your description; the stored value is the key underneath.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">One click or Enter chooses and moves on. With multiple enabled, tick several and Confirm.</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The chosen value lands under the action's key — and can decide which branch the flow takes.</text></g>
</svg>
