 fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="650" text-anchor="start">Notes owe nothing</text><rect x="647" y="42" width="89" height="24" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="659" y="59" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Zettel/</text><rect x="716" y="51" width="10" height="8" rx="2" fill="none" stroke="#8b8e94" stroke-width="1.5"/><path d="M718.5 51 v-2 a2.5 2.5 0 0 1 5 0 v2" fill="none" stroke="#8b8e94" stroke-width="1.5"/><text x="762" y="60" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><rect x="46" y="80" width="560" height="6" rx="3" fill="#3a3a3a" stroke="none" stroke-width="0"/><rect x="46" y="80" width="280.0" height="6" rx="3" fill="#7f6df2" stroke="none" stroke-width="0"/><text x="762" y="87" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">· about 1 left</text><text x="685.8" y="87" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">Step 2</text><text x="46" y="112" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Zettelkasten</text><text x="140" y="112" fill="#5c5f66" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">›</text><text x="154" y="112" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Idea</text><text x="192" y="112" fill="#5c5f66" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">›</text><text x="206" y="112" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Type</text><line x1="24" y1="126" x2="784" y2="126" stroke="#3a3a3a" stroke-width="1"/><circle cx="50" cy="152" r="4" fill="#ec7500" stroke="none" stroke-width="2"/><text x="60" y="156" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Classify</text><text x="126" y="156" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Choose one</text><text x="46" y="186" fill="#dcddde" font-family="sans-serif" font-size="22" font-weight="650" text-anchor="start">What kind of note is it?</text><line x1="24" y1="508" x2="784" y2="508" stroke="#3a3a3a" stroke-width="1"/><rect x="42" y="520" width="74" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="79" y="541" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">‹ Back</text><rect x="686.8" y="520" width="79.19999999999999" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="726.4" y="541.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Confirm</text><text x="674.8" y="541" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Press Enter to confirm.</text><rect x="342.5" y="520" width="178" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="431.5" y="541" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Build with what I have</text><text x="330.5" y="541" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Ctrl+Z back</text><g transform="translate(0,24)"><rect x="44" y="186" width="720" height="34" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1.5"/><circle cx="62" cy="202" r="5.5" fill="none" stroke="#5c5f66" stroke-width="1.6"/><line x1="66" y1="206" x2="70" y2="210" stroke="#5c5f66" stroke-width="1.6"/><text x="80" y="208" fill="#5c5f66" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Search options</text><rect x="44" y="226" width="720" height="56" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><rect x="53" y="235" width="4" height="38" rx="2" fill="#3a3a3a" stroke="none" stroke-width="0"/><text x="70" y="251" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">A question I am asking</text><text x="70" y="270" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">question</text><rect x="44" y="287" width="720" height="56" rx="9" fill="#2b2840" stroke="#7f6df2" stroke-width="1.5"/><rect x="53" y="296" width="4" height="38" rx="2" fill="#3a3a3a" stroke="none" stroke-width="0"/><text x="70" y="312" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">A claim I can argue for</text><rect x="271.20000000000005" y="297" width="59.120000000000005" height="20" rx="10.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="300.76000000000005" y="310.96" fill="#8b8e94" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="middle">default</text><text x="70" y="331" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">claim</text><rect x="44" y="348" width="720" height="56" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><rect x="53" y="357" width="4" height="38" rx="2" fill="#3a3a3a" stroke="none" stroke-width="0"/><text x="70" y="373" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">Something I read</text><text x="70" y="392" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">source</text><rect x="44" y="409" width="720" height="56" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><rect x="53" y="418" width="4" height="38" rx="2" fill="#3a3a3a" stroke="none" stroke-width="0"/><text x="70" y="434" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">A concrete case</text><text x="70" y="453" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">example</text><circle cx="34" cy="296" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="301" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="354" cy="297" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="354" y="302" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="1166" cy="70" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="1166" y="75" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Each option shows your description; the stored value is the key underneath.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The keyboard starts on the default, marked in words. Click, Enter or Confirm takes it.</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The chosen value lands under the action's key — and can decide which branch the flow takes.</text></g>
</svg>
