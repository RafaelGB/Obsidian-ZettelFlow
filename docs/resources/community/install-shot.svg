<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Installing a system, in one continuous shot: a card in the Systems room is a drawing of the system's own canvas; pressed, the drawing grows into the stage, where Try it: walk the flow lights each step and How will you use it? says exactly what Install will write; Install, and the drawing fills the tab, which becomes the canvas, while the notice says the system is in your vault and offers Create a note and Undo.">
<rect x="0" y="0" width="1200" height="600" rx="0" fill="#1a1a1a"/>
<rect x="24" y="20" width="1152" height="560" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="46" cy="40" r="5.5" fill="#fb464c"/>
<circle cx="64" cy="40" r="5.5" fill="#e0a351"/>
<circle cx="82" cy="40" r="5.5" fill="#5cc98a"/>
<text x="600.0" y="45" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Community — Obsidian</text>
<line x1="24" y1="60" x2="1176" y2="60" stroke="#3a3a3a" stroke-width="1"/>
<text x="64" y="100" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">1 · The card</text>
<rect x="64" y="116" width="240" height="210" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/>
<path d="M 144.5 180.0 C 150.7 180.0 150.7 153.1 157.0 153.1" fill="none" stroke="#8b8e94" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
