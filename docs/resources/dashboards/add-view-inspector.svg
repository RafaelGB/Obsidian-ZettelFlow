roke-width="2"/><text x="60" y="356" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">dayFeeling</text><text x="1140" y="356" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">number</text><rect x="40" y="380" width="1120" height="40" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="60" y="406" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">focusLevel</text><text x="1140" y="406" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">number</text><rect x="40" y="430" width="1120" height="40" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="60" y="456" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">goalsAchieved</text><text x="1140" y="456" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">boolean</text><rect x="40" y="480" width="1120" height="40" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="60" y="506" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">project</text><text x="1140" y="506" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">link</text>
