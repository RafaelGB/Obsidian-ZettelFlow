<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="The computed-fields editor: a short guide, this Base's fields, autocomplete and a run preview">
<rect width="1200" height="850" fill="#1e1e1e"/><text x="24" y="34" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">Σ Computed fields — for the value the visual transforms cannot express</text><rect x="24" y="48" width="1152" height="676" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="52" y="86" fill="#dcddde" font-family="sans-serif" font-size="19" font-weight="650" text-anchor="start">Computed fields (advanced)</text><text x="1148" y="84" fill="#8b8e94" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="end">✕</text><text x="52" y="122" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Enable computed fields</text><text x="52" y="142" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Runs JavaScript you write. It reads your rows and the read-only zf API; it cannot reach the network or write a note.</text><rect x="1100" y="112" width="48" height="24" rx="12" fill="#7f6df2"/><circle cx="1136" cy="124" r="9" fill="#ffffff"/><line x1="52" y1="160" x2="1148" y2="160" stroke="#3a3a3a" stroke-width="2"/><rect x="52" y="176" width="640" height="250" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="66" y="204" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">1</text><text x="92" y="204" fill="#5c5f66" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">// Runs once per note. A missing field is undefined.</text><text x="66" y="232" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">2</text><text x="92" y="232" fill="#5c5f66" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">// Return the new fields; use ?? for a default.</text><text x="66" y="260" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">3</text><text x="92" y="260" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">return {</text><text x="66" y="288" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">4</text><text x="92" y="288" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">  score: row.realWorkingHours / 8,</text><text x="66" y="316" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">5</text><text x="92" y="316" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">  week: row.</text><text x="66" y="344" fill="#5c5f66" font-family="monospace" font-size="12" font-weight="400" text-anchor="start">6</text><text x="92" y="344" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">};</text><line x1="185.6" y1="320" x2="185.6" y2="336" stroke="#dcddde" stroke-width="1.5"/><rect x="183.6" y="348" width="270" height="106" rx="8" fill="#000000" opacity="0.35"/><rect x="179.6" y="342" width="270" height="106" rx="8" fill="#2b2b2b" stroke="#3a3a3a" stroke-width="1.5"/><rect x="185.6" y="350" width="258" height="28" rx="5" fill="#2f2a52"/><text x="195.6" y="369" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">row.date</text><text x="437.6" y="369" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">date</text><text x="195.6" y="400" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">row.realWorkingHours</text><text x="437.6" y="400" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">number</text><text x="195.6" y="431" fill="#dcddde" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">row.mood</text><text x="437.6" y="431" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">number</text><circle cx="449.6" cy="342" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="449.6" y="346.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="52" y="456" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Preview</text><text x="52" y="476" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Run the code over these notes. Nothing is saved or written.</text><rect x="612" y="448" width="46.7" height="30" rx="6" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="635.3" y="467.9" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Run</text><rect x="52" y="492" width="640" height="154" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="70" y="518" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Note</text><text x="360" y="518" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">score</text><text x="70" y="544" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">2026-09-28</text><text x="360" y="544" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">0.94</text><text x="70" y="570" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">2026-09-29</text><text x="360" y="570" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">0.81</text><text x="70" y="596" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">2026-09-30</text><text x="360" y="596" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">1.06</text><text x="70" y="622" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">2026-10-01</text><text x="360" y="622" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">—</text><circle cx="52" cy="492" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="52" y="496.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><rect x="52" y="658" width="100.6" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="62" y="674.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Adds 1 field</text><rect x="160" y="658" width="114.1" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="170" y="674.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">score · number</text><text x="290" y="674" fill="#e0a351" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">1 note skipped; its new fields are empty.</text><text x="740" y="196" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">How it works</text><text x="736" y="222" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">• Runs once per note: row holds that note's fields by name.</text><text x="736" y="244" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">• Return an object of new fields — a missing input stays empty,</text><text x="750" y="266" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">never a fake 0; use ?? for a default.</text><text x="736" y="288" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">• Declare { value, type } when inference would get it wrong.</text><text x="736" y="320" fill="#a594f9" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">How computed fields work ↗</text><circle cx="724" cy="190" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="724" y="194.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="724" y="360" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Fields in this Base</text><rect x="724" y="372" width="147.7" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="734" y="388.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">date · date · 42/42</text><rect x="724" y="404" width="241.8" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="734" y="420.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">realWorkingHours · number · 40/42</text><rect x="724" y="436" width="161.1" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="734" y="452.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">mood · number · 42/42</text><rect x="724" y="468" width="181.3" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="734" y="484.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">focus · category · 38/42</text><rect x="724" y="500" width="167.8" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="734" y="516.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">project · link · 12/42</text><circle cx="724" cy="404" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="724" y="408.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><rect x="980" y="676" width="69.4" height="30" rx="6" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="1014.7" y="695.9" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Cancel</text><rect x="1068" y="676" width="54.2" height="30" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="1.5"/><text x="1095.1" y="695.9" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Save</text><circle cx="44" cy="750" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="754.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="64" y="755" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The three rules, on screen, with a link to the docs; off by default, and it says what it may do.</text><circle cx="44" cy="776" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="780.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="64" y="781" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">This Base's fields as chips with how many notes carry each — dashed when some lack it. Click to insert.</text><circle cx="44" cy="802" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="806.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="64" y="807" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">row. completes those fields and zf. the read-only API, with hover docs.</text><circle cx="44" cy="828" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="832.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="64" y="833" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Run previews the result in memory: the new columns, their types, and any note it skipped.</text>
</svg>
