<rect x="60" y="20" width="1080" height="620" rx="12" fill="#232323" stroke="#3a3a3a" stroke-width="2"/><text x="90" y="60" fill="#dcddde" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="start">Computed fields (advanced)</text><text x="90" y="96" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">• Runs once per note: row holds that note's fields. A missing field is undefined.</text><text x="90" y="120" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">• Return the new fields: { score: row.hours / 8 } — missing in, empty out.</text><rect x="90" y="140" width="236" height="30" rx="15" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2"/><text x="104" y="160" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">date  date  42/42</text><rect x="340" y="140" width="236" height="30" rx="15" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="6 4"/><text x="354" y="160" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">realWorkingHours  number  38/42</text><rect x="590" y="140" width="236" height="30" rx="15" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="6 4"/><text x="604" y="160" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">dayFeeling  number  40/42</text><rect x="840" y="140" width="236" height="30" rx="15" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="6 4"/><text x="854" y="160" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">tags  unknown  12/42</text><rect x="90" y="186" width="1020" height="190" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="110" y="216" fill="#6a9955" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">// Runs once per note. A field this note does not have is undefined.</text><text x="110" y="246" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">return {</text><text x="110" y="276" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">    score: row.realWorkingHours / 8,</text><text x="110" y="306" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">    long: row.realWorkingHours &gt; 7,</text><text x="110" y="336" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">};</text><rect x="370" y="262" width="220" height="60" rx="6" fill="#2b2b2b" stroke="#3a3a3a" stroke-width="2"/><text x="384" y="284" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">realWorkingHours  number</text><text x="384" y="306" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">dayFeeling  number</text><text x="90" y="410" fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="start">Preview</text><rect x="990" y="392" width="120" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="1050" y="413" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">▶ Run</text><text x="90" y="446" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Adds 2 fields   score number   long boolean</text><text x="90" y="480" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">2026-09-29</text><text x="310" y="480" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">0.88</text><text x="530" y="480" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">true</text><text x="90" y="508" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">2026-09-30</text><text x="310" y="508" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">1</text><text x="530" y="508" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">true</text><text x="90" y="536" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">2026-10-01</text><text x="310" y="536" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">—</text><text x="530" y="536" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">—</text><rect x="90" y="568" width="1020" height="40" rx="6" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2"/><text x="108" y="593" fill="#e0a351" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">⚠ 1 note skipped; its new fields are empty.  2026-10-01: Cannot read properties of undefined</text>
