<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="The Tasks panel: the Base's tasks grouped by note, ticked off from the dashboard">
<rect width="1200" height="690" fill="#1e1e1e"/><text x="24" y="34" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">The Tasks panel — no field to map: the Base already chose the notes</text><rect x="24" y="48" width="560" height="500" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="38" y="72" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">This week's tasks</text><text x="566" y="72" fill="#8b8e94" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="middle">⋯</text><text x="40" y="98" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">5 open · 12 done</text><circle cx="168" cy="93" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="168" y="97.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="44" y="148" fill="#a594f9" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">2026-09-30</text><rect x="48" y="168" width="16" height="16" rx="4" fill="#262626" stroke="#8b8e94" stroke-width="1.5"/><text x="76" y="181" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Call the supplier</text><rect x="76" y="202" width="16" height="16" rx="4" fill="#262626" stroke="#8b8e94" stroke-width="1.5"/><text x="104" y="215" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Find the number</text><rect x="48" y="236" width="16" height="16" rx="4" fill="#7f6df2" stroke="#7f6df2" stroke-width="1.5"/><path d="M52,244.5 L55,247.5 L60.5,241" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="249" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start" text-decoration="line-through">Send the invoice</text><text x="44" y="294" fill="#a594f9" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">2026-10-01</text><rect x="48" y="314" width="16" height="16" rx="4" fill="#262626" stroke="#8b8e94" stroke-width="1.5"/><text x="76" y="327" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Review the draft</text><rect x="48" y="348" width="16" height="16" rx="4" fill="#262626" stroke="#8b8e94" stroke-width="1.5"/><text x="76" y="361" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Book the room</text><text x="44" y="406" fill="#a594f9" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">2026-10-02</text><rect x="48" y="426" width="16" height="16" rx="4" fill="#262626" stroke="#8b8e94" stroke-width="1.5"/><text x="76" y="439" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Plan next sprint</text><rect x="48" y="460" width="16" height="16" rx="4" fill="#7f6df2" stroke="#7f6df2" stroke-width="1.5"/><path d="M52,468.5 L55,471.5 L60.5,465" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="473" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start" text-decoration="line-through">Write the weekly review</text><circle cx="32" cy="142" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="32" y="146.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="32" cy="252" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="32" y="256.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="616" y="34" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">2026-09-30 — the line you ticked, and only that line</text><rect x="616" y="48" width="560" height="300" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="648" y="98" fill="#8b8e94" font-family="monospace" font-size="15" font-weight="400" text-anchor="start">## Today</text><text x="648" y="132" fill="#dcddde" font-family="monospace" font-size="15" font-weight="400" text-anchor="start">- [ ] Call the supplier</text><text x="648" y="166" fill="#dcddde" font-family="monospace" font-size="15" font-weight="400" text-anchor="start">    - [ ] Find the number</text><text x="648" y="200" fill="#dcddde" font-family="monospace" font-size="15" font-weight="400" text-anchor="start">- [x] Send the invoice</text><text x="648" y="234" fill="#dcddde" font-family="monospace" font-size="15" font-weight="400" text-anchor="start">- [ ] Draft the brief</text><rect x="673" y="183" width="14" height="22" rx="3" fill="none" stroke="#e0a351" stroke-width="2"/><text x="648" y="300" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">[ ] → [x]: one character, recorded, and the checkbox is its own undo.</text><text x="648" y="322" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">If the line changed since the panel read it, nothing is written.</text><text x="616" y="380" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">In the panel dialog</text><rect x="616" y="394" width="560" height="150" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="640" y="438" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Show</text><rect x="940" y="420" width="200" height="28" rx="6" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="950" y="439" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Open</text><text x="1132" y="439" fill="#8b8e94" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="end">▾</text><text x="640" y="498" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Group by note</text><rect x="1092" y="482" width="48" height="24" rx="12" fill="#7f6df2"/><circle cx="1128" cy="494" r="9" fill="#ffffff"/><circle cx="622" cy="432" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="622" y="436.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="44" cy="580" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="584.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="64" y="585" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The counts — then the tasks, in the order they appear in each note.</text><circle cx="44" cy="606" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="610.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="64" y="611" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Grouped under each note's name; subtasks indented. Click a task to open its note at that line.</text><circle cx="44" cy="632" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="636.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="64" y="637" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Tick it where you see it: [ ] becomes [x] in the note, and nothing else — the one write a dashboard makes.</text><circle cx="44" cy="658" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="662.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="64" y="663" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Show open, done or all; group by note or not. A Filter on date · last 7 days makes it “this week”.</text>
</svg>
