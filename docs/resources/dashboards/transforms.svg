<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-label="No-code transforms: a stat over the last 7 days, and a moving average">
<rect width="1200" height="710" fill="#1e1e1e"/><text x="24" y="34" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">Transforms — a small pipeline, applied in order before the chart draws</text><rect x="24" y="48" width="540" height="380" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="48" y="86" fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="650" text-anchor="start">Transforms</text><text x="48" y="108" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Reshape this panel's data, step by step.</text><text x="48" y="126" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Nothing is written to your notes.</text><rect x="48" y="150" width="492" height="74" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="66" y="176" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="start">1</text><rect x="86" y="160" width="62" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="96" y="176.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Filter</text><rect x="154" y="160" width="48" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="164" y="176.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">date</text><rect x="86" y="190" width="146" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="96" y="206.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">in the last … days</text><rect x="238" y="190" width="27" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="248" y="206.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">7</text><text x="522" y="176" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">✕</text><rect x="48" y="238" width="492" height="74" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="66" y="264" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="start">2</text><rect x="86" y="248" width="118" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="96" y="264.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Moving average</text><rect x="210" y="248" width="132" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="220" y="264.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">realWorkingHours</text><rect x="86" y="278" width="76" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="96" y="294.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">window 7</text><rect x="168" y="278" width="97" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="178" y="294.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">→ hours_avg</text><text x="522" y="264" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">✕</text><text x="48" y="352" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Add transform</text><rect x="330" y="334" width="210" height="28" rx="6" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="340" y="353" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Group by</text><text x="532" y="353" fill="#8b8e94" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="end">▾</text><circle cx="48" cy="150" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="48" y="154.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="48" cy="238" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="48" y="242.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="48" y="404" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">filter · sort · group by · aggregate · bin · calculate · normalize · moving average · cumulative</text><rect x="596" y="48" width="580" height="150" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="610" y="72" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Average hours worked, last 7 days</text><text x="1158" y="72" fill="#8b8e94" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="middle">⋯</text><text x="616" y="140" fill="#a594f9" font-family="sans-serif" font-size="46" font-weight="700" text-anchor="start">6.4 h</text><text x="760" y="140" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Stat · value realWorkingHours · average</text><text x="616" y="176" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Today counts as one of the seven; a date in the future never matches.</text><circle cx="596" cy="48" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="596" y="52.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><rect x="596" y="222" width="580" height="336" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="610" y="246" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Hours, with a 7-day moving average</text><text x="1158" y="246" fill="#8b8e94" font-family="sans-serif" font-size="16" font-weight="400" text-anchor="middle">⋯</text><line x1="630" y1="500" x2="1150" y2="500" stroke="#3a3a3a" stroke-width="1.5"/><line x1="630" y1="442.5" x2="1150" y2="442.5" stroke="#2e2e2e" stroke-width="1"/><line x1="630" y1="385" x2="1150" y2="385" stroke="#2e2e2e" stroke-width="1"/><line x1="630" y1="327.5" x2="1150" y2="327.5" stroke="#2e2e2e" stroke-width="1"/><path d="M630.0,365.8 L657.4,346.7 L684.7,404.2 L712.1,308.3 L739.5,327.5 L766.8,461.7 L794.2,385.0 L821.6,327.5 L848.9,289.2 L876.3,365.8 L903.7,423.3 L931.1,346.7 L958.4,327.5 L985.8,385.0 L1013.2,308.3 L1040.5,346.7 L1067.9,404.2 L1095.3,365.8 L1122.6,327.5 L1150.0,308.3" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M630.0,365.8 L657.4,356.2 L684.7,372.2 L712.1,356.2 L739.5,350.5 L766.8,369.0 L794.2,371.3 L821.6,365.8 L848.9,357.6 L876.3,352.1 L903.7,368.6 L931.1,371.3 L958.4,352.1 L985.8,352.1 L1013.2,349.4 L1040.5,357.6 L1067.9,363.1 L1095.3,354.9 L1122.6,352.1 L1150.0,349.4" fill="none" stroke="#a594f9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="630" y1="528" x2="652" y2="528" stroke="#5c5f66" stroke-width="2"/><text x="660" y="532" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">realWorkingHours</text><line x1="800" y1="528" x2="822" y2="528" stroke="#a594f9" stroke-width="3.5"/><text x="830" y="532" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">hours_avg — virtual, never written</text><circle cx="1150" cy="330" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="1150" y="334.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="44" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="604.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="64" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Filter has a relative window for dates — in the last … days — so a panel stays on “this week” by itself.</text><circle cx="44" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="630.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="64" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Average hours in the last week is one Stat with one Filter step: no date to keep editing.</text><circle cx="44" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="656.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="64" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">A calculated, binned or averaged field is virtual: it exists only for the render.</text><circle cx="44" cy="678" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="682.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="64" y="683" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Raw values faint, the smoothed series in the accent — two series of one panel.</text>
</svg>
