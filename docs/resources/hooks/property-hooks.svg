<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="A property hook: in a note, status changes from doing to done; the hook for status, with its run condition event.newValue === 'done', runs its script and sets completed to today's date; a notice says A hook set completed on Retrieval practice, with Undo. The hooks live in Settings, Automation, Property hooks.">
<rect x="0" y="0" width="1200" height="600" rx="0" fill="#1a1a1a"/>
<rect x="24" y="20" width="1152" height="560" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="46" cy="40" r="5.5" fill="#fb464c"/>
<circle cx="64" cy="40" r="5.5" fill="#e0a351"/>
<circle cx="82" cy="40" r="5.5" fill="#5cc98a"/>
<text x="600.0" y="45" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">My vault — Obsidian</text>
<line x1="24" y1="60" x2="1176" y2="60" stroke="#3a3a3a" stroke-width="1"/>
<text x="64" y="100" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">1 · You change a property</text>
<rect x="64" y="116" width="340" height="236" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="88" y="148" fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="650" text-anchor="start">Retrieval practice</text>
<rect x="88" y="172" width="292" height="38" rx="6" fill="#232323" stroke="#8f7ff5" stroke-width="1.5"/>
<text x="104" y="196" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">status</text>
<text x="196" y="196" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">doing → done</text>
<rect x="88" y="222" width="292" height="38" rx="6" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
<text x="104" y="246" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">tags</text>
<text x="196" y="246" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">learning</text>
<rect x="88" y="272" width="292" height="38" rx="6" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
<text x="104" y="296" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">completed</text>
<text x="196" y="296" fill="#5cc98a" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">2026-10-14</text>
<text x="88" y="336" fill="#5cc98a" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">completed appears: the hook wrote it</text>
<path d="M 412 200 L 452 200" fill="none" stroke="#8f7ff5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 446 194 L 454 200 L 446 206" fill="none" stroke="#8f7ff5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="468" y="100" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">2 · The hook for status runs</text>
<rect x="468" y="116" width="380" height="296" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="492" y="148" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="650" text-anchor="start">status</text>
<text x="552" y="148" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">when status changes</text>
<rect x="788" y="134" width="36" height="20" rx="10" fill="#7f6df2"/>
<circle cx="814" cy="144" r="7" fill="#ffffff"/>
<text x="492" y="180" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Run condition</text>
<rect x="492" y="190" width="332" height="32" rx="6" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
<text x="504" y="211" fill="#e0a351" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">event.newValue === 'done'</text>
<text x="492" y="248" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Hook script</text>
<rect x="492" y="258" width="332" height="98" rx="6" fill="#1c1b22" stroke="#3a3a3a" stroke-width="1"/>
<text x="504" y="280" fill="#dcddde" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">const today = new Date()</text>
<text x="504" y="300" fill="#dcddde" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">    .toISOString().slice(0, 10);</text>
<text x="504" y="320" fill="#5aa9f0" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">event.response.frontmatter</text>
<text x="504" y="340" fill="#dcddde" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">    .completed = today;</text>
<rect x="492" y="368" width="150" height="32" rx="6" fill="#2a2936" stroke="#3a3a3a" stroke-width="1"/>
<text x="567.0" y="388.5" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Test on active note</text>
<rect x="654" y="368" width="100" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="1"/>
<text x="704.0" y="388.5" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="500" text-anchor="middle">Save hook</text>
<path d="M 856 200 L 896 200" fill="none" stroke="#8f7ff5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 890 194 L 898 200 L 890 206" fill="none" stroke="#8f7ff5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="912" y="100" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">3 · It says what it did</text>
<rect x="912" y="116" width="224" height="112" rx="10" fill="#2a2938" stroke="#3d3b54" stroke-width="1.5"/>
<text x="928" y="146" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">A hook set completed</text>
<text x="928" y="166" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">on Retrieval practice.</text>
<rect x="928" y="182" width="72" height="28" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="1"/>
<text x="964.0" y="200.5" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="500" text-anchor="middle">Undo</text>
<text x="912" y="262" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="start">If it fails</text>
<text x="912" y="282" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">the hook says what a failure does,</text>
<text x="912" y="300" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">and every run is in the run log.</text>
<text x="912" y="336" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Its write is recorded,</text>
<text x="912" y="354" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">so the notice can take it back.</text>
<text x="600" y="470" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Where they live</text>
<rect x="390" y="486" width="420" height="40" rx="20" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
<text x="600" y="511" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="middle">Settings → ZettelFlow → Automation → Property hooks</text>
<text x="600" y="556" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">One property, one hook · a paused hook is dimmed and skipped · a dry run writes nothing</text>
</svg>
