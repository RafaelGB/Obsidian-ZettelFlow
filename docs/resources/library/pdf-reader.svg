<text x="410.0" y="45" fill="#5f6168" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" >My vault — Obsidian</text>
<line x1="30" y1="60" x2="790" y2="60" stroke="#3a3a3a" stroke-width="1"/>
