<text x="410" y="140" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="2">PAGE 6 / 12</text>
<rect x="318" y="156" width="184" height="24" rx="12" fill="#26242e" stroke="none" stroke-width="1.5" />
<text x="410" y="172.5" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle" >3. Asynchronous networks</text>
<text x="110" y="222" fill="#dcddde" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="start" >3  Asynchronous Networks</text>
<text x="110" y="262" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >In this section we consider the asynchronous network model,</text>
<text x="110" y="290" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >in which there is no clock, and nodes must make decisions</text>
<text x="110" y="318" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >based only on the messages received and local computation.</text>
<rect x="108" y="343" width="431" height="25" rx="3" fill="#e0a351" stroke="none" stroke-width="1.5" fill-opacity="0.32"/>
<line x1="110" y1="367" x2="537" y2="367" stroke="#7f6df2" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="110" y="362" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >It is impossible in the asynchronous network model to</text>
<rect x="108" y="371" width="407" height="25" rx="3" fill="#e0a351" stroke="none" stroke-width="1.5" fill-opacity="0.32"/>
<line x1="110" y1="395" x2="512" y2="395" stroke="#7f6df2" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="110" y="390" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >implement a read/write data object that guarantees</text>
<rect x="108" y="399" width="471" height="25" rx="3" fill="#e0a351" stroke="none" stroke-width="1.5" fill-opacity="0.32"/>
<line x1="110" y1="423" x2="577" y2="423" stroke="#7f6df2" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="110" y="418" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >availability and atomic consistency in all fair executions</text>
<text x="110" y="446" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >(including those in which messages are lost).</text>
<text x="110" y="490" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >The proof proceeds by contradiction: assume an algorithm A</text>
<text x="110" y="518" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >exists that meets the three criteria, and construct an</text>
<text x="110" y="546" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >execution in which A returns an inconsistent response.</text>
<text x="110" y="600" fill="#5f6168" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start" font-style="italic" >The paper is never written: each highlight is found again on its page, by its words.</text>
<rect x="560" y="380" width="210" height="74" rx="6" fill="#1f1f23" stroke="#3a3a3a" stroke-width="1" />
<rect x="560" y="380" width="3" height="74" rx="1.5" fill="#e0a351"/>
<text x="575" y="401" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="start" >p. 6</text>
<text x="575" y="421" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start" >The theorem behind</text>
<text x="575" y="439" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start" >“just use a database”.</text>
