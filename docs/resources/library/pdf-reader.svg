<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-label="A PDF in the Reader: a paper's page reflowed into the reading column with a highlight and a note in the margin, the Page view switch in the bar — and a scanned PDF that says, before you try, that it can be read but not highlighted">
