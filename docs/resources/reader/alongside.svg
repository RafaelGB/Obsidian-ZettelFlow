<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Alongside, in the one drawer. Left: a book in the Reader, the column moved left to make room, the paragraph at the reading line a third of the way down naming the planning fallacy; the Reader's own exit sits at the end of the column's top line, never over the drawer. Right: the drawer holds Alongside, headed Near this paragraph, with its own close; seven lens chips — All, Connections, Contradictions, Questions, Your knowledge, Research, Not yet notes — and no number on any of them; your highlight on this page first, then cards, each saying in one line why it is there: Planning fallacy, named in this paragraph; Optimism bias, linked from Planning fallacy; Ship small, said near this passage before. While the drawer is open the margin's list steps back. The bar is centred under the column, its Alongside button pressed. Switching to Contents or Type swaps what the drawer holds, in place.">
<rect width="1200" height="800" fill="#141416"/>
<text x="600.0" y="44" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">ALONGSIDE · YOUR VAULT BESIDE THE PAGE</text>
<rect x="40" y="64" width="1120" height="680" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="76" y="98" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">THINKING, FAST AND SLOW · DANIEL KAHNEMAN</text>
<path d="M 740.0 90.0 L 748.0 98.0 M 748.0 90.0 L 740.0 98.0" stroke="#8b8e94" stroke-width="1.5" fill="none"/>
<text x="410" y="140" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle" letter-spacing="2.2">23 · THE OUTSIDE VIEW</text>
<text x="240" y="190" fill="#c8c9cc" font-family="serif" font-size="15">The plans and forecasts were unrealistically</text>
<text x="240" y="217" fill="#c8c9cc" font-family="serif" font-size="15">close to best-case scenarios. This is what</text>
<rect x="356.8" y="231" width="136.0" height="19" rx="3" fill="#e0a351" opacity="0.28"/>
<text x="240" y="244" fill="#c8c9cc" font-family="serif" font-size="15">Amos and I called the planning fallacy:</text>
<text x="240" y="271" fill="#c8c9cc" font-family="serif" font-size="15">forecasts that are too close to best case</text>
<text x="240" y="298" fill="#c8c9cc" font-family="serif" font-size="15">and could be improved by consulting the</text>
<text x="240" y="325" fill="#c8c9cc" font-family="serif" font-size="15">statistics of similar cases.</text>
<text x="240" y="352" fill="#c8c9cc" font-family="serif" font-size="15"></text>
<text x="240" y="379" fill="#c8c9cc" font-family="serif" font-size="15">Executives make decisions based on</text>
<text x="240" y="406" fill="#c8c9cc" font-family="serif" font-size="15">delusional optimism rather than on a</text>
<text x="240" y="433" fill="#c8c9cc" font-family="serif" font-size="15">rational weighting of gains, losses and</text>
<text x="240" y="460" fill="#c8c9cc" font-family="serif" font-size="15">probabilities.</text>
