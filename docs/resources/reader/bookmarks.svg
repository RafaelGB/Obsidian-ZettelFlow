<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Bookmarks, and where you've been, in the one drawer. Left: a page of a book with the bookmark ribbon filled at the column's top-right corner, and the line you landed on marked for a moment under the words. Right: the drawer on its Bookmarks tab — Contents, Bookmarks and Where you've been as three chips with no count, then the pencil for Recall and the notebook, then its close — two bookmarks with their chapter, their first words and when they were made, each with a remove button. Below it the same drawer on Where you've been: newest first, Before a search and Before a link, each with its chapter; the back pill, Alt and the left arrow, and two fingers swiping right walk the same trail. Bottom: going to a place is a camera move; a far page is reached by sliding the last three pages, faint at first, never by a cut.">
