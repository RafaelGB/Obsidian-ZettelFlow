<text x="410" y="140" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle" letter-spacing="2.2">04. POR QUÉ LOS SISTEMAS NOS SORPRENDEN</text>
<text x="250" y="190" fill="#c8c9cc" font-family="serif" font-size="15">Todo lo que creemos saber sobre el mundo</text>
<text x="250" y="216" fill="#c8c9cc" font-family="serif" font-size="15">es un modelo. Nuestros modelos suelen</text>
<text x="250" y="242" fill="#c8c9cc" font-family="serif" font-size="15">coincidir bastante con el mundo real,</text>
<text x="250" y="268" fill="#c8c9cc" font-family="serif" font-size="15">pero nunca del todo.</text>
<text x="250" y="294" fill="#c8c9cc" font-family="serif" font-size="15"></text>
<rect x="248.0" y="307" width="281.2" height="19" rx="3" fill="#7f6df2" opacity="0.22"/>
<text x="250" y="320" fill="#c8c9cc" font-family="serif" font-size="15">Los sistemas nos sorprenden porque nuestra</text>
<text x="250" y="346" fill="#c8c9cc" font-family="serif" font-size="15">mente prefiere los acontecimientos a los</text>
<text x="250" y="372" fill="#c8c9cc" font-family="serif" font-size="15">comportamientos, y los comportamientos a</text>
<text x="250" y="398" fill="#c8c9cc" font-family="serif" font-size="15">las estructuras que los generan.</text>
<text x="250" y="440" fill="#a99cf5" font-family="sans-serif" font-size="11">the line you landed on, marked for a moment</text>
