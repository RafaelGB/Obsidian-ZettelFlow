<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Cite a passage. Left: a book in the Reader, a highlighted sentence and its popover with More open: the dots, Add a note and More, then Open in Think and Delete, then Claim, Link to an idea, Crystallize and Cite. The Cite panel grows from the menu, a faint dot marking the point it grows from: headed Cite this passage, with five chips, Markdown, Inline, Citation key, BibTeX and CSL JSON, Inline chosen, and its text reading (Kahneman, 2011, ch. 3); below it, the Copy button reads Copied with a check. Right, above: the same panel on Markdown, the passage as a quote and the line Daniel Kahneman, Thinking, Fast and Slow (2011), ch. 3, with a link back to the book's chapter; and on BibTeX, an @book entry with its author, title, year and publisher. Right, below: a paper whose details have no year, its panel on Inline reading (Flyvbjerg, n.d., p. 6) and the quiet line No year in this paper's details, Add it, which opens the Library detail at Year. Underneath: drawn from the book's note; what is missing is left out, never guessed; Copy is all it does, nothing written.">
