<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Make it a claim, or link it to an idea. Left: a book in the Reader, a sentence naming the planning fallacy selected, and its popover: the four meanings, then the first row, Highlight and note, Claim and Link to an idea. A dashed arc shows the selected words travelling from the page into the quote of the claim sheet on the right, which stands in Alongside's place beside the page: Make it a claim, the claim box holding Big projects fail by underestimating complexity, the title, the passage quoted, the source as it will be written with the book, the chapter and page 143, the folder, and Cancel and Create. Below the popover, the picker grown from Link to an idea: Find an idea, Planning fallacy at the top as near this passage, Optimism bias, and the line Already linked to this passage under a second pick. At the bottom of the sheet's slot, From this reading lists Claim: Big projects fail by underestimating complexity and Linked to Optimism bias. Underneath: your own act, nothing to accept; a taken name is never overwritten; the highlight is kept; no AI.">
