<rect x="850" y="474" width="280" height="40" rx="10" fill="#2a2a30" stroke="#3a3a3a"/>
<text x="866" y="499" fill="#8b8e94" font-size="12">‹</text>
<text x="884" y="499" fill="#8b8e94" font-size="10">Chapter 4 / 38</text>
<text x="966" y="499" fill="#8b8e94" font-size="12">›</text>
<g fill="#8b8e94" font-size="11"><text x="986" y="499">☰</text><text x="1006" y="499">⌕</text><text x="1026" y="499">T</text></g>
<rect x="1042" y="482" width="26" height="24" rx="6" fill="#7f6df2" stroke="#7f6df2"/>
<text x="1055" y="499" fill="#ffffff" font-size="11" text-anchor="middle">◎</text>
<text x="1090" y="499" fill="#8b8e94" font-size="11">⌨</text>
<text x="1055" y="560" fill="#a99cf5" font-size="10" text-anchor="middle">Leave deep reading · F</text>
<path d="M 1055 548 v -38" stroke="#a99cf5" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="990" y="590" fill="#5f6168" font-size="10" text-anchor="middle">in quickly (120 ms); still for two seconds, it fades (400 ms)</text>
<text x="990" y="606" fill="#5f6168" font-size="10" text-anchor="middle">a panel, search or a popover keeps it</text>
</g>

<text x="600" y="624" fill="#5f6168" font-family="sans-serif" font-size="10" text-anchor="middle">Esc: the nearest thing first, then deep reading, then the Reader · on an iPad the status bar stays</text>
