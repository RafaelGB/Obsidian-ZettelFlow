<path d="M 772 222 l 8 6 l -8 6" fill="none" stroke="#a99cf5" stroke-width="1.5"/>
<text x="760" y="214" fill="#a99cf5" font-size="9" text-anchor="end">margin to its side</text>
<text x="442" y="176" fill="#dcddde" font-family="serif" font-size="18" font-weight="700">4 · The associative machine</text>
<g fill="#b3b5ba" font-family="serif" font-size="12">
<text x="442" y="206">An idea that has been activated does</text>
<text x="442" y="226">not merely evoke one other idea. It</text>
<text x="442" y="246">activates many ideas, which in turn</text>
</g>
<rect x="438" y="254" width="236" height="20" rx="3" fill="#7f6df2" fill-opacity="0.14"/>
<text x="442" y="268" fill="#dcddde" font-family="serif" font-size="12">activate others. Furthermore, only a</text>
<path d="M 680 264 h 18" stroke="#a99cf5" stroke-width="1.5"/>
<text x="702" y="268" fill="#a99cf5" font-size="9">your line:</text>
<text x="702" y="280" fill="#a99cf5" font-size="9">it does not move</text>
<g fill="#b3b5ba" font-family="serif" font-size="12">
<text x="442" y="290">few of the activated ideas will register</text>
<text x="442" y="310">in consciousness; most of the work of</text>
<text x="442" y="330">associative thinking is silent, hidden</text>
<text x="442" y="350">from our conscious selves.</text>
<text x="442" y="380">The notion that we have limited access</text>
<text x="442" y="400">to the workings of our minds is</text>
</g>
<rect x="452" y="446" width="296" height="26" rx="13" fill="#2a2a30"/>
<text x="600" y="463" fill="#8b8e94" font-size="10" text-anchor="middle">Move the pointer for the controls · Esc to leave</text>
<text x="600" y="490" fill="#5f6168" font-size="9" text-anchor="middle">said once, for two seconds; not a notice</text>
<path d="M 600 512 v 16" stroke="#a99cf5" stroke-width="1.5"/>
<path d="M 594 520 l 6 8 l 6 -8" fill="none" stroke="#a99cf5" stroke-width="1.5"/>
<text x="612" y="524" fill="#a99cf5" font-size="9">bar slides down</text>
<text x="600" y="560" fill="#a99cf5" font-size="10" text-anchor="middle">one 250 ms gesture · the window goes fullscreen on a desktop</text>
<text x="600" y="576" fill="#5f6168" font-size="10" text-anchor="middle">Space, the arrows and the page's edges turn quietly</text>
</g>

<!-- ── 3 · the controls back ────────────────────────────────────────────── -->
<g font-family="sans-serif">
<text x="990" y="80" fill="#8b8e94" font-size="12" font-weight="600" text-anchor="middle">3 · You move: the controls come back</text>
<rect x="810" y="96" width="360" height="440" rx="14" fill="#1e1e22" stroke="#3a3a3a"/>
<rect x="810" y="96" width="140" height="3" fill="#7f6df2"/>
