<path d="M 1110 134 h 18 v 30 l -9 -7 l -9 7 z" fill="none" stroke="#5f6168" stroke-width="1.5"/>
<text x="832" y="176" fill="#dcddde" font-family="serif" font-size="18" font-weight="700">4 · The associative machine</text>
<g fill="#b3b5ba" font-family="serif" font-size="12">
<text x="832" y="206">An idea that has been activated does</text>
<text x="832" y="226">not merely evoke one other idea. It</text>
<text x="832" y="246">activates many ideas, which in turn</text>
<text x="832" y="268">activate others. Furthermore, only a</text>
<text x="832" y="290">few of the activated ideas will register</text>
<text x="832" y="310">in consciousness; most of the work of</text>
<text x="832" y="330">associative thinking is silent, hidden</text>
<text x="832" y="350">from our conscious selves.</text>
