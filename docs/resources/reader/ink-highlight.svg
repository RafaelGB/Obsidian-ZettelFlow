<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="The highlighter: in three moments, a highlighter stroke drawn along a line of a chapter, a wide translucent nib; the stroke fading as the yellow marker sweeps across the same words from the side the stroke began; and the highlight kept, with the quiet status line Highlighted as an idea. Kept in Think. offering Undo and Keep as ink">
<rect width="1200" height="560" fill="#141416"/>
<rect x="40" y="30" width="1120" height="500" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="62" cy="50" r="5.5" fill="#fb464c"/>
<circle cx="80" cy="50" r="5.5" fill="#e9973f"/>
<circle cx="98" cy="50" r="5.5" fill="#44cf6e"/>
<text x="600" y="55" fill="#5f6168" font-family="sans-serif" font-size="12.5" text-anchor="middle">My vault — Obsidian</text>
<line x1="40" y1="70" x2="1160" y2="70" stroke="#3a3a3a" stroke-width="1"/>
<text x="90" y="100" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="600">A PHILOSOPHY OF SOFTWARE DESIGN  ·  JOHN OUSTERHOUT</text>

<!-- three moments of one gesture, left to right -->
<g font-family="sans-serif" font-size="12" font-weight="600" fill="#5f6168">
<text x="80" y="140">1 · THE HIGHLIGHTER, ALONG THE LINE</text>
<text x="440" y="140">2 · THE INK BECOMES THE MARK</text>
<text x="800" y="140">3 · KEPT, WITH ITS WAY BACK</text>
</g>
<line x1="420" y1="130" x2="420" y2="500" stroke="#2a2a2e" stroke-width="1"/>
<line x1="780" y1="130" x2="780" y2="500" stroke="#2a2a2e" stroke-width="1"/>

<!-- the same paragraph in each frame -->
<g font-family="Georgia, serif" font-size="16" fill="#dcddde">
<text x="80" y="190">The best modules are those that</text>
<text x="80" y="218">provide powerful functionality yet</text>
<text x="80" y="246">have simple interfaces. A deep</text>
<text x="80" y="274">module hides a great deal of</text>
<text x="80" y="302">complexity behind its interface.</text>

<text x="440" y="190">The best modules are those that</text>
<text x="440" y="218">provide powerful functionality yet</text>
<text x="440" y="246">have simple interfaces. A deep</text>
<text x="440" y="274">module hides a great deal of</text>
<text x="440" y="302">complexity behind its interface.</text>

<text x="800" y="190">The best modules are those that</text>
<text x="800" y="218">provide powerful functionality yet</text>
<text x="800" y="246">have simple interfaces. A deep</text>
<text x="800" y="274">module hides a great deal of</text>
<text x="800" y="302">complexity behind its interface.</text>
</g>

<!-- 1: a highlighter stroke along "have simple interfaces." — the wide nib in the wash of its meaning -->
<path d="M84 241 C110 239 140 243 170 241 C200 239 230 242 256 240" fill="none" stroke="#e0de71" stroke-width="20" stroke-linecap="round" opacity="0.32"/>
<text x="80" y="350" fill="#8a8c94" font-family="sans-serif" font-size="12.5">a highlighter stroke over a line —</text>
<text x="80" y="368" fill="#8a8c94" font-family="sans-serif" font-size="12.5">the nearest line, whole words</text>
<text x="80" y="398" fill="#5f6168" font-family="sans-serif" font-size="12">with the pen, every stroke stays ink</text>

<!-- 2: the stroke fading while the marker sweeps from where it began -->
<rect x="438" y="230" width="150" height="21" rx="3" fill="#e0de71" opacity="0.38"/>
<rect x="588" y="230" width="34" height="21" rx="3" fill="#e0de71" opacity="0.16"/>
<path d="M444 241 C470 239 500 243 530 241 C560 239 590 242 616 240" fill="none" stroke="#e0de71" stroke-width="20" stroke-linecap="round" opacity="0.1"/>
<path d="M600 262 L620 262 M612 256 L620 262 L612 268" fill="none" stroke="#5f6168" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="350" fill="#8a8c94" font-family="sans-serif" font-size="12.5">the stroke fades as the marker sweeps</text>
<text x="440" y="368" fill="#8a8c94" font-family="sans-serif" font-size="12.5">the words, from the side you started</text>
<text x="440" y="398" fill="#5f6168" font-family="sans-serif" font-size="12">no wait: the mark first, the write after</text>

<!-- 3: the highlight, and the quiet status line under it -->
<rect x="798" y="230" width="184" height="21" rx="3" fill="#e0de71" opacity="0.38"/>
<rect x="830" y="318" width="300" height="58" rx="8" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="846" y="341" fill="#dcddde" font-family="sans-serif" font-size="12.5">Highlighted as an idea. Kept in Think.</text>
<rect x="846" y="350" width="52" height="18" rx="5" fill="#2f2f36"/>
<text x="872" y="363" fill="#dcddde" font-family="sans-serif" font-size="11.5" text-anchor="middle">Undo</text>
<rect x="906" y="350" width="86" height="18" rx="5" fill="#2f2f36"/>
<text x="949" y="363" fill="#dcddde" font-family="sans-serif" font-size="11.5" text-anchor="middle">Keep as ink</text>
<text x="800" y="410" fill="#8a8c94" font-family="sans-serif" font-size="12.5">the same highlight a selection makes:</text>
<text x="800" y="428" fill="#8a8c94" font-family="sans-serif" font-size="12.5">its meaning is the one H uses</text>
<text x="800" y="458" fill="#5f6168" font-family="sans-serif" font-size="12">Keep as ink gives it back as page ink</text>

<!-- the palette, with the highlighter -->
<g transform="translate(80 448)">
<rect width="230" height="44" rx="10" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<path d="M14 32 L16 25 L29 12 L33 16 L20 29 Z" fill="none" stroke="#9a9ca4" stroke-width="2" stroke-linejoin="round"/>
<rect x="44" y="6" width="32" height="32" rx="7" fill="#2f2f36"/>
<path d="M52 32 L56 28 L66 14 L72 18 L62 32 Z M50 34 L60 34" fill="none" stroke="#a68af9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M88 30 L98 20 L108 30 L102 36 L94 36 Z" fill="none" stroke="#9a9ca4" stroke-width="2" stroke-linejoin="round"/>
<circle cx="132" cy="22" r="7" fill="#dcddde"/>
<circle cx="154" cy="22" r="7" fill="#fb464c"/>
<circle cx="176" cy="22" r="7" fill="#4a9dff"/>
<circle cx="198" cy="22" r="7" fill="#44cf6e"/>
</g>
<text x="80" y="512" fill="#8a8c94" font-family="sans-serif" font-size="12.5">choose the highlighter to highlight</text>
</svg>
