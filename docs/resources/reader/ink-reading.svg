<text x="941" y="312" fill="#dcddde" font-family="sans-serif" font-size="12" text-anchor="middle">Reject</text>
<text x="820" y="380" fill="#8a8c94" font-family="sans-serif" font-size="12.5">matched here, locally — never by the</text>
<text x="820" y="398" fill="#8a8c94" font-family="sans-serif" font-size="12.5">model — to one note you have</text>
