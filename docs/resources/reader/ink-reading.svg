<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Read as text, in three moments: handwriting in the margin beside a paragraph, contradicts ship early, with its chip Ink, kept as you wrote it, and Read as text; a card grown out of the chip saying Reads as: contradicts 'ship early'?, with Accept, Edit and Reject and the line Nothing is written until you accept; and, once accepted, the chip reading Read as: contradicts 'ship early'? with a second card grown from it, As a move: a tension between this passage and Ship early, learn from reality, and the margin entry naming that note">
