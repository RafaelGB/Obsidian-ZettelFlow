<text x="80" y="135">1 · INK, AND ITS CHIP</text>
<text x="440" y="135">2 · ASKED FOR: A PROPOSAL</text>
<text x="820" y="135">3 · ACCEPTED — THEN A MOVE</text>
</g>

<!-- 1: a paragraph, the handwriting in the margin, the chip under it -->
<g font-family="Georgia, serif" font-size="15" fill="#dcddde">
<text x="80" y="180">Plan slowly, act fast. Big</text>
<text x="80" y="206">projects fail because they</text>
<text x="80" y="232">start building before they</text>
<text x="80" y="258">finish thinking.</text>
</g>
