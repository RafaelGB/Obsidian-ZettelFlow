<text x="608" y="188" fill="#8a8c94" font-family="sans-serif" font-size="10.5">Ink · kept as you wrote it</text>
<path d="M667 202 L667 214" stroke="#5f6168" stroke-width="1.2" stroke-dasharray="2 3"/>
<rect x="440" y="218" width="320" height="150" rx="10" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="458" y="246" fill="#dcddde" font-family="sans-serif" font-size="13">Reads as: “contradicts ‘ship early’?”</text>
<rect x="458" y="264" width="64" height="26" rx="5" fill="#7f6df2"/>
<text x="490" y="282" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Accept</text>
<rect x="530" y="264" width="52" height="26" rx="5" fill="#2f2f36"/>
<text x="556" y="282" fill="#dcddde" font-family="sans-serif" font-size="12" text-anchor="middle">Edit</text>
<rect x="590" y="264" width="62" height="26" rx="5" fill="#2f2f36"/>
<text x="621" y="282" fill="#dcddde" font-family="sans-serif" font-size="12" text-anchor="middle">Reject</text>
<text x="458" y="314" fill="#8a8c94" font-family="sans-serif" font-size="11">Nothing is written until you accept.</text>
<text x="458" y="330" fill="#8a8c94" font-family="sans-serif" font-size="11">Your verdict is recorded either way.</text>
<text x="458" y="352" fill="#5f6168" font-family="sans-serif" font-size="11">grown from the chip · 0.96 → 1, 120 ms</text>
<text x="440" y="410" fill="#8a8c94" font-family="sans-serif" font-size="12.5">Accept or Edit: it travels back into</text>
<text x="440" y="428" fill="#8a8c94" font-family="sans-serif" font-size="12.5">the chip, and becomes the note's text.</text>
<text x="440" y="446" fill="#8a8c94" font-family="sans-serif" font-size="12.5">Reject: it slides away; nothing written.</text>
<text x="440" y="482" fill="#5f6168" font-family="sans-serif" font-size="12">no provider set up? it says so, and</text>
<text x="440" y="500" fill="#5f6168" font-family="sans-serif" font-size="12">opens Settings › AI — nothing is sent</text>

<!-- 3: the chip reads the accepted text; the move card grows from it -->
