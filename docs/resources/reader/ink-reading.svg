<path d="M104 458 C108 450 114 450 112 458 C111 464 116 464 120 456 M126 458 C130 450 136 452 134 460 C133 466 140 464 144 454 M150 458 C156 450 162 452 160 460 M104 478 C110 472 116 474 118 478 C120 482 126 482 132 476" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
