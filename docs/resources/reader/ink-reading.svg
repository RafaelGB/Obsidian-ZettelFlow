<path d="M350 214 C356 206 364 210 360 220 C358 226 360 236 366 228 M366 244 L366 245"/>
</g>
<rect x="262" y="256" width="134" height="40" rx="5" fill="#202024" stroke="#3a3a3a" stroke-width="1.2"/>
<text x="270" y="272" fill="#8a8c94" font-family="sans-serif" font-size="10.5">Ink · kept as you wrote it</text>
<text x="270" y="288" fill="#a68af9" font-family="sans-serif" font-size="10.5" font-weight="600">Read as text</text>
<text x="80" y="330" fill="#8a8c94" font-family="sans-serif" font-size="12.5">your handwriting, kept as a drawing:</text>
<text x="80" y="348" fill="#8a8c94" font-family="sans-serif" font-size="12.5">nothing reads it until you press</text>
<text x="80" y="366" fill="#8a8c94" font-family="sans-serif" font-size="12.5">Read as text — one note, one press</text>
