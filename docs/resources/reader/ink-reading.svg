<text x="204" y="484" fill="#8a8c94" font-family="sans-serif" font-size="11.5">no title, no path</text>

<!-- 2: the card grows out of the chip -->
<g font-family="Georgia, serif" font-size="15" fill="#5f6168">
<text x="440" y="180">Plan slowly, act fast. Big</text>
<text x="440" y="206">projects fail because they</text>
