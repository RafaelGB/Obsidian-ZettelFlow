<text x="600" y="55" fill="#5f6168" font-family="sans-serif" font-size="12.5" text-anchor="middle">My vault — Obsidian</text>
<line x1="40" y1="70" x2="1160" y2="70" stroke="#3a3a3a" stroke-width="1"/>
<text x="90" y="100" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="600">A PHILOSOPHY OF SOFTWARE DESIGN  ·  JOHN OUSTERHOUT</text>
<text x="1130" y="102" fill="#5f6168" font-family="sans-serif" font-size="20" text-anchor="middle">×</text>

<!-- the page -->
<text x="300" y="160" fill="#dcddde" font-family="Georgia, serif" font-size="32" font-weight="700">Deep modules</text>
<g font-family="Georgia, serif" font-size="17" fill="#dcddde">
<text x="300" y="210">The best modules are those that provide powerful</text>
<text x="300" y="238">functionality yet have simple interfaces. A deep</text>
<text x="300" y="266">module hides a great deal of complexity behind an</text>
<text x="300" y="294">interface that is much simpler than what it does.</text>
<text x="300" y="342">A shallow module is one whose interface is relatively</text>
<text x="300" y="370">complex in comparison to the functionality that it</text>
<text x="300" y="398">provides. It adds cost and gives little back: the</text>
<text x="300" y="426">interface is almost as long as the implementation.</text>
<text x="300" y="474">Classitis is the belief that classes are good, so</text>
<text x="300" y="502">more classes are better — and the result is a</text>
<text x="300" y="530">system of many small, shallow pieces.</text>
</g>

