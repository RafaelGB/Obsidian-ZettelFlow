<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="The Reader on an iPad. Landscape: the outer fifth of the page on each side is a tap zone that turns a screen back or forward, the middle shows the bar, which reads Chapter 11 / 30 · 2 of 44, and a finger swiping left holds the chapter's page part-turned under it. Portrait: the drawer is the bottom sheet — Contents opens at half height with a grab handle, its tabs, the pencil for Recall and the notebook, and its own close, its rows read, partly read or not yet, the current one washed, a mark where you marked; the page dims behind it. The bar stays above the sheet, its Contents button pressed; another panel swaps into the same sheet without rising again.">
