<text x="390.0" y="172" fill="#8b8e94" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">01. PRINCIPIOS BÁSICOS</text>
<text x="194.0" y="216" fill="#c8c9cc" font-family="serif" font-size="15">Un sistema no es solo una</text>
<text x="194.0" y="243" fill="#c8c9cc" font-family="serif" font-size="15">colección de cosas. Un sistema</text>
<text x="194.0" y="270" fill="#c8c9cc" font-family="serif" font-size="15">es un conjunto de elementos</text>
<text x="194.0" y="297" fill="#c8c9cc" font-family="serif" font-size="15">interrelacionados, organizados</text>
<text x="194.0" y="324" fill="#c8c9cc" font-family="serif" font-size="15">de manera coherente para</text>
<text x="194.0" y="351" fill="#c8c9cc" font-family="serif" font-size="15">alcanzar un fin.</text>
