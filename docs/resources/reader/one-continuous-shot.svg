<text x="40" y="362" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The shelf zooms with the book — nothing fades, the neighbours leave the frame. The page under the cover is the real page at your place, highlights included.</text>
