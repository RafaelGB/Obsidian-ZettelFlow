<text x="40" y="452" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Esc or × freezes the page where it is, the tab becomes the Library again (its filter, sort and scroll), and the camera pulls out:</text>
