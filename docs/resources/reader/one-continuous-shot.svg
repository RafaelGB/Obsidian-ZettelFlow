<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="One continuous shot (epic #729): opening a book from the Library is a camera move — the shelf, the push into the book, the cover opening on the page you were on, that page becoming the Reader — closing plays it backwards, and a chapter turns as a leaf, keeps flowing or slides off like a sheet">
