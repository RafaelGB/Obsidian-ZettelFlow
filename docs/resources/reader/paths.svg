<text x="110" y="655.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
<text x="134" y="656" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Left a reading part-way? Pick it up where you stopped.</text>
<circle cx="110" cy="687" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="110" y="691.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<text x="134" y="692" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Only the ways your vault gives substance to are offered: no typed relations, no Argument.</text>
<circle cx="110" cy="723" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="110" y="727.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<text x="134" y="728" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="400" text-anchor="start">The chapters, in order, before you commit — the choice is made on what you will read.</text>
<circle cx="110" cy="759" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="110" y="763.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<text x="134" y="764" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="400" text-anchor="start">One way only and nothing to resume? Read from here skips this and starts reading.</text>
</svg>
