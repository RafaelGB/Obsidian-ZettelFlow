<text x="136" y="394.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<circle cx="456" cy="131" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="456" y="135.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<circle cx="828" cy="186" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="828" y="190.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<circle cx="76" cy="784" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="788.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
<text x="96" y="789" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">A link in a chapter: click it, and the page does not turn.</text>
<circle cx="76" cy="808" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="812.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<text x="96" y="813" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The peek, right under its paragraph — where the note sits, its first lines, what you can do.</text>
<circle cx="76" cy="832" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="836.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<text x="96" y="837" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">In a detour: the way back, one press (or Esc) per level, up to five deep.</text>
<circle cx="76" cy="856" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="860.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<text x="96" y="861" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Around this chapter: what supports it, what argues back, its questions — each a peek.</text>
</svg>
