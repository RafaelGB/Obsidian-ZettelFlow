<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Re-anchor a detached highlight: a detached row in the margin with Re-anchor beside Open in Think; the line above the page, Select the passage this belongs to, with Cancel; a selection in the chapter offering only Anchor here; and below, the highlight settled into the new passage with Highlight re-anchored and Undo">
<rect width="1200" height="900" fill="#141416"/>
<rect x="40" y="30" width="1120" height="560" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="62" cy="50" r="5.5" fill="#fb464c"/>
<circle cx="80" cy="50" r="5.5" fill="#e9973f"/>
<circle cx="98" cy="50" r="5.5" fill="#44cf6e"/>
<text x="600" y="55" fill="#5f6168" font-family="sans-serif" font-size="12.5" text-anchor="middle">My vault — Obsidian</text>
<line x1="40" y1="70" x2="1160" y2="70" stroke="#3a3a3a" stroke-width="1"/>
<text x="90" y="100" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="600">EVENT SOURCING  ·  A PAPER, REVISED</text>
<text x="1130" y="102" fill="#5f6168" font-family="sans-serif" font-size="20" text-anchor="middle">×</text>

<!-- the state line: calm, above the page -->
<rect x="250" y="118" width="520" height="40" rx="10" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="268" y="143" fill="#a3a3a8" font-family="sans-serif" font-size="13" font-style="italic">Select the passage this belongs to: “facts that cannot be taken…”</text>
<rect x="690" y="126" width="68" height="24" rx="6" fill="#2a2a2f" stroke="#3a3a3a"/>
<text x="724" y="142" fill="#dcddde" font-family="sans-serif" font-size="12.5" text-anchor="middle">Cancel</text>

<!-- the chapter -->
<text x="120" y="210" fill="#dcddde" font-family="Georgia, serif" font-size="30" font-weight="700">Event sourcing</text>
<text x="120" y="248" fill="#5f6168" font-family="sans-serif" font-size="12.5" font-weight="700">EVENTS</text>
<text x="120" y="282" fill="#dcddde" font-family="Georgia, serif" font-size="17">Event sourcing stores changes, not state. Every decision</text>
<rect x="196" y="295" width="356" height="22" rx="3" fill="#7f6df2" fill-opacity="0.28"/>
<text x="120" y="311" fill="#dcddde" font-family="Georgia, serif" font-size="17">becomes a fact that can never be undone, and the</text>
<text x="120" y="340" fill="#dcddde" font-family="Georgia, serif" font-size="17">current picture is whatever the facts add up to.</text>
<text x="120" y="369" fill="#dcddde" font-family="Georgia, serif" font-size="17">Replay rebuilds it, from the first fact to the last.</text>

<!-- the one offer -->
<rect x="300" y="330" width="150" height="40" rx="10" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="312" y="338" width="126" height="24" rx="6" fill="#7f6df2"/>
<text x="375" y="355" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Anchor here</text>
<path d="M 375 330 L 375 320" stroke="#3a3a3a" stroke-width="1.5"/>

<!-- the margin: the detached row, lit -->
<line x1="800" y1="90" x2="800" y2="590" stroke="#2a2a2f" stroke-width="1"/>
<text x="830" y="190" fill="#5f6168" font-family="sans-serif" font-size="11.5" font-weight="700">YOUR HIGHLIGHTS</text>
<rect x="830" y="204" width="300" height="56" rx="6" fill="#1d1d21" stroke="#3a3a3a"/>
<rect x="830" y="204" width="3" height="56" fill="#e0a351"/>
<text x="846" y="226" fill="#a3a3a8" font-family="Georgia, serif" font-size="13" font-style="italic">“stores changes, not state”</text>
<text x="846" y="246" fill="#dcddde" font-family="sans-serif" font-size="12.5">The log is the truth.</text>
<text x="830" y="296" fill="#5f6168" font-family="sans-serif" font-size="11.5" font-weight="700">DETACHED</text>
<rect x="830" y="310" width="300" height="96" rx="6" fill="#1d1d21" stroke="#7f6df2" stroke-width="1.5"/>
<rect x="830" y="310" width="3" height="96" fill="#5aa9e6"/>
<text x="846" y="332" fill="#a3a3a8" font-family="Georgia, serif" font-size="13" font-style="italic">“facts that cannot be taken back”</text>
<text x="846" y="352" fill="#dcddde" font-family="sans-serif" font-size="12.5">Is anything really immutable?</text>
<text x="846" y="384" fill="#a68af9" font-family="sans-serif" font-size="12">Open in Think</text>
<text x="950" y="384" fill="#a68af9" font-family="sans-serif" font-size="12" font-weight="700">Re-anchor</text>
<text x="830" y="440" fill="#5f6168" font-family="sans-serif" font-size="12">The passage was revised: the words</text>
<text x="830" y="458" fill="#5f6168" font-family="sans-serif" font-size="12">changed, the note did not.</text>

<!-- after: settled -->
<rect x="40" y="620" width="1120" height="250" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="70" y="652" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="600">AFTER ANCHOR HERE</text>
<text x="120" y="700" fill="#dcddde" font-family="Georgia, serif" font-size="17">Event sourcing stores changes, not state. Every decision</text>
<rect x="196" y="713" width="356" height="22" rx="3" fill="#5aa9e6" fill-opacity="0.32"/>
<line x1="197" y1="734" x2="551" y2="734" stroke="#7f6df2" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="120" y="729" fill="#dcddde" font-family="Georgia, serif" font-size="17">becomes a fact that can never be undone, and the</text>
<text x="120" y="758" fill="#dcddde" font-family="Georgia, serif" font-size="17">current picture is whatever the facts add up to.</text>
<rect x="250" y="780" width="330" height="40" rx="10" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="268" y="805" fill="#dcddde" font-family="sans-serif" font-size="13">Highlight re-anchored.</text>
<rect x="500" y="788" width="64" height="24" rx="6" fill="#2a2a2f" stroke="#3a3a3a"/>
<text x="532" y="804" fill="#dcddde" font-family="sans-serif" font-size="12.5" text-anchor="middle">Undo</text>
<rect x="830" y="680" width="300" height="76" rx="6" fill="#1d1d21" stroke="#3a3a3a"/>
<rect x="830" y="680" width="3" height="76" fill="#5aa9e6"/>
<text x="846" y="702" fill="#a3a3a8" font-family="Georgia, serif" font-size="13" font-style="italic">“a fact that can never be undone”</text>
<text x="846" y="722" fill="#dcddde" font-family="sans-serif" font-size="12.5">Is anything really immutable?</text>
<text x="846" y="742" fill="#5f6168" font-family="sans-serif" font-size="11.5">Same id, note, meaning and layer</text>
<text x="830" y="790" fill="#5f6168" font-family="sans-serif" font-size="12">Ctrl/⌘+Z takes it back too.</text>
</svg>
