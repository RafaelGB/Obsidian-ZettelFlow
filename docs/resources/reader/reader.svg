<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-label="The ZettelFlow Reader with its one drawer. A book, Pensar en sistemas, read in pages: the top line names the book, a hairline across the top fills as you read, and above the text the chapter's title, Nota de la autora, in small letter-spaced capitals — never a count. Contents is open in the drawer docked on the right beside the column, which has moved left to make room: its tabs Contents, Bookmarks and Where you've been, then a pencil for Recall this chapter and a notebook for Notebook, then its close. Each entry has a quiet glyph — filled for read, half for partly read, hollow for not read yet — the chapter you are in is washed in the accent colour, and a small highlight-coloured mark sits at the end of the rows where you marked something. No numbers in any row. The bar is centred under the column and reads Chapter 3 / 30 · 2 of 6, its Contents button pressed; a book of thirty chapters shows no dots.">
<rect width="1200" height="824" fill="#141416"/>
