<text x="76" y="66" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">PENSAR EN SISTEMAS · DONELLA MEADOWS</text>
<path d="M 740.0 58.0 L 748.0 66.0 M 748.0 58.0 L 740.0 66.0" stroke="#8b8e94" stroke-width="1.5" fill="none"/>
<text x="410" y="112" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle" letter-spacing="2.2">NOTA DE LA AUTORA</text>
<text x="262" y="156" fill="#c8c9cc" font-family="serif" font-size="15">Escribí este libro para quienes quieren</text>
<text x="262" y="182" fill="#c8c9cc" font-family="serif" font-size="15">entender un poco mejor cómo funciona el</text>
<text x="262" y="208" fill="#c8c9cc" font-family="serif" font-size="15">mundo: no los sistemas de un laboratorio,</text>
<text x="262" y="234" fill="#c8c9cc" font-family="serif" font-size="15">sino los que nos rodean cada día. Un sistema</text>
<rect x="260.0" y="247" width="248.2" height="19" rx="3" fill="#e0a351" opacity="0.28"/>
<text x="262" y="260" fill="#c8c9cc" font-family="serif" font-size="15">es algo más que la suma de sus partes,</text>
<text x="262" y="286" fill="#c8c9cc" font-family="serif" font-size="15">y su comportamiento no se deduce mirando</text>
<text x="262" y="312" fill="#c8c9cc" font-family="serif" font-size="15">cada pieza por separado.</text>
<text x="262" y="352" fill="#c8c9cc" font-family="serif" font-size="15">Lo que sigue no es un tratado. Son las</text>
<text x="262" y="378" fill="#c8c9cc" font-family="serif" font-size="15">ideas que me habría gustado encontrar</text>
<text x="262" y="404" fill="#c8c9cc" font-family="serif" font-size="15">juntas cuando empecé: claras, con ejemplos,</text>
<text x="262" y="430" fill="#c8c9cc" font-family="serif" font-size="15">y sin fórmulas que asusten.</text>
