<text x="120" y="714" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="700">One drawer</text>
<text x="120" y="734" fill="#8b8e94" font-family="sans-serif" font-size="11">Contents, Type, Layers, Search and Alongside</text>
<text x="120" y="750" fill="#8b8e94" font-family="sans-serif" font-size="11">open beside the column, never over it.</text>
<text x="470" y="714" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="700">Contents is places only</text>
<text x="470" y="734" fill="#8b8e94" font-family="sans-serif" font-size="11">Read · partly read · not yet, said quietly;</text>
<text x="470" y="750" fill="#8b8e94" font-family="sans-serif" font-size="11">Recall and Notebook are in its head.</text>
<text x="820" y="714" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="700">One progress signal</text>
<text x="820" y="734" fill="#8b8e94" font-family="sans-serif" font-size="11">The bar says where you are; above the</text>
<text x="820" y="750" fill="#8b8e94" font-family="sans-serif" font-size="11">text, only the chapter's title.</text>
