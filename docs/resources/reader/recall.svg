<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Recall, from the drawer. Left: Contents' head offers Recall this chapter as a pencil beside the notebook; chosen, the chapter is put away — the page slides down out of the column as a sheet, leaving the paper and the chapter's title — and the drawer holds the recall card: Without looking: what was this chapter's argument? above your words, a typo left as it is, with Reveal what I marked and Done. Right: the page is back and your two marks return in the order you made them; the same drawer shows What you wrote, your words where they were, and under it What you marked then, then Keep it as a note and Done. No number, no match, no score.">
<rect width="1200" height="900" fill="#141416"/>
<text x="600.0" y="44" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">RECALL</text>
<rect x="40" y="64" width="550" height="690" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="64" y="96" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">PUT AWAY</text>
<text x="184" y="140" fill="#8b8e94" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">01. PRINCIPIOS BÁSICOS</text>
<rect x="64" y="160" width="250" height="320" rx="8" fill="#202024" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M 189 330 L 189 380" stroke="#a99cf5" stroke-width="1.5" fill="none"/>
<path d="M 182 372 L 189 382 L 196 372" stroke="#a99cf5" stroke-width="1.5" fill="none"/>
<text x="189" y="410" fill="#a99cf5" font-family="sans-serif" font-size="11" text-anchor="middle">the page slides away</text>
<rect x="330" y="116" width="244" height="600" rx="12" fill="#1e1e22" stroke="#3a3a3a" stroke-width="1"/>
<text x="344" y="144" fill="#8b8e94" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">RECALL</text>
<path d="M 552.0 136.0 L 560.0 144.0 M 560.0 136.0 L 552.0 144.0" stroke="#8b8e94" stroke-width="1.5" fill="none"/>
<text x="344" y="178" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="600">Without looking: what was</text>
<text x="344" y="196" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="600">this chapter's argument?</text>
<rect x="344" y="212" width="216" height="150" rx="8" fill="#26262b"/>
<text x="354" y="236" fill="#c8c9cc" font-family="serif" font-size="12">A system is more than</text>
<text x="354" y="258" fill="#c8c9cc" font-family="serif" font-size="12">its parts: elements,</text>
<text x="354" y="280" fill="#c8c9cc" font-family="serif" font-size="12">interconections and</text>
<text x="354" y="302" fill="#c8c9cc" font-family="serif" font-size="12">a purpose, the last</text>
<text x="354" y="324" fill="#c8c9cc" font-family="serif" font-size="12">the hardest to see</text>
<path d="M 354 286 q 4 3 8 0 q 4 -3 8 0 q 4 3 8 0 q 4 -3 8 0 q 4 3 8 0 q 4 -3 8 0 q 4 3 8 0 q 4 -3 8 0 q 4 3 8 0" stroke="#e06c6c" stroke-width="1.2" fill="none"/>
<text x="344" y="382" fill="#a99cf5" font-family="sans-serif" font-size="11">a typo, left as you typed it</text>
<rect x="344" y="406" width="150" height="28" rx="14" fill="#7f6df2"/>
<text x="419" y="425" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Reveal what I marked</text>
<rect x="502" y="406" width="56" height="28" rx="14" fill="#2a2a30"/>
<text x="530" y="425" fill="#c8c9cc" font-family="sans-serif" font-size="11" text-anchor="middle">Done</text>
<rect x="344" y="496" width="216" height="110" rx="8" fill="#202024" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3 4"/>
<text x="354" y="518" fill="#5f6168" font-family="sans-serif" font-size="10">opened from Contents' head:</text>
<rect x="360" y="536" width="28" height="28" rx="6" fill="#7f6df2" opacity="0.25"/>
<path d="M 369 556 L 368 557 L 369 553 L 378 544 L 380 546 L 371 555 Z" stroke="#a99cf5" stroke-width="1.3" fill="none"/>
<rect x="400" y="543" width="12" height="14" rx="2" fill="none" stroke="#8b8e94" stroke-width="1.3"/>
<path d="M 403 543 L 403 557" stroke="#8b8e94" stroke-width="1.3" fill="none"/>
<path d="M 406 548 L 410 548" stroke="#8b8e94" stroke-width="1.1" fill="none"/>
<path d="M 406 552 L 410 552" stroke="#8b8e94" stroke-width="1.1" fill="none"/>
<path d="M 430.0 546.0 L 438.0 554.0 M 438.0 546.0 L 430.0 554.0" stroke="#8b8e94" stroke-width="1.5" fill="none"/>
<text x="360" y="586" fill="#a99cf5" font-family="sans-serif" font-size="11">Recall this chapter</text>
<rect x="610" y="64" width="550" height="690" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="634" y="96" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">REVEALED</text>
<text x="754" y="140" fill="#8b8e94" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">01. PRINCIPIOS BÁSICOS</text>
<rect x="632.0" y="174" width="158.0" height="18" rx="3" fill="#e0a351" opacity="0.3"/>
<text x="634" y="186" fill="#c8c9cc" font-family="serif" font-size="14">Un sistema no es solo una</text>
<text x="634" y="211" fill="#c8c9cc" font-family="serif" font-size="14">colección de cosas. Un</text>
<text x="634" y="236" fill="#c8c9cc" font-family="serif" font-size="14">sistema es un conjunto de</text>
<text x="634" y="261" fill="#c8c9cc" font-family="serif" font-size="14">elementos interrelacionados,</text>
<text x="634" y="286" fill="#c8c9cc" font-family="serif" font-size="14">organizados de manera</text>
<text x="634" y="311" fill="#c8c9cc" font-family="serif" font-size="14">coherente para alcanzar</text>
<text x="634" y="336" fill="#c8c9cc" font-family="serif" font-size="14">un fin. Su función o</text>
<rect x="632.0" y="349" width="170.32" height="18" rx="3" fill="#e0a351" opacity="0.3"/>
<text x="634" y="361" fill="#c8c9cc" font-family="serif" font-size="14">propósito es lo más difícil</text>
<text x="634" y="386" fill="#c8c9cc" font-family="serif" font-size="14">de ver.</text>
<text x="634" y="431" fill="#a99cf5" font-family="sans-serif" font-size="11">your marks return in the order you made them</text>
<rect x="900" y="116" width="244" height="600" rx="12" fill="#1e1e22" stroke="#3a3a3a" stroke-width="1"/>
<text x="914" y="144" fill="#8b8e94" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">RECALL</text>
<path d="M 1122.0 136.0 L 1130.0 144.0 M 1130.0 136.0 L 1122.0 144.0" stroke="#8b8e94" stroke-width="1.5" fill="none"/>
<text x="914" y="174" fill="#5f6168" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">WHAT YOU WROTE</text>
<rect x="914" y="184" width="216" height="116" rx="8" fill="#26262b"/>
<text x="924" y="208" fill="#c8c9cc" font-family="serif" font-size="12">A system is more than</text>
<text x="924" y="230" fill="#c8c9cc" font-family="serif" font-size="12">its parts: elements,</text>
<text x="924" y="252" fill="#c8c9cc" font-family="serif" font-size="12">interconections and</text>
<text x="924" y="274" fill="#c8c9cc" font-family="serif" font-size="12">a purpose, the last</text>
<text x="914" y="326" fill="#5f6168" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">WHAT YOU MARKED THEN</text>
<rect x="914" y="338" width="216" height="38" rx="8" fill="#26262b"/>
<rect x="914" y="338" width="3" height="38" rx="1.5" fill="#e0a351"/>
<text x="926" y="362" fill="#c8c9cc" font-family="serif" font-size="11" font-style="italic">Un sistema no es solo una…</text>
<rect x="914" y="384" width="216" height="38" rx="8" fill="#26262b"/>
<rect x="914" y="384" width="3" height="38" rx="1.5" fill="#e0a351"/>
<text x="926" y="408" fill="#c8c9cc" font-family="serif" font-size="11" font-style="italic">propósito es lo más difícil…</text>
<rect x="914" y="446" width="140" height="28" rx="14" fill="#7f6df2"/>
<text x="984" y="465" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Keep it as a note</text>
<rect x="1062" y="446" width="56" height="28" rx="14" fill="#2a2a30"/>
<text x="1090" y="465" fill="#c8c9cc" font-family="sans-serif" font-size="11" text-anchor="middle">Done</text>
<text x="914" y="516" fill="#5f6168" font-family="sans-serif" font-size="10">no number, no match, no score</text>
<text x="600" y="800" fill="#8b8e94" font-family="sans-serif" font-size="12" text-anchor="middle">Recall opens in the drawer beside the column; its door is the pencil in Contents' head.</text>
<text x="600" y="822" fill="#8b8e94" font-family="sans-serif" font-size="12" text-anchor="middle">Nothing is written until you choose Keep it as a note.</text>
</svg>
