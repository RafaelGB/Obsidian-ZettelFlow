<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Recall. On the left the chapter is put away: the page slides down out of the column as a sheet, leaving the paper and the chapter's title, and the card beside it asks Without looking: what was this chapter's argument? above your words, a typo left as it is, with Reveal what I marked and Done. On the right the page is back and your two marks return in the order you made them; the card shows What you wrote, your words where they were, and under it What you marked then, then Keep it as a note and Done. No number, no match, no score.">
<rect width="1200" height="900" fill="#141416"/>
<rect x="40" y="30" width="1120" height="720" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5" />
<circle cx="62" cy="50" r="5.5" fill="#fb464c"/>
<circle cx="80" cy="50" r="5.5" fill="#e9973f"/>
<circle cx="98" cy="50" r="5.5" fill="#44cf6e"/>
<text x="600" y="55" fill="#5f6168" font-family="sans-serif" font-size="12.5" text-anchor="middle">My vault — Obsidian</text>
<line x1="40" y1="70" x2="1160" y2="70" stroke="#3a3a3a" stroke-width="1"/>
<text x="90" y="100" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="600">MIDDLEMARCH  ·  GEORGE ELIOT</text>
<text x="1130" y="102" fill="#5f6168" font-family="sans-serif" font-size="20" text-anchor="middle">×</text>
<line x1="600" y1="120" x2="600" y2="730" stroke="#2c2c31" stroke-width="1" stroke-dasharray="4 6"/>

<!-- ── 1 · put away ───────────────────────────────────────────────── -->
<!-- the paper the fold leaves, the chapter's title on it -->
<rect x="70" y="124" width="300" height="600" rx="6" fill="#1b1b1f" stroke="#2c2c31" stroke-width="1"/>
<text x="220" y="196" fill="#dcddde" font-family="Georgia, serif" font-size="26" font-weight="700" text-anchor="middle">Miss Brooke</text>

<!-- the sheet: the page as it was, sliding down out of the column -->
<clipPath id="column-left"><rect x="70" y="124" width="300" height="600"/></clipPath>
<g clip-path="url(#column-left)">
<g transform="translate(0 330)">
<rect x="70" y="124" width="300" height="600" rx="6" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="70" y="118" width="300" height="10" fill="#000000" opacity="0.25"/>
<line x1="96" y1="160" x2="344" y2="160" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<line x1="96" y1="184" x2="336" y2="184" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<rect x="94" y="200" width="180" height="8" rx="3" fill="#e0c050" opacity="0.35"/>
<line x1="96" y1="232" x2="340" y2="232" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<line x1="96" y1="256" x2="320" y2="256" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<rect x="94" y="272" width="140" height="8" rx="3" fill="#5b8def" opacity="0.35"/>
<line x1="96" y1="304" x2="330" y2="304" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
</g>
</g>
<path d="M 220 300 L 220 410" stroke="#5f6168" stroke-width="1.5" stroke-dasharray="3 4"/>
<path d="M 212 400 L 220 414 L 228 400" fill="none" stroke="#5f6168" stroke-width="1.5"/>

<!-- the card beside the page -->
<rect x="388" y="124" width="196" height="600" rx="8" fill="#1e1e22" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="404" y="150" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600">Recall</text>
<text x="568" y="151" fill="#5f6168" font-family="sans-serif" font-size="15" text-anchor="middle">×</text>
<text x="404" y="172" fill="#8b8e94" font-family="sans-serif" font-size="11.5">Miss Brooke</text>
<g transform="translate(0 -6)">
<text x="404" y="210" fill="#dcddde" font-family="Georgia, serif" font-size="15">Without looking: what</text>
<text x="404" y="230" fill="#dcddde" font-family="Georgia, serif" font-size="15">was this chapter’s</text>
<text x="404" y="250" fill="#dcddde" font-family="Georgia, serif" font-size="15">argument?</text>
</g>
<rect x="404" y="262" width="164" height="190" rx="5" fill="#202024" stroke="#3a3a3a" stroke-width="1.2"/>
<text x="414" y="286" fill="#dcddde" font-family="Georgia, serif" font-size="13">Dorothea wants a lif</text>
<text x="414" y="306" fill="#dcddde" font-family="Georgia, serif" font-size="13">of meaning, and</text>
<text x="414" y="326" fill="#dcddde" font-family="Georgia, serif" font-size="13">mistakes a dry man’s</text>
<text x="414" y="346" fill="#dcddde" font-family="Georgia, serif" font-size="13">learning for it.</text>
<line x1="414" y1="352" x2="414" y2="366" stroke="#7f6df2" stroke-width="1.5"/>
<rect x="404" y="470" width="164" height="30" rx="6" fill="#7f6df2"/>
<text x="486" y="489" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Reveal what I marked</text>
<text x="404" y="526" fill="#8b8e94" font-family="sans-serif" font-size="12">Done</text>

<!-- ── 2 · revealed ───────────────────────────────────────────────── -->
<rect x="626" y="124" width="300" height="600" rx="6" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<path d="M 776 132 L 776 118 M 768 126 L 776 118 L 784 126" fill="none" stroke="#5f6168" stroke-width="1.5"/>
<line x1="652" y1="160" x2="900" y2="160" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<line x1="652" y1="184" x2="892" y2="184" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<rect x="650" y="200" width="180" height="8" rx="3" fill="#e0c050" opacity="0.55"/>
<line x1="652" y1="232" x2="896" y2="232" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<line x1="652" y1="256" x2="876" y2="256" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<rect x="650" y="272" width="140" height="8" rx="3" fill="#5b8def" opacity="0.55"/>
<line x1="652" y1="304" x2="886" y2="304" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<line x1="652" y1="328" x2="870" y2="328" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<line x1="652" y1="352" x2="894" y2="352" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<line x1="652" y1="376" x2="860" y2="376" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
<text x="842" y="210" fill="#e0c050" font-family="sans-serif" font-size="11">first</text>
<text x="802" y="282" fill="#5b8def" font-family="sans-serif" font-size="11">then</text>

<rect x="944" y="124" width="196" height="600" rx="8" fill="#1e1e22" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="960" y="150" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600">Recall</text>
<text x="1124" y="151" fill="#5f6168" font-family="sans-serif" font-size="15" text-anchor="middle">×</text>
<text x="960" y="172" fill="#8b8e94" font-family="sans-serif" font-size="11.5">Miss Brooke</text>
<text x="960" y="244" fill="#5f6168" font-family="sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">WHAT YOU WROTE</text>
<rect x="960" y="262" width="164" height="190" rx="5" fill="#202024" stroke="#3a3a3a" stroke-width="1.2"/>
<text x="970" y="286" fill="#dcddde" font-family="Georgia, serif" font-size="13">Dorothea wants a lif</text>
<text x="970" y="306" fill="#dcddde" font-family="Georgia, serif" font-size="13">of meaning, and</text>
<text x="970" y="326" fill="#dcddde" font-family="Georgia, serif" font-size="13">mistakes a dry man’s</text>
<text x="970" y="346" fill="#dcddde" font-family="Georgia, serif" font-size="13">learning for it.</text>
<text x="960" y="478" fill="#5f6168" font-family="sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">WHAT YOU MARKED THEN</text>
<rect x="960" y="488" width="164" height="54" rx="5" fill="#202024" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="960" y="488" width="4" height="54" rx="2" fill="#e0c050"/>
<text x="972" y="508" fill="#8b8e94" font-family="Georgia, serif" font-size="11.5" font-style="italic">“Her mind was theoretic,</text>
<text x="972" y="526" fill="#8b8e94" font-family="Georgia, serif" font-size="11.5" font-style="italic">and yearned…”</text>
<rect x="960" y="550" width="164" height="62" rx="5" fill="#202024" stroke="#3a3a3a" stroke-width="1.2"/>
<rect x="960" y="550" width="4" height="62" rx="2" fill="#5b8def"/>
<text x="972" y="570" fill="#8b8e94" font-family="Georgia, serif" font-size="11.5" font-style="italic">“What could she do,</text>
<text x="972" y="586" fill="#8b8e94" font-family="Georgia, serif" font-size="11.5" font-style="italic">what ought she to do?”</text>
<text x="972" y="603" fill="#dcddde" font-family="sans-serif" font-size="11">Hers, or the town’s?</text>
<rect x="960" y="626" width="164" height="30" rx="6" fill="#7f6df2"/>
<text x="1042" y="645" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Keep it as a note</text>
<text x="960" y="682" fill="#8b8e94" font-family="sans-serif" font-size="12">Done</text>

<!-- callouts -->
<circle cx="84" cy="196" r="11" fill="#e0a351"/>
<text x="84" y="200.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
<circle cx="386" cy="122" r="11" fill="#e0a351"/>
<text x="386" y="126.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<circle cx="614" cy="204" r="11" fill="#e0a351"/>
<text x="614" y="208.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<circle cx="1110" cy="240" r="11" fill="#e0a351"/>
<text x="1110" y="244.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<circle cx="1110" cy="678" r="11" fill="#e0a351"/>
<text x="1110" y="682.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">5</text>

<circle cx="76" cy="786" r="11" fill="#e0a351"/>
<text x="76" y="790.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
<text x="96" y="791" fill="#dcddde" font-family="sans-serif" font-size="13.5">Recall this chapter — from Contents or the chapter’s end: the page slides down as a sheet, your marks go with it, the title stays.</text>
<circle cx="76" cy="808" r="11" fill="#e0a351"/>
<text x="76" y="812.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<text x="96" y="813" fill="#dcddde" font-family="sans-serif" font-size="13.5">One question, and a box: your words exactly as you type them — never corrected, completed or suggested to. A typo stays.</text>
<circle cx="76" cy="830" r="11" fill="#e0a351"/>
<text x="76" y="834.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<text x="96" y="835" fill="#dcddde" font-family="sans-serif" font-size="13.5">Reveal what I marked: the same shot backwards — the sheet comes up, then your marks return in the order you made them.</text>
<circle cx="76" cy="852" r="11" fill="#e0a351"/>
<text x="76" y="856.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<text x="96" y="857" fill="#dcddde" font-family="sans-serif" font-size="13.5">What you wrote first, where it was; what you marked then under it. Nothing compared, matched, counted or scored.</text>
<circle cx="76" cy="874" r="11" fill="#e0a351"/>
<text x="76" y="878.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">5</text>
<text x="96" y="879" fill="#dcddde" font-family="sans-serif" font-size="13.5">Keep it as a note: your words and one source:: line that cites the book — written only on Create note, and undoable.</text>
</svg>
