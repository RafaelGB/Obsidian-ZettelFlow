<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="The book at a glance. Above, the Reader's bar with its line drawn over the whole of a book: faint ticks where each of its thirty chapters begins, three stretches shaded where you marked something — yellow for ideas, blue for a chapter of questions, green for quotes — stronger where you marked more, two small dots for bookmarks, and the round thumb where you are. Hovering a stretch shows a quiet card: 04. Por qué los sistemas nos sorprenden, Your marks are here. Below, a finger drags along the line: a thin ghost shows where it would land and the chapter's name follows it, while the page above stays exactly where it was; on release the camera travels there and Where you've been keeps the way back. At the foot, the keys: left and right step a chapter, Home and End go to the ends, Esc lets go of a drag.">
<rect width="1200" height="720" fill="#141416"/>
<text x="600" y="44" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">THE BOOK AT A GLANCE</text>

<!-- ── hover ─────────────────────────────────────────────────────────────── -->
<text x="80" y="96" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">HOVER · WHERE, IN WORDS</text>
<g font-family="sans-serif">
<!-- the card above the line -->
<rect x="566" y="116" width="300" height="56" rx="8" fill="#1e1e22" stroke="#3a3a3a"/>
<text x="582" y="140" fill="#dcddde" font-size="13">04. Por qué los sistemas nos sorprenden</text>
<text x="582" y="160" fill="#8b8e94" font-size="12">Your marks are here</text>
<path d="M 716 172 L 716 196" stroke="#3a3a3a" stroke-width="1"/>

<!-- the bar -->
<rect x="80" y="196" width="1040" height="64" rx="32" fill="#1e1e22" stroke="#3a3a3a"/>
<text x="112" y="234" fill="#8b8e94" font-size="16">‹</text>
<text x="140" y="234" fill="#a3a6ad" font-size="13">Chapter 11 / 30 · 2 of 44</text>
<!-- the line -->
<rect x="330" y="225" width="520" height="6" rx="3" fill="#2f2f36"/>
<rect x="330" y="225" width="196" height="6" rx="3" fill="#7f6df2" opacity="0.45"/>
<!-- marked stretches -->
<rect x="356" y="225" width="26" height="6" fill="#e0b84a" opacity="0.55"/>
<rect x="510" y="225" width="22" height="6" fill="#e0b84a" opacity="0.8"/>
<rect x="688" y="225" width="58" height="6" fill="#4a8ee0" opacity="0.75"/>
<rect x="792" y="225" width="18" height="6" fill="#4ac08a" opacity="0.4"/>
<!-- chapter ticks -->
<g stroke="#8b8e94" stroke-width="1" opacity="0.35">
<path d="M 348 222 v 12 M 366 222 v 12 M 384 222 v 12 M 400 222 v 12 M 418 222 v 12 M 436 222 v 12 M 452 222 v 12 M 470 222 v 12 M 492 222 v 12 M 510 222 v 12 M 532 222 v 12 M 556 222 v 12 M 578 222 v 12 M 600 222 v 12 M 622 222 v 12 M 646 222 v 12 M 668 222 v 12 M 688 222 v 12 M 714 222 v 12 M 746 222 v 12 M 768 222 v 12 M 792 222 v 12 M 810 222 v 12 M 830 222 v 12"/>
</g>
<!-- bookmarks -->
<circle cx="444" cy="214" r="3" fill="#a99cf5"/>
<circle cx="760" cy="214" r="3" fill="#a99cf5"/>
<!-- where you are -->
<circle cx="526" cy="228" r="7" fill="#7f6df2"/>
<!-- the hover -->
<path d="M 716 240 l -6 10 h 12 z" fill="#dcddde"/>
<text x="880" y="234" fill="#8b8e94" font-size="16">›</text>
<g fill="#8b8e94" font-size="13"><text x="912" y="234">☰</text><text x="944" y="234">⌕</text><text x="976" y="234">T</text><text x="1008" y="234">≡</text><text x="1040" y="234">▯</text><text x="1072" y="234">⌨</text></g>
</g>
<g font-family="sans-serif" font-size="11" fill="#a99cf5">
<text x="356" y="290">a faint tick where a chapter begins</text>
<text x="590" y="290">shaded where you marked: the meaning you used most, stronger where you marked more</text>
<text x="420" y="196" text-anchor="middle">a bookmark</text>
</g>

<!-- ── drag ──────────────────────────────────────────────────────────────── -->
<text x="80" y="356" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">DRAG · THE PAGE WAITS UNTIL YOU LET GO</text>
<g font-family="sans-serif">
<!-- the page, unmoved -->
<rect x="80" y="372" width="520" height="168" rx="10" fill="#1b1b1f" stroke="#3a3a3a"/>
<text x="104" y="404" fill="#5f6168" font-size="10" letter-spacing="1.5">01. PRINCIPIOS BÁSICOS</text>
<g fill="#dcddde" font-family="serif" font-size="14">
<text x="104" y="436">Un sistema no es solo una colección de cosas.</text>
<text x="104" y="460">Es un conjunto de elementos interrelacionados,</text>
<text x="104" y="484">organizados de manera coherente para alcanzar</text>
<text x="104" y="508">un fin.</text>
</g>
<text x="340" y="566" fill="#a99cf5" font-size="11" text-anchor="middle">the page stays exactly where it was</text>

<!-- the line, dragging -->
<rect x="640" y="430" width="480" height="64" rx="32" fill="#1e1e22" stroke="#3a3a3a"/>
<rect x="676" y="459" width="408" height="6" rx="3" fill="#2f2f36"/>
<rect x="676" y="459" width="150" height="6" rx="3" fill="#7f6df2" opacity="0.45"/>
<rect x="912" y="459" width="44" height="6" fill="#4a8ee0" opacity="0.75"/>
<circle cx="826" cy="462" r="7" fill="#7f6df2" opacity="0.4"/>
<rect x="1004" y="452" width="4" height="20" rx="2" fill="#7f6df2" opacity="0.8"/>
<rect x="870" y="384" width="276" height="38" rx="8" fill="#1e1e22" stroke="#3a3a3a"/>
<text x="886" y="408" fill="#dcddde" font-size="13">06. Puntos de influencia</text>
<!-- the finger -->
<ellipse cx="1012" cy="500" rx="16" ry="22" fill="#dcddde" opacity="0.18" stroke="#8b8e94"/>
<path d="M 840 506 C 900 520 960 520 1000 508" fill="none" stroke="#a99cf5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="880" y="546" fill="#a99cf5" font-size="11" text-anchor="middle">let go: the camera travels there,</text>
<text x="880" y="562" fill="#a99cf5" font-size="11" text-anchor="middle">and Where you've been keeps the way back</text>
</g>

<!-- ── keys ──────────────────────────────────────────────────────────────── -->
<g font-family="sans-serif" font-size="12">
<text x="80" y="628" fill="#5f6168" font-size="11" font-weight="600" letter-spacing="1">ON THE LINE</text>
<rect x="80" y="642" width="40" height="26" rx="6" fill="#2a2a30" stroke="#3a3a3a"/><text x="100" y="660" fill="#dcddde" text-anchor="middle">←</text>
<rect x="126" y="642" width="40" height="26" rx="6" fill="#2a2a30" stroke="#3a3a3a"/><text x="146" y="660" fill="#dcddde" text-anchor="middle">→</text>
<text x="180" y="660" fill="#a3a6ad">a chapter at a time — never a page turn</text>
<rect x="500" y="642" width="56" height="26" rx="6" fill="#2a2a30" stroke="#3a3a3a"/><text x="528" y="660" fill="#dcddde" text-anchor="middle">Home</text>
<rect x="562" y="642" width="48" height="26" rx="6" fill="#2a2a30" stroke="#3a3a3a"/><text x="586" y="660" fill="#dcddde" text-anchor="middle">End</text>
<text x="624" y="660" fill="#a3a6ad">the ends</text>
<rect x="760" y="642" width="44" height="26" rx="6" fill="#2a2a30" stroke="#3a3a3a"/><text x="782" y="660" fill="#dcddde" text-anchor="middle">Esc</text>
<text x="818" y="660" fill="#a3a6ad">let go of a drag, nothing moves</text>
</g>
</svg>
