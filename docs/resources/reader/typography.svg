<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Type you can tune. On the desktop, the Type panel lies beside the page, never over it: Layout, Look, Font, Size, Line spacing, Width, Margins and Justify, and under Justify the quiet line Justified text needs hyphenation, which this device doesn't have for Spanish, reading ragged here. The column beside it is set ragged, its words whole and evenly spaced. On an iPad in portrait, Type is the bottom sheet; there Justify says Hyphenated as Spanish and the column is justified, its Spanish words broken at Spanish syllables, re-pre-sen-ta-ción.">
<rect width="1200" height="820" fill="#141416"/>
<text x="600" y="44" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">TYPE YOU CAN TUNE</text>

<!-- ── the desktop: the page, and Type beside it ───────────────────────────── -->
<text x="40" y="84" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">DESKTOP · NO WORD CAN BREAK HERE</text>
<rect x="40" y="96" width="740" height="684" rx="14" fill="#1b1b1f" stroke="#3a3a3a"/>

<!-- the column, ragged -->
<g font-family="serif" fill="#dcddde">
<text x="80" y="150" font-size="24" font-weight="700" font-family="sans-serif">Algo más que la suma</text>
<text x="80" y="196" font-size="17">Un sistema no es solo una colección de cosas.</text>
<text x="80" y="226" font-size="17">Un sistema es un conjunto de elementos</text>
<text x="80" y="256" font-size="17">interrelacionados, organizados de manera</text>
<text x="80" y="286" font-size="17">coherente para alcanzar un fin. Si estudiamos</text>
<text x="80" y="316" font-size="17">esta definición con detenimiento, veremos que</text>
<text x="80" y="346" font-size="17">un sistema debe estar formado por tres tipos</text>
<text x="80" y="376" font-size="17">de cosas: elementos, interrelaciones y una</text>
<text x="80" y="406" font-size="17">función o propósito.</text>
<text x="80" y="452" font-size="17">Nuestro sistema digestivo, por ejemplo, está</text>
<text x="80" y="482" font-size="17">formado por dientes, encimas, estómago e</text>
<text x="80" y="512" font-size="17">intestinos, entre otros elementos. Estos</text>
<text x="80" y="542" font-size="17">elementos se interrelacionan a través del flujo</text>
<text x="80" y="572" font-size="17">físico de alimentos.</text>
</g>
<path d="M 470 196 L 470 572" stroke="#a99cf5" stroke-width="1" stroke-dasharray="3 5"/>
<text x="80" y="610" fill="#a99cf5" font-family="sans-serif" font-size="11">ragged: whole words, even gaps, no rivers</text>
<path d="M 210 650 q 60 30 120 0" fill="none" stroke="#a99cf5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="270" y="694" fill="#a99cf5" font-family="sans-serif" font-size="11" text-anchor="middle">the column made room; your line stayed</text>

<!-- Type, docked -->
<rect x="520" y="112" width="244" height="652" rx="12" fill="#1e1e22" stroke="#3a3a3a"/>
<g font-family="sans-serif">
<text x="540" y="142" fill="#8b8e94" font-size="11" font-weight="600" letter-spacing="1">TYPE</text>
<text x="744" y="143" fill="#8b8e94" font-size="14" text-anchor="middle">×</text>

<text x="540" y="176" fill="#5f6168" font-size="9" font-weight="600" letter-spacing="1">LAYOUT</text>
<rect x="540" y="182" width="204" height="24" rx="12" fill="#2a2a30"/>
<text x="574" y="198" fill="#8b8e94" font-size="11" text-anchor="middle">Scroll</text>
<rect x="610" y="184" width="66" height="20" rx="10" fill="#7f6df2"/>
<text x="643" y="198" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Page</text>
<text x="711" y="198" fill="#8b8e94" font-size="11" text-anchor="middle">Spread</text>

<text x="540" y="234" fill="#5f6168" font-size="9" font-weight="600" letter-spacing="1">LOOK · FONT · SIZE</text>
<rect x="540" y="240" width="204" height="24" rx="12" fill="#2a2a30"/>
<text x="642" y="256" fill="#8b8e94" font-size="11" text-anchor="middle">as before, in its place</text>

<text x="540" y="292" fill="#5f6168" font-size="9" font-weight="600" letter-spacing="1">LINE SPACING</text>
<rect x="540" y="298" width="204" height="24" rx="12" fill="#2a2a30"/>
<text x="574" y="314" fill="#8b8e94" font-size="11" text-anchor="middle">Tight</text>
<rect x="610" y="300" width="66" height="20" rx="10" fill="#3a3a44"/>
<text x="643" y="314" fill="#dcddde" font-size="11" text-anchor="middle">Normal</text>
<text x="711" y="314" fill="#8b8e94" font-size="11" text-anchor="middle">Airy</text>

<text x="540" y="350" fill="#5f6168" font-size="9" font-weight="600" letter-spacing="1">WIDTH</text>
<rect x="540" y="356" width="204" height="24" rx="12" fill="#2a2a30"/>
<text x="574" y="372" fill="#8b8e94" font-size="11" text-anchor="middle">Narrow</text>
<rect x="610" y="358" width="66" height="20" rx="10" fill="#3a3a44"/>
<text x="643" y="372" fill="#dcddde" font-size="11" text-anchor="middle">Medium</text>
<text x="711" y="372" fill="#8b8e94" font-size="11" text-anchor="middle">Wide</text>

<text x="540" y="408" fill="#5f6168" font-size="9" font-weight="600" letter-spacing="1">MARGINS</text>
<rect x="540" y="414" width="204" height="24" rx="12" fill="#2a2a30"/>
<text x="574" y="430" fill="#8b8e94" font-size="11" text-anchor="middle">Small</text>
<rect x="610" y="416" width="66" height="20" rx="10" fill="#3a3a44"/>
<text x="643" y="430" fill="#dcddde" font-size="11" text-anchor="middle">Medium</text>
<text x="711" y="430" fill="#8b8e94" font-size="11" text-anchor="middle">Large</text>

<rect x="540" y="458" width="84" height="26" rx="13" fill="#7f6df2"/>
<text x="582" y="475" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">≡ Justify</text>
<text x="540" y="506" fill="#a3a6ad" font-size="10">Justified text needs hyphenation,</text>
<text x="540" y="520" fill="#a3a6ad" font-size="10">which this device doesn't have for</text>
<text x="540" y="534" fill="#a3a6ad" font-size="10">Spanish — reading ragged here</text>

<rect x="540" y="560" width="96" height="24" rx="12" fill="#2a2a30"/>
<text x="588" y="576" fill="#8b8e94" font-size="11" text-anchor="middle">Focus mode</text>
<rect x="540" y="594" width="78" height="24" rx="12" fill="#2a2a30"/>
<text x="579" y="610" fill="#8b8e94" font-size="11" text-anchor="middle">Time left</text>
<text x="540" y="740" fill="#5f6168" font-size="10">your choice is kept: Justify stays on</text>
</g>

<!-- ── the iPad: the sheet, and a justified column ────────────────────────── -->
<text x="820" y="84" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">IPAD · WORDS BREAK AT SYLLABLES</text>
<rect x="820" y="96" width="340" height="684" rx="26" fill="#1b1b1f" stroke="#3a3a3a" stroke-width="2"/>
<g font-family="serif" fill="#dcddde" font-size="17.5">
<text x="846" y="150" textLength="288" lengthAdjust="spacing">Un sistema es un conjunto de ele-</text>
<text x="846" y="176" textLength="288" lengthAdjust="spacing">mentos interrelacionados, organi-</text>
<text x="846" y="202" textLength="288" lengthAdjust="spacing">zados de manera coherente para al-</text>
<text x="846" y="228" textLength="288" lengthAdjust="spacing">canzar un fin. Su re-pre-sen-ta-</text>
<text x="846" y="254" textLength="288" lengthAdjust="spacing">ción más sencilla son tres tipos de</text>
<text x="846" y="280">cosas.</text>
</g>
<path d="M 1134 140 L 1134 262" stroke="#a99cf5" stroke-width="1" stroke-dasharray="3 5"/>
<text x="990" y="314" fill="#a99cf5" font-family="sans-serif" font-size="11" text-anchor="middle">justified, broken at Spanish syllables</text>

<!-- the bottom sheet -->
<rect x="822" y="470" width="336" height="308" rx="20" fill="#1e1e22" stroke="#3a3a3a"/>
<rect x="970" y="482" width="40" height="4" rx="2" fill="#5f6168"/>
<g font-family="sans-serif">
<text x="846" y="514" fill="#8b8e94" font-size="11" font-weight="600" letter-spacing="1">TYPE</text>
<text x="846" y="546" fill="#5f6168" font-size="9" font-weight="600" letter-spacing="1">WIDTH</text>
<rect x="846" y="552" width="288" height="24" rx="12" fill="#2a2a30"/>
<text x="894" y="568" fill="#8b8e94" font-size="11" text-anchor="middle">Narrow</text>
<rect x="944" y="554" width="92" height="20" rx="10" fill="#3a3a44"/>
<text x="990" y="568" fill="#dcddde" font-size="11" text-anchor="middle">Medium</text>
<text x="1086" y="568" fill="#8b8e94" font-size="11" text-anchor="middle">Wide</text>
<rect x="846" y="598" width="84" height="26" rx="13" fill="#7f6df2"/>
<text x="888" y="615" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">≡ Justify</text>
<text x="846" y="646" fill="#a3a6ad" font-size="11">Hyphenated as Spanish</text>
<text x="846" y="752" fill="#5f6168" font-size="10">the same setting, a device that can</text>
</g>
</svg>
