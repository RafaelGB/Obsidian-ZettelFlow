<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Your first flow in three steps: design a Canvas, configure a step, run the wizard">
<rect width="1200" height="620" fill="#1e1e1e"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b8e94"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f6df2"/></marker></defs><rect x="24" y="24" width="360" height="500" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="48" y="60" fill="#dcddde" font-family="sans-serif" font-size="18" font-weight="650" text-anchor="start">Design</text><text x="48" y="82" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">a .canvas file: each node a step, arrows the order</text><rect x="420" y="24" width="360" height="500" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="444" y="60" fill="#dcddde" font-family="sans-serif" font-size="18" font-weight="650" text-anchor="start">Configure</text><text x="444" y="82" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">right-click a node → Edit ZettelFlow step</text><rect x="816" y="24" width="360" height="500" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="840" y="60" fill="#dcddde" font-family="sans-serif" font-size="18" font-weight="650" text-anchor="start">Run</text><text x="840" y="82" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">ribbon button → Create note</text><circle cx="36" cy="36" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="36" y="41" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="432" cy="36" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="432" y="41" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="828" cy="36" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="828" y="41" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#323232"/></pattern><rect x="44" y="100" width="320" height="404" rx="8" fill="url(#dots)" stroke="#2e2e2e" stroke-width="1"/><rect x="74" y="130" width="260" height="64" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><rect x="74" y="130" width="5" height="64" rx="2" fill="#fb464c"/><text x="90" y="156" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="650" text-anchor="start">Daily note</text><text x="90" y="177" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Root · Target folder: Journal</text><rect x="276" y="138" width="38.64" height="20" rx="10.0" fill="#7f6df2" stroke="#7f6df2" stroke-width="1.5"/><text x="295.32" y="151.96" fill="#fff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Root</text><rect x="74" y="250" width="260" height="64" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><rect x="74" y="250" width="5" height="64" rx="2" fill="#e9973f"/><text x="90" y="276" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="650" text-anchor="start">Mood</text><text x="90" y="297" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Selector · 😀 😐 😞</text><rect x="74" y="370" width="260" height="64" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><rect x="74" y="370" width="5" height="64" rx="2" fill="#44cf6e"/><text x="90" y="396" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="650" text-anchor="start">Highlights</text><text x="90" y="417" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Prompt · what went well?</text><line x1="204" y1="194" x2="204" y2="246" stroke="#8b8e94" stroke-width="2" marker-end="url(#arr)"/><line x1="204" y1="314" x2="204" y2="366" stroke="#8b8e94" stroke-width="2" marker-end="url(#arr)"/><rect x="440" y="100" width="320" height="404" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="460" y="128" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="650" text-anchor="start">Edit ZettelFlow step</text><text x="460" y="162" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Root toggle</text><text x="460" y="180" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">The flow starts here.</text><rect x="704" y="154" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="733" cy="165" r="8" fill="#fff" stroke="none" stroke-width="2"/><line x1="460" y1="196" x2="744" y2="196" stroke="#3a3a3a" stroke-width="1"/><text x="460" y="222" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Optional toggle</text><text x="460" y="240" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">The step can be skipped.</text><rect x="704" y="214" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="715" cy="225" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><line x1="460" y1="256" x2="744" y2="256" stroke="#3a3a3a" stroke-width="1"/><text x="460" y="282" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Target folder</text><text x="460" y="300" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Where the note is created.</text><rect x="640" y="272" width="104" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="650" y="293.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Journal</text><line x1="460" y1="316" x2="744" y2="316" stroke="#3a3a3a" stroke-width="1"/><text x="460" y="344" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Actions management</text><rect x="460" y="358" width="284" height="28" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="474" y="377" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Calendar</text><text x="730" y="377" fill="#8b8e94" font-family="monospace" font-size="12" font-weight="400" text-anchor="end">date</text><rect x="460" y="392" width="284" height="28" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="474" y="411" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Selector</text><text x="730" y="411" fill="#8b8e94" font-family="monospace" font-size="12" font-weight="400" text-anchor="end">mood</text><rect x="460" y="426" width="284" height="28" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="474" y="445" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Prompt</text><text x="730" y="445" fill="#8b8e94" font-family="monospace" font-size="12" font-weight="400" text-anchor="end">highlights</text><rect x="836" y="100" width="320" height="404" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><rect x="852" y="116" width="44" height="44" rx="8" fill="#262626" stroke="#7f6df2" stroke-width="2"/><text x="874" y="145" fill="#7f6df2" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">Z</text><rect x="908" y="116" width="232" height="128" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="928" y="142" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Think</text><rect x="914" y="152" width="220" height="26" rx="5" fill="#33305a" stroke="none" stroke-width="2"/><text x="928" y="170" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">Create note</text><text x="928" y="198" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Community</text><text x="928" y="226" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">This note</text><line x1="996" y1="248" x2="996" y2="284" stroke="#7f6df2" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="852" y="292" width="288" height="196" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="868" y="316" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Step 2 · about 1 left</text><text x="868" y="344" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="650" text-anchor="start">How do you feel today?</text><rect x="868" y="360" width="256" height="30" rx="7" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="882" y="380" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">😀  Good</text><rect x="868" y="398" width="256" height="30" rx="7" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="882" y="418" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">😐  Neutral</text><rect x="868" y="436" width="256" height="30" rx="7" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="882" y="456" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">😞  Low</text><circle cx="46" cy="556" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="561" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="66" y="561" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Mark one node as the root: that is where the wizard starts.</text><circle cx="46" cy="582" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="587" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="66" y="587" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Each step holds actions — prompt, calendar, selector, tags… — that fill the note.</text><text x="620" y="561" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Then every new note walks the same flow — no template to copy by hand.</text>
</svg>
