<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Installing ZettelFlow: Settings, Community plugins, Browse, search ZettelFlow, Install and Enable">
<rect width="1200" height="560" fill="#1e1e1e"/><rect x="24" y="24" width="1152" height="420" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><rect x="24" y="24" width="250" height="420" rx="12" fill="#232323" stroke="#3a3a3a" stroke-width="2"/><text x="48" y="60" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="650" text-anchor="start">Settings</text><text x="52" y="100" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">General</text><text x="52" y="134" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Editor</text><text x="52" y="168" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Files and links</text><text x="52" y="202" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Appearance</text><text x="52" y="236" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Hotkeys</text><text x="52" y="270" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Core plugins</text><rect x="36" y="284" width="226" height="30" rx="6" fill="#33305a" stroke="none" stroke-width="2"/><text x="52" y="304" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Community plugins</text><circle cx="250" cy="300" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="250" y="305" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="300" y="64" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Community plugins › Browse</text><rect x="300" y="80" width="520" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="310" y="101.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">ZettelFlow</text><circle cx="806" cy="96" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="806" y="101" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="840" y="101" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Sort: Downloads</text><rect x="300" y="130" width="360" height="140" rx="10" fill="#2a2640" stroke="#7f6df2" stroke-width="2"/><text x="320" y="160" fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="start">ZettelFlow</text><text x="320" y="180" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">By RafaelGB</text><text x="320" y="206" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Canvas workflows for notes, and a companion</text><text x="320" y="226" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">that helps you think about what you wrote.</text><text x="320" y="254" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Desktop and mobile</text><rect x="300" y="286" width="360" height="60" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="320" y="312" fill="#5c5f66" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Another plugin</text><text x="320" y="332" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">…</text><rect x="300" y="356" width="360" height="60" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="320" y="382" fill="#5c5f66" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Another plugin</text><text x="320" y="402" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">…</text><rect x="684" y="130" width="470" height="290" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="708" y="166" fill="#dcddde" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="start">ZettelFlow</text><text x="708" y="190" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">RafaelGB</text><rect x="708" y="210" width="92" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="754.0" y="231.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Install</text><rect x="812" y="210" width="92" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="858.0" y="231.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">Enable</text><circle cx="924" cy="226" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="924" y="231" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="708" y="280" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Most plugins help you write. Almost none help you think.</text><text x="708" y="304" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Turn a Canvas into a guided note-creation wizard, then</text><text x="708" y="324" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">return to claims, collide notes, place wagers and grow</text><text x="708" y="344" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">ideas — offline, with AI off.</text><circle cx="46" cy="478" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="483" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="66" y="483" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Settings → Community plugins → Browse (turn community plugins on first if Obsidian asks).</text><circle cx="46" cy="504" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="509" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="66" y="509" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Search “ZettelFlow”.</text><circle cx="46" cy="530" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="535" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="66" y="535" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Install, then Enable. The ZettelFlow button appears in the ribbon.</text>
</svg>
