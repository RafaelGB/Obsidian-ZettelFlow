<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-label="AI turned on, with its fields and what leaves your vault; and Advanced open, with every folder ZettelFlow uses in one grid">
<rect width="1200" height="1270" fill="#1e1e1e"/><rect x="16" y="16" width="1168" height="1152" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="40" y="46" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Settings  ›  Community plugins  ›  ZettelFlow</text><text x="1160" y="46" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><line x1="16" y1="62" x2="1184" y2="62" stroke="#3a3a3a" stroke-width="1"/><text x="89.5" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Flows</text><text x="189.8" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Creating notes</text><text x="323.40000000000003" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Your knowledge</text><text x="434.80000000000007" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Thinking</text><rect x="483.40000000000003" y="76" width="36.8" height="32" rx="7" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="501.8" y="97" fill="#fff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">AI</text><text x="576.2" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Automation</text><text x="672.8000000000001" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Advanced</text><line x1="60" y1="120" x2="1140" y2="120" stroke="#3a3a3a" stroke-width="1"/><rect x="60" y="140" width="36" height="36" rx="9" fill="#2c2747" stroke="#2c2747" stroke-width="2"/><g transform="translate(69,149) scale(1.0)" fill="none" stroke="#7f6df2" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5l1.5 4.6 4.6 1.6-4.6 1.6L9 14l-1.5-4.7-4.6-1.6 4.6-1.6z"/></g><text x="110" y="156" fill="#dcddde" font-family="sans-serif" font-size="17" font-weight="650" text-anchor="start">AI</text><text x="110" y="174" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Optional. Everything works with it off.</text><rect x="60" y="192" width="1080" height="366" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="76" y="216" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Enable AI actions</text><text x="76" y="235" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Allow AI actions to call your configured provider. Off by default.</text><rect x="1084" y="210.0" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="1113" cy="221.0" r="8" fill="#fff" stroke="none" stroke-width="2"/><line x1="60" y1="250" x2="1140" y2="250" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="274" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Endpoint URL</text><text x="76" y="293" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Full OpenAI-compatible chat-completions URL. Must be https (http only on localhost).</text><rect x="744" y="263.0" width="380" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="754" y="284.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">https://api.openai.com/v1/chat/completions</text><line x1="60" y1="308" x2="1140" y2="308" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="332" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Model</text><text x="76" y="351" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The model name your provider expects.</text><rect x="884" y="321.0" width="240" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="894" y="342.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">gpt-4o-mini</text><line x1="60" y1="366" x2="1140" y2="366" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="390" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">API key</text><text x="76" y="409" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Your provider key, stored in this vault's plugin data. Sent only to your endpoint.</text><rect x="884" y="379.0" width="240" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="894" y="400.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">••••••••••••••</text><line x1="60" y1="424" x2="1140" y2="424" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="448" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Limits</text><text x="76" y="467" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Characters sent per request · tokens requested back.</text><rect x="914" y="437.0" width="100" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="924" y="458.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">12000</text><rect x="1024" y="437.0" width="100" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="1034" y="458.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">800</text><line x1="60" y1="482" x2="1140" y2="482" stroke="#3a3a3a" stroke-width="1"/><path d="M61 482 H1139 V548 a9 9 0 0 1 -9 9 H70 a9 9 0 0 1 -9 -9 Z" fill="#1c241d"/><g transform="translate(78,498) scale(0.95)" fill="none" stroke="#57ab5a" stroke-width="1.89" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5 2.8 4v5c0 4 2.8 6.3 6.2 7.5 3.4-1.2 6.2-3.5 6.2-7.5V4z"/><path d="m6.3 9 1.9 1.9 3.6-3.6"/></g><text x="104" y="510" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">What leaves your vault</text><text x="104" y="529" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">When you run an AI action, the (bounded) note content is sent only to the https endpoint above. AI never runs</text><text x="104" y="546" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">on its own in automations, and nothing it writes reaches a note until you accept it. No telemetry, no bundled key, no other endpoint.</text><rect x="60" y="586" width="1080" height="64" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="6 5"/><rect x="74" y="600" width="36" height="36" rx="9" fill="#262626" stroke="#262626" stroke-width="2"/><g transform="translate(83,609) scale(1.0)" fill="none" stroke="#8b8e94" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="2.6"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4"/></g><text x="124" y="616" fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="650" text-anchor="start">Advanced</text><text x="124" y="635" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Where ZettelFlow keeps its own files, script declarations, logging and timings. Nothing here is needed to use it.</text><rect x="1084" y="607" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="1113" cy="618" r="8" fill="#fff" stroke="none" stroke-width="2"/><rect x="60" y="664" width="1080" height="312" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><path d="M61 700 V674 a9 9 0 0 1 9 -9 H1130 a9 9 0 0 1 9 9 V700 Z" fill="#262626"/><line x1="60" y1="700" x2="1140" y2="700" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="687" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">FOLDERS ZETTELFLOW USES</text><text x="76.0" y="724" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Folder flows</text><g transform="translate(564.0,711) scale(0.8)" fill="none" stroke="#8b8e94" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9a6.5 6.5 0 1 0 2-4.7L2.5 6.3"/><path d="M2.5 2.5v3.8h3.8"/></g><rect x="76.0" y="734" width="508.0" height="28" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="86.0" y="753.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">_ZettelFlow/folders</text><text x="76.0" y="780" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Canvases that run on a folder.</text><line x1="600.0" y1="700" x2="600.0" y2="792" stroke="#3a3a3a" stroke-width="1"/><text x="616.0" y="724" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Event flows</text><g transform="translate(1104.0,711) scale(0.8)" fill="none" stroke="#8b8e94" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9a6.5 6.5 0 1 0 2-4.7L2.5 6.3"/><path d="M2.5 2.5v3.8h3.8"/></g><rect x="616.0" y="734" width="508.0" height="28" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="626.0" y="753.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">_ZettelFlow/events</text><text x="616.0" y="780" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Canvases that react to vault events.</text><line x1="60" y1="792" x2="1140" y2="792" stroke="#3a3a3a" stroke-width="1"/><text x="76.0" y="816" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Hook flows</text><g transform="translate(564.0,803) scale(0.8)" fill="none" stroke="#8b8e94" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9a6.5 6.5 0 1 0 2-4.7L2.5 6.3"/><path d="M2.5 2.5v3.8h3.8"/></g><rect x="76.0" y="826" width="508.0" height="28" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="86.0" y="845.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">_ZettelFlow/hooks</text><text x="76.0" y="872" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Flows a property hook can launch.</text><line x1="600.0" y1="792" x2="600.0" y2="884" stroke="#3a3a3a" stroke-width="1"/><text x="616.0" y="816" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Scripts</text><g transform="translate(1104.0,803) scale(0.8)" fill="none" stroke="#8b8e94" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9a6.5 6.5 0 1 0 2-4.7L2.5 6.3"/><path d="M2.5 2.5v3.8h3.8"/></g><rect x="616.0" y="826" width="508.0" height="28" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="626.0" y="845.0" fill="#5c5f66" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Select a folder</text><text x="616.0" y="872" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Your script library, read by the zf API.</text><line x1="60" y1="884" x2="1140" y2="884" stroke="#3a3a3a" stroke-width="1"/><text x="76.0" y="908" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Markdown templates</text><g transform="translate(564.0,895) scale(0.8)" fill="none" stroke="#8b8e94" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9a6.5 6.5 0 1 0 2-4.7L2.5 6.3"/><path d="M2.5 2.5v3.8h3.8"/></g><rect x="76.0" y="918" width="508.0" height="28" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="86.0" y="937.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">_ZettelFlowMdTemplates</text><text x="76.0" y="964" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Templates installed from the gallery.</text><line x1="600.0" y1="884" x2="600.0" y2="976" stroke="#3a3a3a" stroke-width="1"/><text x="616.0" y="908" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Thinking space</text><text x="616.0" y="934" fill="#dcddde" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">_ZettelFlow/lab</text><rect x="904.0" y="916" width="220" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="1014.0" y="937.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">Go to the thinking space setting</text><text x="616.0" y="964" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Set under Thinking, where it belongs.</text><rect x="60" y="990" width="1080" height="152" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><path d="M61 1026 V1000 a9 9 0 0 1 9 -9 H1130 a9 9 0 0 1 9 9 V1026 Z" fill="#262626"/><line x1="60" y1="1026" x2="1140" y2="1026" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="1013" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">SCRIPTS AND LOGGING</text><text x="76" y="1050" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Script type declarations</text><text x="76" y="1069" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Write a zettelflow.d.ts into your scripts folder so an external editor knows the zf API.</text><rect x="1024" y="1039.0" width="100" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="1074.0" y="1060.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">Generate</text><line x1="60" y1="1084" x2="1140" y2="1084" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="1108" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Logging</text><text x="76" y="1127" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">How much ZettelFlow writes to the developer console.</text><rect x="954" y="1097.0" width="170" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="964" y="1118.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Off</text><polyline points="1101,1111.0 1106,1116.0 1111,1111.0" fill="none" stroke="#8b8e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="220" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="225" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="44" cy="280" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="285" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="44" cy="508" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="513" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="44" cy="618" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="623" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="44" cy="682" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="687" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><circle cx="40" cy="1194" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="40" y="1199" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="60" y="1199" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">One switch — off by default</text><circle cx="40" cy="1220" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="40" y="1225" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="60" y="1225" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The provider's fields appear only when it is on</text><circle cx="40" cy="1246" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="40" y="1251" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="60" y="1251" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">What leaves your vault — always said</text><circle cx="630" cy="1194" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="630" y="1199" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="650" y="1199" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Advanced folds, and remembers whether you left it open</text><circle cx="630" cy="1220" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="630" y="1225" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="650" y="1225" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Every folder ZettelFlow uses in one grid, each with its reset</text>
</svg>
