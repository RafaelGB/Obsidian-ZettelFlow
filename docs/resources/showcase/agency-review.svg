<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d" font-family="sans-serif">
<title id="t">Agency review — the decisions you made, newest first</title>
<desc id="d">The agency review: a header with the cognitive agency index, the accepted/modified/rejected breakdown as a bar and a plain-language reading, then a list of decisions with the note, the verdict, where the proposal came from, confidence, date and your rationale.</desc>
<rect x="0" y="0" width="1200" height="720" rx="0" fill="#1e1e1e"/><rect x="0" y="0" width="1200" height="40" rx="0" fill="#181818"/><rect x="12" y="8" width="91.6" height="32" rx="7" fill="#1e1e1e"/><circle cx="30" cy="24" r="5" fill="none" stroke="#dcddde" stroke-width="1.6"/><text x="42" y="29" fill="#dcddde" font-size="13">Health</text><text x="40" y="92" fill="#dcddde" font-size="22" font-weight="700">Your decision history</text><rect x="40" y="112" width="1120" height="104" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="64" y="146" fill="#8b8e94" font-size="14">Cognitive agency index</text><text x="64" y="192" fill="#dcddde" font-size="40" font-weight="700">56%</text><line x1="250" y1="128" x2="250" y2="200" stroke="#3a3a3a" stroke-width="1.5"/><text x="276" y="152" fill="#dcddde" font-size="16">9 accepted · 5 modified · 4 rejected</text><text x="276" y="184" fill="#8b8e94" font-size="14">A healthy mix — you accept some and push back on others.</text><text x="1136" y="156" fill="#e0a351" font-size="14" font-weight="600" text-anchor="end">a description of your verdicts —</text><text x="1136" y="178" fill="#e0a351" font-size="14" font-weight="600" text-anchor="end">never a grade, never transmitted</text><rect x="40" y="240" width="1120" height="48" rx="8" fill="#222"/><text x="60" y="270" fill="#7f6df2" font-size="15" font-weight="600">Writing is thinking</text><rect x="280" y="252" width="96" height="24" rx="12" fill="#2f2a4a"/><text x="328" y="268.5" fill="#c9c0ff" font-size="12.5" text-anchor="middle">Modified</text><text x="396" y="270" fill="#8b8e94" font-size="13.5">AI</text><text x="470" y="270" fill="#8b8e94" font-size="13.5">High</text><text x="548" y="270" fill="#8b8e94" font-size="13.5">Sep 29, 2026</text><text x="690" y="270" fill="#dcddde" font-size="14" font-style="italic">Kept the link, rewrote the claim</text><rect x="40" y="296" width="1120" height="48" rx="8" fill="#1e1e1e"/><text x="60" y="326" fill="#7f6df2" font-size="15" font-weight="600">Second-order effects</text><rect x="280" y="308" width="96" height="24" rx="12" fill="#3a2a1c"/><text x="328" y="324.5" fill="#f2b46b" font-size="12.5" text-anchor="middle">Rejected</text><text x="396" y="326" fill="#8b8e94" font-size="13.5">AI</text><text x="470" y="326" fill="#8b8e94" font-size="13.5">Medium</text><text x="548" y="326" fill="#8b8e94" font-size="13.5">Sep 27, 2026</text><text x="690" y="326" fill="#dcddde" font-size="14" font-style="italic">The counterpoint misreads the source</text><rect x="40" y="352" width="1120" height="48" rx="8" fill="#222"/><text x="60" y="382" fill="#7f6df2" font-size="15" font-weight="600">Feedback loops</text><rect x="280" y="364" width="96" height="24" rx="12" fill="#303030"/><text x="328" y="380.5" fill="#8b8e94" font-size="12.5" text-anchor="middle">Accepted</text><text x="396" y="382" fill="#8b8e94" font-size="13.5">Derived</text><text x="548" y="382" fill="#8b8e94" font-size="13.5">Sep 24, 2026</text><rect x="40" y="408" width="1120" height="48" rx="8" fill="#1e1e1e"/><text x="60" y="438" fill="#7f6df2" font-size="15" font-weight="600">Atomic notes</text><rect x="280" y="420" width="96" height="24" rx="12" fill="#1d3326"/><text x="328" y="436.5" fill="#7ee2a0" font-size="12.5" text-anchor="middle">Confirmed</text><text x="396" y="438" fill="#8b8e94" font-size="13.5">You</text><text x="470" y="438" fill="#8b8e94" font-size="13.5">High</text><text x="548" y="438" fill="#8b8e94" font-size="13.5">Sep 21, 2026</text><text x="690" y="438" fill="#dcddde" font-size="14" font-style="italic">Still true after the refactor</text><rect x="40" y="464" width="1120" height="48" rx="8" fill="#222"/><text x="60" y="494" fill="#7f6df2" font-size="15" font-weight="600">Spaced repetition</text><rect x="280" y="476" width="96" height="24" rx="12" fill="#303030"/><text x="328" y="492.5" fill="#8b8e94" font-size="12.5" text-anchor="middle">Accepted</text><text x="396" y="494" fill="#8b8e94" font-size="13.5">AI</text><text x="470" y="494" fill="#8b8e94" font-size="13.5">Low</text><text x="548" y="494" fill="#8b8e94" font-size="13.5">Sep 18, 2026</text><rect x="40" y="520" width="1120" height="48" rx="8" fill="#1e1e1e"/><text x="60" y="550" fill="#7f6df2" font-size="15" font-weight="600">Feynman technique</text><rect x="280" y="532" width="96" height="24" rx="12" fill="#3a2226"/><text x="328" y="548.5" fill="#ff8a8f" font-size="12.5" text-anchor="middle">Challenged</text><text x="396" y="550" fill="#8b8e94" font-size="13.5">You</text><text x="470" y="550" fill="#8b8e94" font-size="13.5">Medium</text><text x="548" y="550" fill="#8b8e94" font-size="13.5">Sep 15, 2026</text><text x="690" y="550" fill="#dcddde" font-size="14" font-style="italic">Does it work for maths?</text><rect x="40" y="576" width="1120" height="48" rx="8" fill="#222"/><text x="60" y="606" fill="#7f6df2" font-size="15" font-weight="600">Luhmann's slip-box</text><rect x="280" y="588" width="96" height="24" rx="12" fill="#2f2a4a"/><text x="328" y="604.5" fill="#c9c0ff" font-size="12.5" text-anchor="middle">Modified</text><text x="396" y="606" fill="#8b8e94" font-size="13.5">AI</text><text x="548" y="606" fill="#8b8e94" font-size="13.5">Sep 11, 2026</text><text x="690" y="606" fill="#dcddde" font-size="14" font-style="italic">Narrowed to his method, not the tool</text>
