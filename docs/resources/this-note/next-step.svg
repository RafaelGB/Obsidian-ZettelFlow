<circle cx="886" cy="65" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/>
<text x="886" y="70" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="906" y="70" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">The moves suggestNextMoves() returns,</text>
<text x="906" y="89" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">in its order — each with the fact it</text>
<text x="906" y="108" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">rests on, never a grade. One filled</text>
<text x="906" y="127" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">button: the step in hand.</text>
<circle cx="886" cy="171" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/>
<text x="886" y="176" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="906" y="176" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">The note's tools, quiet buttons: make</text>
<text x="906" y="195" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">a move, think about it, say what it</text>
<text x="906" y="214" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">claims (or edit the claim it states),</text>
<text x="906" y="233" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">cultivate it — always on this note.</text>
<circle cx="886" cy="277" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/>
<text x="886" y="282" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="906" y="282" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Pressing a step opens it under itself;</text>
<text x="906" y="301" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">pressing it again closes it. While it</text>
<text x="906" y="320" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">is open the step gives up its fill —</text>
<text x="906" y="339" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">a confirm inside takes it.</text>
<circle cx="886" cy="383" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/>
<text x="886" y="388" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="906" y="388" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Always a way to link any note: the</text>
<text x="906" y="407" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">picker is there even when nothing</text>
<text x="906" y="426" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">nearby is offered.</text>
<circle cx="886" cy="470" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/>
<text x="886" y="475" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="906" y="475" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">After you confirm, one line answers</text>
<text x="906" y="494" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">with an Undo for 30 s, in this note's</text>
<text x="906" y="513" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">own batch — no toast. The list starts</text>
<text x="906" y="532" fill="#b3b3b3" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">again on its first open step.</text>
