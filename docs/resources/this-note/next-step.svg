<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="This note — the next-step card, a move open and its answer with an undo (mock)">
<rect width="1200" height="700" fill="#1e1e1e"/>
<text x="24" y="34" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">One move at a time, finished where you are</text><rect x="24" y="48" width="400" height="470" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="44" y="82" fill="#dcddde" font-family="sans-serif" font-size="18" font-weight="650" text-anchor="start">Ideas as debt</text><text x="352" y="82" fill="#8b8e94" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">📌</text><text x="380" y="82" fill="#8b8e94" font-family="sans-serif" font-size="17" font-weight="400" text-anchor="start">↻</text><circle cx="49" cy="107" r="5" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="59" y="112" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">Fleeting</text><line x1="126.2" y1="107" x2="140.2" y2="107" stroke="#3a3a3a" stroke-width="2"/><circle cx="153.2" cy="107" r="5" fill="none" stroke="#a99cf7" stroke-width="2"/><text x="163.2" y="112" fill="#a99cf7" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Literature</text><line x1="245.2" y1="107" x2="259.2" y2="107" stroke="#3a3a3a" stroke-width="2"/><circle cx="272.2" cy="107" r="5" fill="none" stroke="#5c5f66" stroke-width="2"/><text x="282.2" y="112" fill="#5c5f66" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Permanent</text><line x1="28" y1="130" x2="420" y2="130" stroke="#3a3a3a" stroke-width="2"/><rect x="44" y="144" width="360" height="300" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="60" y="170" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="start">NEXT STEP</text><text x="388" y="170" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="end">1 of 3</text><text x="60" y="200" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Makes 2 claims with no source.</text><rect x="60" y="218" width="130" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="125.0" y="239" fill="#fff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Add a source</text><text x="206" y="239" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Another step</text><line x1="60" y1="266" x2="388" y2="266" stroke="#3a3a3a" stroke-width="2"/><text x="60" y="290" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Goes in the note's source property.</text><rect x="60" y="302" width="328" height="34" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="72" y="324" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Cunningham 1992, The WyCash portfolio</text><rect x="60" y="350" width="64" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="92.0" y="371" fill="#fff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Add</text><text x="140" y="371" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Cancel</text><text x="60" y="414" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Nothing is written until you confirm.</text><circle cx="34" cy="170" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="175" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="34" cy="234" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="239" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="34" cy="319" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="324" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="456" y="34" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">After the click: one line, an undo, and the next move</text><rect x="456" y="48" width="400" height="470" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="476" y="82" fill="#dcddde" font-family="sans-serif" font-size="18" font-weight="650" text-anchor="start">Ideas as debt</text><text x="784" y="82" fill="#8b8e94" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">📌</text><text x="812" y="82" fill="#8b8e94" font-family="sans-serif" font-size="17" font-weight="400" text-anchor="start">↻</text><circle cx="481" cy="107" r="5" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="491" y="112" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">Fleeting</text><line x1="558.2" y1="107" x2="572.2" y2="107" stroke="#3a3a3a" stroke-width="2"/><circle cx="585.2" cy="107" r="5" fill="none" stroke="#a99cf7" stroke-width="2"/><text x="595.2" y="112" fill="#a99cf7" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Literature</text><line x1="677.2" y1="107" x2="691.2" y2="107" stroke="#3a3a3a" stroke-width="2"/><circle cx="704.2" cy="107" r="5" fill="none" stroke="#5c5f66" stroke-width="2"/><text x="714.2" y="112" fill="#5c5f66" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Permanent</text><line x1="460" y1="130" x2="852" y2="130" stroke="#3a3a3a" stroke-width="2"/><rect x="476" y="144" width="360" height="330" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="492" y="170" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="start">NEXT STEP</text><text x="820" y="170" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="end">1 of 2</text><text x="492" y="200" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="400" text-anchor="start">It does not link to any note yet.</text><rect x="492" y="218" width="104" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="544.0" y="239" fill="#fff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Connect</text><text x="612" y="239" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Another step</text><line x1="492" y1="266" x2="820" y2="266" stroke="#3a3a3a" stroke-width="2"/><text x="492" y="290" fill="#a99cf7" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Luhmann's slip-box</text><text x="492" y="308" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Shares tag #pkm</text><text x="820" y="290" fill="#a99cf7" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">Link</text><text x="492" y="336" fill="#a99cf7" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">PKM vs Zettelkasten</text><text x="492" y="354" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Links to the same notes</text><text x="820" y="336" fill="#a99cf7" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">Link</text><text x="492" y="386" fill="#a99cf7" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Choose another note…</text><text x="660" y="386" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Cancel</text><line x1="492" y1="406" x2="820" y2="406" stroke="#3a3a3a" stroke-width="2"/><text x="492" y="432" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Source added.</text><text x="588" y="432" fill="#a99cf7" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">Undo</text><circle cx="466" cy="386" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="466" y="391" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="466" cy="427" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="466" y="432" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><circle cx="34" cy="560" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="565" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="54" y="565" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The moves suggestNextMoves() returns, in its order: the fact each rests on, never a grade.</text><circle cx="34" cy="586" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="591" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="54" y="591" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">One primary action; Another step looks at the next move without writing anything.</text><circle cx="34" cy="612" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="617" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="54" y="617" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Each move opens a panel in place — a source, a link, an example, a state — and writes on confirm.</text><circle cx="34" cy="638" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="643" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="54" y="643" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Always a way to link any note: the picker is there even when nothing nearby is offered.</text><circle cx="34" cy="664" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="669" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="54" y="669" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The answer is one line with an Undo for 30 s, into this note's own batch — no toast.</text><text x="880" y="90" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Undoing a promotion also</text><text x="880" y="108" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">withdraws the decision it</text><text x="880" y="126" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">recorded, so the note's story</text><text x="880" y="144" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">never tells what you took back.</text><text x="880" y="186" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The stepper's next step</text><text x="880" y="204" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">(Literature, above) opens the</text><text x="880" y="222" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">same confirm as the card.</text>
</svg>
