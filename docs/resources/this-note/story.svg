t-anchor="middle">3</text><circle cx="34" cy="562" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="567" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="522" cy="236" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="522" y="241" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="542" y="241" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">A day still ahead is pinned above the story — a date, never a countdown.</text><circle cx="522" cy="270" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="522" y="275" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="542" y="275" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Chips count what each would show; one with nothing is not drawn.</text><circle cx="522" cy="304" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="522" y="309" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="542" y="309" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Newest first, by month. What you decided carries the accent; a return is one before/now unit.</text><circle cx="522" cy="338" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="522" y="343" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="542" y="343" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">A run of snapshots whose state did not change folds to one line; click to open it in place.</text><circle cx="522" cy="372" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="522" y="377" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="542" y="377" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Share and trace live in the head's ⋯ menu; trace follows a pinned note.</text><circle cx="1158" cy="120" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="1158" y="125" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="508" y="430" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Every event says how long ago in words; the day itself is on hover and for screen readers.</text><text x="508" y="454" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Reading, filtering and unfolding write nothing. Forget this move touches the move log only.</text>
</svg>
