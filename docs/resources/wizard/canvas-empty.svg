<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="An empty flow canvas offers a way in: Create the first step, or Browse systems">
<rect width="1200" height="420" fill="#1e1e1e"/><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3a3a3a"/></pattern></defs><rect x="30" y="30" width="1140" height="360" rx="10" fill="#191919" stroke="#3a3a3a" stroke-width="1.5"/><rect x="30" y="30" width="1140" height="360" rx="10" fill="url(#dots)"/><rect x="400" y="90" width="400" height="220" rx="14" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="600.0" y="140" fill="#a99cf7" font-family="sans-serif" font-size="30" font-weight="400" text-anchor="middle">⤳</text><text x="600.0" y="178" fill="#dcddde" font-family="sans-serif" font-size="17" font-weight="650" text-anchor="middle">This canvas has no steps yet</text><text x="600.0" y="204" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">A step is a note or a card the wizard walks. Start with</text><text x="600.0" y="222" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">one, or install a system that already works.</text><rect x="446" y="246" width="176" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="534.0" y="267.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">+  Create the first step</text><rect x="632" y="246" width="124" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="694.0" y="267.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">Browse systems</text><rect x="536" y="338" width="126" height="40" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="556" y="363" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">▤</text><text x="586" y="363" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">▢</text><rect x="612" y="346" width="26" height="24" rx="6" fill="#7f6df2" stroke="none" stroke-width="0"/><text x="625" y="363" fill="#fff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">Z</text>
</svg>
