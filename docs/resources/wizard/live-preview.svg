<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The live preview: the note as it will be, what the build will change, and connection suggestions with Link, Other words and Not related">
<rect width="1200" height="640" fill="#1e1e1e"/><rect x="24" y="24" width="560" height="560" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="40" y="52" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">LIVE PREVIEW</text><rect x="40" y="66" width="528" height="320" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="56" y="96" fill="#dcddde" font-family="sans-serif" font-size="17" font-weight="650" text-anchor="start">Event sourcing</text><line x1="56" y1="110" x2="56" y2="176" stroke="#3a3a3a" stroke-width="2"/><text x="66" y="122" fill="#8b8e94" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">state: </text><text x="119.19999999999999" y="122" fill="#dcddde" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">fleeting</text><text x="66" y="144" fill="#8b8e94" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">type: </text><text x="111.6" y="144" fill="#a99cf7" font-family="monospace" font-size="12.5" font-weight="600" text-anchor="start">concept</text><text x="66" y="166" fill="#8b8e94" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">tags: </text><text x="111.6" y="166" fill="#a99cf7" font-family="monospace" font-size="12.5" font-weight="600" text-anchor="start">[architecture]</text><text x="56" y="196" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">## Summary</text><text x="56" y="218" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">State is a projection of history,</text><text x="56" y="236" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">not the other way round.</text><line x1="56" y1="260" x2="552" y2="260" stroke="#3a3a3a" stroke-width="1"/><text x="56" y="282" fill="#5c5f66" font-family="sans-serif" font-size="11" font-weight="650" text-anchor="start">WHAT THIS WILL CHANGE</text><rect x="56" y="294" width="40.64" height="20" rx="10.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="76.32" y="307.96" fill="#44cf6e" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="middle">Adds</text><text x="104.64" y="308" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">type → concept</text><rect x="56" y="324" width="40.64" height="20" rx="10.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="76.32" y="337.96" fill="#44cf6e" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="middle">Adds</text><text x="104.64" y="338" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">tags → architecture</text><rect x="56" y="354" width="40.64" height="20" rx="10.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="76.32" y="367.96" fill="#44cf6e" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="middle">Adds</text><text x="104.64" y="368" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">1 block of text</text><text x="40" y="420" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">CONNECTION SUGGESTIONS</text><text x="40" y="440" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">From shared tags and title words — yours to accept or ignore.</text><line x1="40" y1="452" x2="568" y2="452" stroke="#3a3a3a" stroke-width="1"/><text x="40" y="476" fill="#a99cf7" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">CQRS</text><text x="568" y="476" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Not related</text><rect x="398" y="460" width="80" height="26" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="438" y="477" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Other words</text><rect x="348" y="460" width="44" height="26" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="370" y="477" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Link</text><line x1="40" y1="494" x2="568" y2="494" stroke="#3a3a3a" stroke-width="1"/><text x="40" y="518" fill="#a99cf7" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Eventual consistency</text><text x="568" y="518" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Not related</text><rect x="398" y="502" width="80" height="26" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="438" y="519" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Other words</text><rect x="348" y="502" width="44" height="26" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="370" y="519" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Link</text><circle cx="34" cy="96" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="101" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="34" cy="316" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="321" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="34" cy="450" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="455" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="650" cy="120" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="650" y="125" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="670" y="125" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The note as it will be: title, properties, body.</text><circle cx="650" cy="160" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="650" y="165" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="670" y="165" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">What the build will change, as a list of words.</text><circle cx="650" cy="200" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="650" y="205" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="670" y="205" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Suggestions are proposals: Link, Other words, Not related.</text><text x="670" y="145" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">It updates as you answer — nothing is written yet.</text><text x="670" y="185" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A conflict between two templates is named, not hidden.</text><text x="670" y="225" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Your verdict is recorded when the note is created.</text><text x="640" y="300" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">Editing an existing note instead?</text><text x="640" y="324" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">The same card shows the change against the note you are in,</text><text x="640" y="344" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">and the insertion is confirmed before it happens.</text>
</svg>
