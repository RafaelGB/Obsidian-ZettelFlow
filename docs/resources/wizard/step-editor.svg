<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="The step editor: a quiet header, what the step asks first, action cards with human names">
<rect width="1200" height="880" fill="#1e1e1e"/><rect x="40" y="30" width="820" height="824" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="64" y="70" fill="#dcddde" font-family="sans-serif" font-size="21" font-weight="650" text-anchor="start">Classify the note</text><rect x="608" y="50" width="160" height="30" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="622" y="70" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">◎</text><text x="642" y="70" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Show on the canvas</text><circle cx="788" cy="65" r="1.8" fill="#8b8e94" stroke="none" stroke-width="2"/><circle cx="795" cy="65" r="1.8" fill="#8b8e94" stroke="none" stroke-width="2"/><circle cx="802" cy="65" r="1.8" fill="#8b8e94" stroke="none" stroke-width="2"/><text x="836" y="70" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><rect x="64" y="92" width="80.48" height="22" rx="11.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="74" y="107.32" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Step note</text><rect x="150.48000000000002" y="92" width="85.76" height="22" rx="11.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><circle cx="163.48000000000002" cy="103.0" r="4" fill="#ec7500" stroke="none" stroke-width="2"/><text x="172.48000000000002" y="107.32" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Classify</text><rect x="242.24" y="92" width="120.80000000000001" height="22" rx="11.0" fill="#7f6df2" stroke="#7f6df2" stroke-width="1.5"/><text x="252.24" y="107.32" fill="#fff" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Starts the flow</text><rect x="369.04" y="92" width="161.12" height="22" rx="11.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="379.04" y="107.32" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Creates a linked note</text><text x="64" y="138" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">asks 2 things · applies a template · creates a linked note · writes to Zettel</text><line x1="40" y1="154" x2="860" y2="154" stroke="#3a3a3a" stroke-width="1"/><rect x="64" y="170" width="772" height="420" rx="8" fill="none" stroke="#3a3a3a" stroke-width="1.5"/><rect x="64" y="170" width="772" height="40" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="80" y="195" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">What does this step ask?</text><text x="796" y="195" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="end">2 actions</text><polyline points="811,187 816,193 821,187" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="78" y="224" width="744" height="236" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="94" y="251" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">⋮⋮</text><rect x="114" y="234" width="28" height="28" rx="6" fill="#2f2b45" stroke="none" stroke-width="0"/><text x="128.0" y="253.0" fill="#a99cf7" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">T</text><text x="154" y="246" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Ask for text</text><text x="154" y="264" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The summary, in your words</text><text x="740" y="255" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">▤</text><polyline points="769,247 774,253 779,247" fill="none" stroke="#8b8e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="255" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">✕</text><line x1="78" y1="278" x2="822" y2="278" stroke="#3a3a3a" stroke-width="1"/><text x="98" y="300" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A text field. The answer is written to the note.</text><text x="776" y="300" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">⧉   ⊕</text><text x="98" y="330" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Where it writes</text><text x="98" y="348" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Properties, the body, or the context only.</text><rect x="626" y="318" width="180" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="636" y="339.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Body</text><polyline points="783,332 788,337 793,332" fill="none" stroke="#8b8e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="376" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Property key</text><text x="98" y="394" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">The property the answer is saved under.</text><rect x="626" y="364" width="180" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="636" y="385.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">summary</text><text x="98" y="422" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Always the same answer</text><text x="98" y="440" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Skip the question and write a fixed value.</text><rect x="766" y="416" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="777" cy="427" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><rect x="78" y="472" width="744" height="56" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="94" y="505" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">⋮⋮</text><rect x="114" y="486" width="28" height="28" rx="6" fill="#2f2b45" stroke="none" stroke-width="0"/><text x="128.0" y="505.0" fill="#a99cf7" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">≡</text><text x="154" y="498" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Choose an option</text><text x="154" y="516" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The kind of note</text><polyline points="771,495 777,500 771,505" fill="none" stroke="#8b8e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="505" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">✕</text><rect x="78" y="542" width="150" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="96" y="563" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">+  Add an action</text><rect x="64" y="602" width="772" height="40" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="80" y="627" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">What does it write?</text><polyline points="813,617 819,622 813,627" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="652" width="772" height="40" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="80" y="677" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">When does it appear?</text><text x="796" y="677" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="end">starts the flow</text><polyline points="813,667 819,672 813,677" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="702" width="772" height="40" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="80" y="727" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Where does it go?</text><text x="796" y="727" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="end">Zettel/</text><polyline points="813,717 819,722 813,727" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="752" width="772" height="40" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="80" y="777" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">How is it shown?</text><polyline points="813,767 819,772 813,777" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="802" width="772" height="40" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="80" y="827" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Where does it go next?</text><polyline points="813,817 819,822 813,827" fill="none" stroke="#5c5f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="65" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="560" y="70" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="294" cy="190" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="294" y="195" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="314" cy="246" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="314" y="251" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="244" cy="558" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="244" y="563" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="910" cy="130" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="910" y="135" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="930" y="135" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">A quiet header</text><text x="930" y="157" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The step's name, Show on the</text><text x="930" y="176" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">canvas, and ⋯ for copy · apply a</text><text x="930" y="195" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">template · save as a template.</text><circle cx="910" cy="250" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="910" y="255" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="930" y="255" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">What it asks comes first</text><text x="930" y="277" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The questions in order, each</text><text x="930" y="296" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">with a fact on its closed</text><text x="930" y="315" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">heading: 2 actions, Zettel/…</text><circle cx="910" cy="370" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="910" y="375" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="930" y="375" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Action cards</text><text x="930" y="397" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A human name and icon, the</text><text x="930" y="416" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">description edited in place, and</text><text x="930" y="435" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">the form inside with one heading.</text><circle cx="910" cy="490" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="910" y="495" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="930" y="495" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Add an action</text><text x="930" y="517" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">One labelled button; the panel</text><text x="930" y="536" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">opens in place, with suggestions</text><text x="930" y="555" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">for this step first.</text>
</svg>
