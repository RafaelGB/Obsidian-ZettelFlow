family="sans-serif" font-size="22" font-weight="650" text-anchor="start">Where should this note be linked from?</text><line x1="24" y1="508" x2="784" y2="508" stroke="#3a3a3a" stroke-width="1"/><rect x="42" y="520" width="74" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="79" y="541" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">‹ Back</text><rect x="686.8" y="520" width="79.19999999999999" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="726.4" y="541.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Confirm</text><text x="674.8" y="541" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Press Enter to confirm.</text><rect x="342.5" y="520" width="178" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="431.5" y="541" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Build with what I have</text><text x="330.5" y="541" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Ctrl+Z back</text><g transform="translate(0,24)"><text x="44" y="204" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Note</text><rect x="44" y="214" width="340" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="54" y="235.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Projects/Debt essay.md</text><text x="44" y="270" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Heading (optional)</text><rect x="44" y="280" width="340" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="54" y="301.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">## Sources</text><polyline points="361,294 366,299 371,294" fill="none" stroke="#8b8e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="404" y="204" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">How the link reads</text><rect x="404" y="214" width="360" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="414" y="235.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">- {{wikilink}}</text><text x="404" y="270" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Preview</text><rect x="404" y="280" width="360" height="80" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="418" y="310" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">## Sources</text><text x="418" y="336" fill="#a99cf7" font-family="monospace" font-size="13.5" font-weight="600" text-anchor="start">- [[Notes owe nothing]]</text><circle cx="34" cy="230" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="235" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="394" cy="230" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="394" y="235" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="1166" cy="70" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="1166" y="75" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Search the note to link from, then — if you want — the heading to put the link under.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The words around {{wikilink}}; the preview shows exactly what will be inserted.</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The link is written into that note when this one is created — the other note changes, not this one.</text></g>
