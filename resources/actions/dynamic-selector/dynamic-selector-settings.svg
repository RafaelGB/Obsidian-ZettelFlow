<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Configuring the Dynamic selector: a script that returns the options, and a debug run">
<rect width="1200" height="700" fill="#1e1e1e"/><rect x="24" y="24" width="1152" height="540" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="48" y="60" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Step editor</text><text x="48" y="92" fill="#dcddde" font-family="sans-serif" font-size="19" font-weight="650" text-anchor="start">Choose from a script</text><text x="48" y="116" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Options generated by your script each time the step runs.</text><line x1="24" y1="132" x2="1176" y2="132" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="162" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Where it writes</text><text x="48" y="182" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Properties, the body, or the context only.</text><rect x="932" y="154" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="942" y="175.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Properties</text><polyline points="1129,168 1134,173 1139,168" fill="none" stroke="#8b8e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="48" y1="198" x2="1152" y2="198" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="226" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Property key</text><text x="48" y="246" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The property the answer is saved under.</text><rect x="932" y="218" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="942" y="239.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">folder</text><line x1="48" y1="262" x2="1152" y2="262" stroke="#3a3a3a" stroke-width="1"/><rect x="48" y="272" width="700" height="190" rx="8" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="62" y="302" fill="#5c5f66" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">1</text><text x="90" y="302" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">const folders = app.vault.getAllFolders();</text><text x="62" y="328" fill="#5c5f66" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">2</text><text x="90" y="328" fill="#5c5f66" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">// keep the project folders only</text><text x="62" y="354" fill="#5c5f66" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">3</text><text x="90" y="354" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">return folders</text><text x="62" y="380" fill="#5c5f66" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">4</text><text x="90" y="380" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">  .filter((f) =&gt; f.path.startsWith("Projects"))</text><text x="62" y="406" fill="#5c5f66" font-family="monospace" font-size="13" font-weight="400" text-anchor="start">5</text><text x="90" y="406" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">  .map((f) =&gt; [f.path, f.name]);</text><text x="62" y="444" fill="#7f6df2" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Examples ▾</text><text x="780" y="290" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Debug script</text><text x="780" y="310" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Run the script with mock data</text><text x="780" y="328" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">and view the result.</text><rect x="780" y="342" width="70" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="815.0" y="363.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Run</text><rect x="862" y="342" width="120" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="922.0" y="363.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">Clear output</text><rect x="780" y="386" width="372" height="76" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="794" y="408" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Output:</text><text x="794" y="430" fill="#a99cf7" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">[["Projects/Essay","Essay"],</text><text x="794" y="450" fill="#a99cf7" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start"> ["Projects/Talk","Talk"]]</text><circle cx="34" cy="292" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="297" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="770" cy="356" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="770" y="361" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="770" cy="404" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="770" y="409" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The script gets zf and app and returns [key, label] pairs; completions and examples help.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Run executes it with exactly the bindings of the real run.</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The output shows the pairs — or the error, before the wizard ever does.</text>
</svg>
