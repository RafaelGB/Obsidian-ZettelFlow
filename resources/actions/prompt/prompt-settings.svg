<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Configuring the Prompt action in the step builder">
<rect width="1200" height="700" fill="#1e1e1e"/><rect x="24" y="24" width="1152" height="540" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="48" y="60" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Step editor</text><text x="48" y="92" fill="#dcddde" font-family="sans-serif" font-size="19" font-weight="650" text-anchor="start">Ask for text</text><text x="48" y="116" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">A text box in the wizard; its answer becomes a property.</text><line x1="24" y1="132" x2="1176" y2="132" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="162" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Where it writes</text><text x="48" y="182" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Properties, the body, or the context only.</text><rect x="932" y="154" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="942" y="175.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Properties</text><polyline points="1129,168 1134,173 1139,168" fill="none" stroke="#8b8e94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="48" y1="198" x2="1152" y2="198" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="226" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Property key</text><text x="48" y="246" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The property the answer is saved under.</text><rect x="932" y="218" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="942" y="239.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">idea</text><line x1="48" y1="262" x2="1152" y2="262" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="290" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Label</text><text x="48" y="310" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The question the wizard asks.</text><rect x="832" y="282" width="320" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="842" y="303.0" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">What is the idea, in one sentence?</text><line x1="48" y1="326" x2="1152" y2="326" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="354" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Placeholder</text><text x="48" y="374" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Shown inside the empty field.</text><rect x="832" y="346" width="320" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="842" y="367.0" fill="#5c5f66" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">One sentence you could argue with</text><line x1="48" y1="390" x2="1152" y2="390" stroke="#3a3a3a" stroke-width="1"/><text x="48" y="418" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="600" text-anchor="start">Always the same answer</text><text x="48" y="438" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Skip the question and write a fixed value.</text><rect x="1112" y="416" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="1123" cy="427" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><line x1="48" y1="454" x2="1152" y2="454" stroke="#3a3a3a" stroke-width="1"/><circle cx="34" cy="162" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="167" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="34" cy="290" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="295" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="34" cy="418" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="423" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Where the answer goes, and under which key.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">What the wizard asks, and the hint shown inside the empty box.</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Static: skip the question and always write the value you set here.</text>
</svg>
