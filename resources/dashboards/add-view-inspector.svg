<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Adding the Dashboard view to a Base, and the field inspector it shows before any panel">
<rect width="1200" height="760" fill="#1e1e1e"/><text x="24" y="34" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">Any Base › ＋ Add view › Dashboard</text><rect x="24" y="48" width="380" height="560" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="44" y="82" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">▤ Diary</text><rect x="44" y="98" width="340" height="150" rx="8" fill="#2b2b2b" stroke="#3a3a3a" stroke-width="1.5"/><text x="62" y="122" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">▦ Table</text><text x="366" y="122" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">✓</text><text x="62" y="152" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">▤ Cards</text><text x="62" y="182" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">☰ List</text><line x1="56" y1="200" x2="372" y2="200" stroke="#3a3a3a" stroke-width="1"/><text x="62" y="222" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">＋ Add view</text><text x="366" y="222" fill="#8b8e94" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="end">›</text><rect x="196" y="230" width="196" height="200" rx="8" fill="#2b2b2b" stroke="#3a3a3a" stroke-width="1.5"/><text x="214" y="256" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">▦ Table</text><text x="214" y="286" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">▤ Cards</text><text x="214" y="316" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">☰ List</text><text x="214" y="346" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">⌖ Map</text><rect x="204" y="356" width="180" height="30" rx="5" fill="#7f6df2"/><text x="214" y="377" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">◫ Dashboard</text><text x="56" y="470" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Choose Dashboard — ZettelFlow</text><text x="56" y="490" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">registers it as one of the Base's</text><text x="56" y="510" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">own view types.</text><circle cx="204" cy="371" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="204" y="375.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="428" y="34" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">The new view, before any panel: what this Base holds</text><rect x="428" y="48" width="748" height="560" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="444" y="74" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">▤ Diary</text><rect x="509" y="57" width="109.2" height="26" rx="6" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="522" y="74.5" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Dashboard ▾</text><text x="1107" y="74" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">＋ New</text><text x="1019" y="74" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Properties</text><text x="959" y="74" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Filter</text><text x="913" y="74" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Sort</text><line x1="428" y1="92" x2="1176" y2="92" stroke="#3a3a3a" stroke-width="2"/><text x="448" y="126" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">42 notes</text><rect x="1048.8" y="106" width="107.2" height="30" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="1.5"/><text x="1102.4" y="125.9" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">＋ Add panel</text><rect x="886.3" y="106" width="152.5" height="30" rx="6" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="962.6" y="125.9" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Σ Computed fields</text><text x="802" y="196" fill="#dcddde" font-family="sans-serif" font-size="20" font-weight="650" text-anchor="middle">No panels yet</text><text x="802" y="222" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="middle">Add a panel to start charting. For now, here is what this Base contains.</text><circle cx="700" cy="190" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="700" y="194.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="500" y="266" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Fields</text><line x1="500" y1="276" x2="1104" y2="276" stroke="#3a3a3a" stroke-width="2"/><text x="500" y="302" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">date</text><rect x="940" y="285" width="46.9" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="950" y="301.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">date</text><line x1="500" y1="314" x2="1104" y2="314" stroke="#2e2e2e" stroke-width="1"/><text x="500" y="338" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">realWorkingHours</text><rect x="940" y="321" width="60.3" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="950" y="337.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">number</text><line x1="500" y1="350" x2="1104" y2="350" stroke="#2e2e2e" stroke-width="1"/><text x="500" y="374" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">mood</text><rect x="940" y="357" width="60.3" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="950" y="373.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">number</text><line x1="500" y1="386" x2="1104" y2="386" stroke="#2e2e2e" stroke-width="1"/><text x="500" y="410" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">focus</text><rect x="940" y="393" width="73.8" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="950" y="409.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">category</text><line x1="500" y1="422" x2="1104" y2="422" stroke="#2e2e2e" stroke-width="1"/><text x="500" y="446" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">project</text><rect x="940" y="429" width="46.9" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="950" y="445.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">link</text><line x1="500" y1="458" x2="1104" y2="458" stroke="#2e2e2e" stroke-width="1"/><text x="500" y="482" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">reviewed</text><rect x="940" y="465" width="67" height="24" rx="12.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="950" y="481.3" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">boolean</text><line x1="500" y1="494" x2="1104" y2="494" stroke="#2e2e2e" stroke-width="1"/><circle cx="918" cy="297" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="918" y="301.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="1104" y="530" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="end">42 rows</text><circle cx="1030" cy="525" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="1030" y="529.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="44" cy="640" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="644.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="64" y="645" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Open any .base, click ＋ Add view and pick Dashboard.</text><circle cx="44" cy="666" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="670.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="64" y="671" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">With no panels yet, the view shows a field inspector instead of an empty page.</text><circle cx="44" cy="692" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="696.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="64" y="697" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Every property the Base exposes, with the type ZettelFlow read from Obsidian's typed values.</text><circle cx="44" cy="718" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="722.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="64" y="723" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The live row count follows the Base's filters as you edit them.</text>
</svg>
