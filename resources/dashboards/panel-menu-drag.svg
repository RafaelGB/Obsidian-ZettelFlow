fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="706.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="64" y="707" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Width is 1, 2 or 3 columns, plus Tall; Edit, Duplicate, Move and Remove sit in the same menu.</text><circle cx="44" cy="728" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="732.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="64" y="733" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Drag a panel by its header to reorder the grid; dragging inside a chart still brushes the chart.</text><circle cx="44" cy="754" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="758.6" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="64" y="759" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">It lands before or after the panel you release over. On touch, use Move left / right.</text>
</svg>
