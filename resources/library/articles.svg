<text x="600" y="560" fill="#5f6168" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="middle" font-style="italic">An article is a note in your articles folder whose source is a web address, as Web Clipper saves it.</text>
<text x="600" y="582" fill="#5f6168" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="middle" font-style="italic">ZettelFlow never fetches the page; reading it writes nothing but a status you choose.</text>
