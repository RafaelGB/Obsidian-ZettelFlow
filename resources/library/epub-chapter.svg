<text x="430" y="192" fill="#dcddde" font-family="Georgia, serif" font-size="30" font-weight="700" text-anchor="start" >The Lazy Controller</text>
<text x="430" y="236" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >I spend a few months each year in Berkeley, and one of my great</text>
<text x="430" y="264" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >pleasures there is a daily four-mile walk on a marked path in the hills.</text>
<rect x="428" y="287" width="489" height="25" rx="3" fill="#e0a351" stroke="none" stroke-width="1.5" fill-opacity="0.32"/>
<text x="430" y="306" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >A general “law of least effort” applies to cognitive as well as</text>
<rect x="428" y="315" width="143" height="25" rx="3" fill="#e0a351" stroke="none" stroke-width="1.5" fill-opacity="0.32"/>
<text x="430" y="334" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >physical exertion.</text>
<text x="581" y="334" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >The law asserts that if there are</text>
<text x="430" y="362" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >several ways of achieving the same goal, people will gravitate to the</text>
<text x="430" y="390" fill="#dcddde" font-family="Georgia, serif" font-size="16.5" font-weight="400" text-anchor="start" >least demanding course of action.</text>
