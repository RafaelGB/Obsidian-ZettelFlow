<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-label="The Reader: highlighted passages in a chapter, the popover over a selection, a note in the margin, and the thought it made in Think with the passage quoted">
<rect width="1200" height="920" fill="#141416"/>
<rect x="40" y="30" width="1120" height="740" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5" />
<circle cx="62" cy="50" r="5.5" fill="#fb464c" stroke="none" stroke-width="0"/>
<circle cx="80" cy="50" r="5.5" fill="#e9973f" stroke="none" stroke-width="0"/>
<circle cx="98" cy="50" r="5.5" fill="#44cf6e" stroke="none" stroke-width="0"/>
<text x="600" y="55" fill="#5f6168" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">My vault — Obsidian</text>
<line x1="40" y1="70" x2="1160" y2="70" stroke="#3a3a3a" stroke-width="1"/>
<text x="90" y="100" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="start">EVENT SOURCING  ·  ARGUMENT</text>
<text x="1130" y="102" fill="#5f6168" font-family="sans-serif" font-size="20" font-weight="400" text-anchor="middle">×</text>
<text x="120" y="168" fill="#dcddde" font-family="Georgia, serif" font-size="34" font-weight="700" text-anchor="start">Event sourcing</text>
<text x="120" y="210" fill="#5f6168" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="start">EVENTS</text>
<rect x="245.0" y="230" width="212.0" height="22" rx="3" fill="#e0a351" stroke="none" stroke-width="1.5" fill-opacity="0.32"/>
<line x1="246.0" y1="251" x2="456.0" y2="251" stroke="#7f6df2" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="120" y="246" fill="#dcddde" font-family="Georgia, serif" font-size="17" textLength="394.8" lengthAdjust="spacing" xml:space="preserve"><tspan>Event sourcing </tspan><tspan>stores changes, not state</tspan><tspan>. Every</tspan></text>
<text x="120" y="273" fill="#dcddde" font-family="Georgia, serif" font-size="17" textLength="487.2" lengthAdjust="spacing" xml:space="preserve"><tspan>decision becomes a fact that cannot be taken back, and the</tspan></text>
<text x="120" y="300" fill="#dcddde" font-family="Georgia, serif" font-size="17" textLength="403.2" lengthAdjust="spacing" xml:space="preserve"><tspan>current picture is whatever the facts add up to.</tspan></text>
<rect x="216" y="334" width="330" height="44" rx="10" fill="#202024" stroke="#3a3a3a" stroke-width="1.5" />
<rect x="224" y="341" width="92" height="30" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="1" />
<text x="270.0" y="361" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Highlight</text>
<rect x="324" y="341" width="150" height="30" rx="6" fill="#2b2b30" stroke="#3a3a3a" stroke-width="1" />
<text x="399.0" y="361" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Highlight and note</text>
<rect x="482" y="341" width="64" height="30" rx="6" fill="#2b2b30" stroke="#3a3a3a" stroke-width="1" />
<text x="514.0" y="361" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Copy</text>
<path d="M 375 378 l 8 9 l 8 -9 z" fill="#202024" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="372" y="375" width="22" height="4" fill="#202024"/>
<rect x="177.8" y="392" width="312.8" height="22" rx="2" fill="#4a9dff" stroke="none" stroke-width="1.5" fill-opacity="0.35"/>
<text x="120" y="408" fill="#dcddde" font-family="Georgia, serif" font-size="17" textLength="428.4" lengthAdjust="spacing" xml:space="preserve"><tspan>Replay </tspan><tspan>rebuilds any past moment from the log</tspan><tspan>, which</tspan></text>
<text x="120" y="435" fill="#dcddde" font-family="Georgia, serif" font-size="17" textLength="310.8" lengthAdjust="spacing" xml:space="preserve"><tspan>is why an audit trail comes for free.</tspan></text>
<text x="120" y="486" fill="#5f6168" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="start">PROJECTIONS</text>
<rect x="371.0" y="506" width="195.2" height="22" rx="3" fill="#e0a351" stroke="none" stroke-width="1.5" fill-opacity="0.32"/>
<text x="120" y="522" fill="#dcddde" font-family="Georgia, serif" font-size="17" textLength="487.2" lengthAdjust="spacing" xml:space="preserve"><tspan>A read model is a projection: </tspan><tspan>disposable, and rebuilt</tspan><tspan> when</tspan></text>
<text x="120" y="549" fill="#dcddde" font-family="Georgia, serif" font-size="17" textLength="470.4" lengthAdjust="spacing" xml:space="preserve"><tspan>the question changes. Nothing about the log has to move.</tspan></text>
<text x="120" y="600" fill="#5f6168" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start" font-style="italic">The note is never written: each highlight is found again by its words.</text>
<text x="800" y="150" fill="#5f6168" font-family="sans-serif" font-size="11.5" font-weight="700" text-anchor="start">YOUR HIGHLIGHTS</text>
<rect x="800" y="164" width="330" height="70" rx="6" fill="#202024" stroke="#3a3a3a" stroke-width="1.5" />
<rect x="800" y="164" width="3" height="70" rx="1.5" fill="#e0a351"/>
<text x="816" y="190" fill="#8b8e94" font-family="Georgia, serif" font-size="13.5" font-weight="400" text-anchor="start" font-style="italic">stores changes, not state</text>
<text x="816" y="214" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">the log is the truth, state is a view</text>
<rect x="800" y="244" width="330" height="46" rx="6" fill="#202024" stroke="#3a3a3a" stroke-width="1.5" />
<rect x="800" y="244" width="3" height="46" rx="1.5" fill="#e0a351"/>
<text x="816" y="270" fill="#8b8e94" font-family="Georgia, serif" font-size="13.5" font-weight="400" text-anchor="start" font-style="italic">disposable, and rebuilt</text>
<line x1="965" y1="290" x2="965" y2="330" stroke="#a882ff" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M 959 324 l 6 8 l 6 -8" fill="none" stroke="#a882ff" stroke-width="1.5"/>
<rect x="790" y="336" width="350" height="262" rx="14" fill="none" stroke="#a882ff" stroke-width="1" stroke-dasharray="3 4"/>
<text x="804" y="356" fill="#a882ff" font-family="sans-serif" font-size="11.5" font-weight="700" text-anchor="start">IN THINK</text>
<rect x="800" y="368" width="330" height="220" rx="10" fill="#202024" stroke="#3a3a3a" stroke-width="1.5" />
<rect x="818" y="386" width="3" height="44" rx="1.5" fill="#e0a351"/>
<text x="832" y="404" fill="#8b8e94" font-family="Georgia, serif" font-size="14.5" font-weight="400" text-anchor="start" font-style="italic">stores changes, not state</text>
<text x="832" y="424" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Highlighted in Event sourcing › Events</text>
<text x="818" y="464" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="400" text-anchor="start">the log is the truth, state is a view</text>
<line x1="818" y1="488" x2="1112" y2="488" stroke="#3a3a3a" stroke-width="1"/>
<text x="818" y="514" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">about  Event sourcing</text>
<text x="1112" y="514" fill="#7f6df2" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="end">Open in the Reader</text>
<text x="818" y="540" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Fork · Challenge · Connect</text>
<rect x="270" y="650" width="330" height="40" rx="10" fill="#202024" stroke="#3a3a3a" stroke-width="1.5" />
<text x="288" y="675" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Highlighted. Kept in Think.</text>
