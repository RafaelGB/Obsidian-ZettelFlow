<text x="98" y="245.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
<circle cx="202" cy="356" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="202" y="360.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<circle cx="782" cy="146" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="782" y="150.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<circle cx="778" cy="352" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="778" y="356.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<circle cx="252" cy="670" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="252" y="674.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">5</text>
<circle cx="76" cy="806" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="810.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
<text x="96" y="811" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">A highlight with a note: drawn over the words, with a dotted underline. The note itself is untouched.</text>
<circle cx="76" cy="828" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="832.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<text x="96" y="833" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Select words: Highlight, Highlight and note, or Copy (H and Shift+H from the keyboard).</text>
<circle cx="76" cy="850" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="854.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<text x="96" y="855" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">In the margin on a wide pane (under Around this chapter on a narrow one): click one to go to it.</text>
<circle cx="76" cy="872" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="876.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<text x="96" y="877" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Each highlight is a thought in Think, about the note, with the passage quoted above what you wrote.</text>
<circle cx="76" cy="894" r="11" fill="#e0a351" stroke="none" stroke-width="0"/>
<text x="76" y="898.5" fill="#1e1e1e" font-family="sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">5</text>
<text x="96" y="899" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Every keep, edit and delete is recorded, with Undo right there.</text>
</svg>
