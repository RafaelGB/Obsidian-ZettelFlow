<text x="549.0" y="675" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle">Undo</text>
<text x="120" y="738" fill="#5f6168" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Chapter 1 / 4</text>
