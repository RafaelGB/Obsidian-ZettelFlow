<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Pencil hover, still to prove on a device: on the left an iPad's page with a Pencil held just above it, a dashed line from its tip to the page with a question mark — does the web view hear it? — and a dashed ghost of the nib shadow that would follow if it does; on the right the developer probe that will answer: five seconds of pen events without contact, decided by at least 30 events a second, no gap over 100 ms, the position moving and the events stopping on leaving range, writing nothing and sending nothing; along the bottom the feasibility row, a half circle, to prove on a device">
<rect width="1200" height="640" fill="#141416"/>
<rect x="40" y="30" width="1120" height="580" rx="12" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="62" cy="50" r="5.5" fill="#fb464c"/>
<circle cx="80" cy="50" r="5.5" fill="#e9973f"/>
<circle cx="98" cy="50" r="5.5" fill="#44cf6e"/>
<text x="600" y="55" fill="#5f6168" font-family="sans-serif" font-size="12.5" text-anchor="middle">My vault — Obsidian on an iPad</text>
<line x1="40" y1="70" x2="1160" y2="70" stroke="#3a3a3a" stroke-width="1"/>
<text x="90" y="100" fill="#5f6168" font-family="sans-serif" font-size="12" font-weight="600">DUBLINERS  ·  JAMES JOYCE  ·  PENCIL HOVER — STILL TO PROVE</text>

<line x1="640" y1="120" x2="640" y2="500" stroke="#2a2a2e" stroke-width="1"/>
<g font-family="sans-serif" font-size="12" font-weight="600" fill="#5f6168">
<text x="90" y="135">1 · THE PENCIL ABOVE THE GLASS</text>
<text x="680" y="135">2 · THE PROBE THAT WILL ANSWER</text>
</g>

<!-- 1: the page, the palette open, a Pencil hovering -->
<g font-family="Georgia, serif" font-size="15" fill="#dcddde">
<text x="90" y="190">The light was gone from the sky and the</text>
<text x="90" y="218">street was quiet. He walked on along the</text>
<text x="90" y="246">river, thinking of what she had said and</text>
<text x="90" y="274">of the house he would not go back to.</text>
<text x="90" y="302">Somewhere a bell rang twice and stopped.</text>
</g>
<!-- the palette, docked in the margin, the pen current -->
<rect x="540" y="160" width="44" height="168" rx="22" fill="#202024" stroke="#3a3a3a" stroke-width="1.2"/>
<circle cx="562" cy="186" r="13" fill="#2c2840" stroke="#a68af9" stroke-width="1.2"/>
<path d="M556 192 L566 180 L569 183 L559 195 Z" fill="#a68af9"/>
<rect x="554" y="214" width="16" height="10" rx="2" fill="#5f6168"/>
<path d="M554 252 C560 244 566 260 572 250" fill="none" stroke="#5f6168" stroke-width="1.6" stroke-dasharray="3 3"/>
<rect x="554" y="282" width="16" height="10" rx="3" fill="none" stroke="#5f6168" stroke-width="1.6"/>
<circle cx="562" cy="312" r="5" fill="#dcddde"/>

<!-- the Pencil, held at an angle, its tip above the page -->
<g transform="translate(439 263) rotate(-60)">
<rect x="0" y="-9" width="210" height="18" rx="4" fill="#e6e6e8" stroke="#8a8c94" stroke-width="1"/>
<rect x="196" y="-9" width="14" height="18" rx="4" fill="#cfd0d4"/>
<path d="M0 -9 L-30 -2 L-34 0 L-30 2 L0 9 Z" fill="#cfd0d4" stroke="#8a8c94" stroke-width="1"/>
<path d="M-30 -2 L-38 0 L-30 2 Z" fill="#5f6168"/>
</g>
<!-- the gap: a dashed line from the tip to the page, and the question -->
<path d="M420 300 L418 326" stroke="#a68af9" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<circle cx="418" cy="331" r="7" fill="none" stroke="#a68af9" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="432" y="336" fill="#a68af9" font-family="sans-serif" font-size="13" font-weight="600">?</text>
<text x="90" y="370" fill="#8a8c94" font-family="sans-serif" font-size="12.5">An M2+ iPad senses a Pencil 2 or Pro a centimetre above the glass.</text>
<text x="90" y="390" fill="#8a8c94" font-family="sans-serif" font-size="12.5">Does Obsidian's web view pass it on, as pen events with no button?</text>
<text x="90" y="410" fill="#8a8c94" font-family="sans-serif" font-size="12.5">If it does, the dashed dot becomes the nib's shadow: the pen's colour</text>
<text x="90" y="430" fill="#8a8c94" font-family="sans-serif" font-size="12.5">and width, a ring for the eraser — gone the instant it touches.</text>
<text x="90" y="460" fill="#dcddde" font-family="sans-serif" font-size="12.5">Until it is proven, nothing is shown, and writing is as before.</text>

<!-- 2: the probe, in Settings › Advanced, developer only -->
<rect x="680" y="160" width="440" height="300" rx="8" fill="#1d1d21" stroke="#2f2f36" stroke-width="1"/>
<text x="700" y="186" fill="#5f6168" font-family="sans-serif" font-size="11.5" font-weight="600">PENCIL HOVER PROBE · DEVELOPER ONLY · FIVE SECONDS</text>
<text x="700" y="214" fill="#dcddde" font-family="sans-serif" font-size="13">counts pen events without contact, then decides:</text>
<g font-family="sans-serif" font-size="12.5" fill="#dcddde">
<rect x="700" y="232" width="400" height="30" rx="5" fill="#202024"/>
<text x="714" y="252">at least 30 events a second</text>
<text x="1086" y="252" fill="#8a8c94" text-anchor="end">rate</text>
<rect x="700" y="268" width="400" height="30" rx="5" fill="#202024"/>
<text x="714" y="288">no silence longer than 100 ms</text>
<text x="1086" y="288" fill="#8a8c94" text-anchor="end">gap</text>
<rect x="700" y="304" width="400" height="30" rx="5" fill="#202024"/>
<text x="714" y="324">the position moves with the nib</text>
<text x="1086" y="324" fill="#8a8c94" text-anchor="end">moved</text>
<rect x="700" y="340" width="400" height="30" rx="5" fill="#202024"/>
<text x="714" y="360">the events stop when it leaves range</text>
<text x="1086" y="360" fill="#8a8c94" text-anchor="end">left</text>
</g>
<text x="700" y="398" fill="#8a8c94" font-family="sans-serif" font-size="12">a shadow that lags the nib is worse than none</text>
<line x1="700" y1="414" x2="1100" y2="414" stroke="#2f2f36" stroke-width="1"/>
<text x="700" y="440" fill="#44cf6e" font-family="sans-serif" font-size="12.5">written: nothing  ·  sent: nothing  ·  off at every start</text>

<!-- the feasibility row -->
<rect x="90" y="520" width="1030" height="56" rx="8" fill="#1d1d21" stroke="#2f2f36" stroke-width="1"/>
<text x="110" y="553" fill="#dcddde" font-family="sans-serif" font-size="13">A nib shadow under the hovering Pencil (M2+ iPad, Pencil 2 or Pro)</text>
<path d="M640 539 A9 9 0 0 0 640 557 Z" fill="#e9973f"/>
<circle cx="640" cy="548" r="9" fill="none" stroke="#e9973f" stroke-width="1.4"/>
<text x="660" y="553" fill="#e9973f" font-family="sans-serif" font-size="13" font-weight="600">to prove on a device</text>
<text x="1100" y="553" fill="#8a8c94" font-family="sans-serif" font-size="12" text-anchor="end">then ✓ with the rate, or ✗ with what arrived</text>
</svg>
