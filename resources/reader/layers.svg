<text x="410" y="186" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle" letter-spacing="2.2">05. TRAMPAS… Y OPORTUNIDADES</text>
<text x="250" y="236" fill="#c8c9cc" font-family="serif" font-size="15">Los sistemas generan problemas que se</text>
<rect x="340.4" y="250" width="175.6" height="19" rx="3" fill="#e0a351" opacity="0.32"/>
<text x="250" y="263" fill="#c8c9cc" font-family="serif" font-size="15">repiten una y otra vez. Estas estructuras</text>
<text x="250" y="290" fill="#c8c9cc" font-family="serif" font-size="15">de problemas recurrentes son lo que</text>
<text x="250" y="317" fill="#c8c9cc" font-family="serif" font-size="15">llamamos arquetipos de sistemas.</text>
<text x="250" y="344" fill="#c8c9cc" font-family="serif" font-size="15"></text>
<rect x="248.0" y="358" width="136.0" height="19" rx="3" fill="#5b8def" opacity="0.22"/>
<text x="250" y="371" fill="#c8c9cc" font-family="serif" font-size="15">Resistirse a la política: cuando varios</text>
<text x="250" y="398" fill="#c8c9cc" font-family="serif" font-size="15">actores tiran hacia objetivos distintos,</text>
<text x="250" y="425" fill="#c8c9cc" font-family="serif" font-size="15">el sistema queda donde nadie quería.</text>
<text x="250" y="452" fill="#c8c9cc" font-family="serif" font-size="15"></text>
<text x="250" y="479" fill="#c8c9cc" font-family="serif" font-size="15">La tragedia de los comunes aparece cuando</text>
<text x="250" y="506" fill="#c8c9cc" font-family="serif" font-size="15">un recurso compartido se agota porque</text>
<text x="250" y="533" fill="#c8c9cc" font-family="serif" font-size="15">cada uno gana al usarlo un poco más.</text>
<rect x="382.0" y="356" width="4" height="22" rx="2" fill="#5b8def" opacity="0.8"/>
<text x="250" y="348" fill="#a99cf5" font-family="sans-serif" font-size="11">the second sweeps in under still words ↓</text>
<rect x="248" y="491" width="270" height="22" rx="3" fill="none" stroke="#5f6168" stroke-width="1" stroke-dasharray="3 4"/>
<text x="250" y="564" fill="#a99cf5" font-family="sans-serif" font-size="11">the third, still away ↑</text>
