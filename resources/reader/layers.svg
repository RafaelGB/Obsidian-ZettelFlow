<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Layers, and read it clean. A chapter mid-reveal: your marks come back one after another in the order you made them — the first already in its ink, the second sweeping in under still words, the third still away. Layers is open in the one drawer beside the column: Reading, Reflection and Research, each with what it is for and a switch, Reflection dimmed because nothing of it is in this chapter; New marks go to, with Reflection chosen; and Hide my annotations. While the drawer is open the margin's list steps back. On the bar, centred under the column, the Layers button pressed with Reflection beside it. Above the text, the pill Reading clean · Reveal my thinking. No number anywhere.">
