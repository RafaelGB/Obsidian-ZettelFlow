<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Pages or scroll, one page or a spread. Scroll: one long column with a scrollbar. Page: the chapter laid out as pages the size of the screen, whole lines only, the next page waiting just off screen and Space or an arrow sliding it in. Spread: two pages side by side like an open book, a turn moving two pages. Below, an iPad in landscape shows a spread, and in portrait one page, with Spread still chosen.">
<rect width="1200" height="820" fill="#141416"/>
<text x="600" y="44" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">PAGES OR SCROLL, ONE PAGE OR A SPREAD</text>

<!-- the Layout row, as the Type panel draws it -->
<rect x="440" y="66" width="320" height="44" rx="10" fill="#1e1e22" stroke="#3a3a3a"/>
<text x="458" y="93" fill="#5f6168" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">LAYOUT</text>
<rect x="524" y="76" width="66" height="24" rx="12" fill="#2a2a30"/>
<text x="557" y="93" fill="#b3b5ba" font-family="sans-serif" font-size="12" text-anchor="middle">Scroll</text>
<rect x="596" y="76" width="60" height="24" rx="12" fill="#7f6df2"/>
<text x="626" y="93" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Page</text>
<rect x="662" y="76" width="74" height="24" rx="12" fill="#2a2a30"/>
<text x="699" y="93" fill="#b3b5ba" font-family="sans-serif" font-size="12" text-anchor="middle">Spread</text>
<path d="M 626 104 q -30 18 -60 0" fill="none" stroke="#a99cf5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="596" y="128" fill="#a99cf5" font-family="sans-serif" font-size="11" text-anchor="middle">the marker slides</text>

<!-- ── Scroll ─────────────────────────────────────────────────────────────── -->
<text x="170" y="170" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Scroll</text>
<text x="170" y="188" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle">as it always was · → is the next chapter</text>
<rect x="40" y="204" width="260" height="300" rx="12" fill="#18181b" stroke="#3a3a3a"/>
<g stroke="#8b8e94" stroke-width="3" stroke-linecap="round">
<line x1="74" y1="232" x2="262" y2="232"/><line x1="74" y1="250" x2="256" y2="250"/><line x1="74" y1="268" x2="262" y2="268"/><line x1="74" y1="286" x2="210" y2="286"/>
<line x1="74" y1="312" x2="262" y2="312"/><line x1="74" y1="330" x2="250" y2="330"/><line x1="74" y1="348" x2="262" y2="348"/><line x1="74" y1="366" x2="258" y2="366"/><line x1="74" y1="384" x2="190" y2="384"/>
<line x1="74" y1="410" x2="262" y2="410"/><line x1="74" y1="428" x2="254" y2="428"/><line x1="74" y1="446" x2="262" y2="446"/><line x1="74" y1="464" x2="244" y2="464"/>
</g>
<!-- a line cut at the bottom: the scroll does not care -->
<line x1="74" y1="494" x2="262" y2="494" stroke="#8b8e94" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
<rect x="286" y="214" width="5" height="280" rx="2.5" fill="#26262b"/>
<rect x="286" y="250" width="5" height="70" rx="2.5" fill="#5f6168"/>

<!-- ── Page ───────────────────────────────────────────────────────────────── -->
<text x="560" y="170" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Page</text>
<text x="560" y="188" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle">whole lines · Space, → or a tap on the edge turns one</text>
<!-- the page before and after, waiting just off screen -->
<rect x="336" y="214" width="96" height="280" rx="6" fill="none" stroke="#3a3a3a" stroke-dasharray="5 5"/>
<rect x="688" y="214" width="96" height="280" rx="6" fill="none" stroke="#3a3a3a" stroke-dasharray="5 5"/>
<rect x="430" y="204" width="260" height="300" rx="12" fill="#18181b" stroke="#7f6df2" stroke-width="1.5"/>
<rect x="430" y="204" width="104" height="3" fill="#7f6df2"/>
<g stroke="#8b8e94" stroke-width="3" stroke-linecap="round">
<line x1="464" y1="232" x2="652" y2="232"/><line x1="464" y1="250" x2="646" y2="250"/><line x1="464" y1="268" x2="652" y2="268"/><line x1="464" y1="286" x2="600" y2="286"/>
<line x1="464" y1="312" x2="652" y2="312"/><line x1="464" y1="330" x2="640" y2="330"/><line x1="464" y1="348" x2="652" y2="348"/><line x1="464" y1="366" x2="648" y2="366"/><line x1="464" y1="384" x2="580" y2="384"/>
<line x1="464" y1="410" x2="652" y2="410"/><line x1="464" y1="428" x2="644" y2="428"/><line x1="464" y1="446" x2="652" y2="446"/><line x1="464" y1="464" x2="652" y2="464"/>
</g>
<text x="560" y="492" fill="#5f6168" font-family="sans-serif" font-size="10" text-anchor="middle">no page number: the chapter, and the hairline</text>
<path d="M 740 354 h -34" stroke="#a99cf5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="736" y="342" fill="#a99cf5" font-family="sans-serif" font-size="11" text-anchor="middle">280 ms</text>

<!-- ── Spread ─────────────────────────────────────────────────────────────── -->
<text x="980" y="170" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Spread</text>
<text x="980" y="188" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle">two pages, an open book · a turn moves two</text>
<rect x="820" y="204" width="320" height="300" rx="12" fill="#18181b" stroke="#3a3a3a"/>
<line x1="980" y1="222" x2="980" y2="486" stroke="#26262b" stroke-width="2"/>
<g stroke="#8b8e94" stroke-width="3" stroke-linecap="round">
<line x1="842" y1="232" x2="962" y2="232"/><line x1="842" y1="250" x2="958" y2="250"/><line x1="842" y1="268" x2="962" y2="268"/><line x1="842" y1="286" x2="920" y2="286"/>
<line x1="842" y1="312" x2="962" y2="312"/><line x1="842" y1="330" x2="954" y2="330"/><line x1="842" y1="348" x2="962" y2="348"/><line x1="842" y1="366" x2="904" y2="366"/>
<line x1="842" y1="392" x2="962" y2="392"/><line x1="842" y1="410" x2="956" y2="410"/><line x1="842" y1="428" x2="962" y2="428"/><line x1="842" y1="446" x2="962" y2="446"/><line x1="842" y1="464" x2="940" y2="464"/>
<line x1="998" y1="232" x2="1118" y2="232"/><line x1="998" y1="250" x2="1112" y2="250"/><line x1="998" y1="268" x2="1060" y2="268"/>
<line x1="998" y1="294" x2="1118" y2="294"/><line x1="998" y1="312" x2="1114" y2="312"/><line x1="998" y1="330" x2="1118" y2="330"/><line x1="998" y1="348" x2="1090" y2="348"/>
<line x1="998" y1="374" x2="1118" y2="374"/><line x1="998" y1="392" x2="1108" y2="392"/><line x1="998" y1="410" x2="1118" y2="410"/><line x1="998" y1="428" x2="1118" y2="428"/><line x1="998" y1="446" x2="1116" y2="446"/><line x1="998" y1="464" x2="1118" y2="464"/>
</g>

<!-- ── An iPad: a spread in landscape, one page in portrait ───────────────── -->
<text x="600" y="560" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">ON AN IPAD, SPREAD CHOSEN</text>
<rect x="250" y="584" width="360" height="200" rx="18" fill="#0c0c0e" stroke="#3a3a3a" stroke-width="2"/>
<rect x="264" y="598" width="332" height="172" rx="8" fill="#18181b"/>
<line x1="430" y1="610" x2="430" y2="758" stroke="#26262b" stroke-width="2"/>
<g stroke="#8b8e94" stroke-width="2.5" stroke-linecap="round">
<line x1="282" y1="620" x2="412" y2="620"/><line x1="282" y1="634" x2="408" y2="634"/><line x1="282" y1="648" x2="412" y2="648"/><line x1="282" y1="662" x2="370" y2="662"/><line x1="282" y1="682" x2="412" y2="682"/><line x1="282" y1="696" x2="404" y2="696"/><line x1="282" y1="710" x2="412" y2="710"/><line x1="282" y1="724" x2="412" y2="724"/><line x1="282" y1="738" x2="390" y2="738"/>
<line x1="448" y1="620" x2="578" y2="620"/><line x1="448" y1="634" x2="572" y2="634"/><line x1="448" y1="648" x2="578" y2="648"/><line x1="448" y1="668" x2="578" y2="668"/><line x1="448" y1="682" x2="560" y2="682"/><line x1="448" y1="696" x2="578" y2="696"/><line x1="448" y1="710" x2="578" y2="710"/><line x1="448" y1="724" x2="570" y2="724"/><line x1="448" y1="738" x2="578" y2="738"/>
</g>
<text x="430" y="806" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle">landscape · two pages</text>

<rect x="700" y="574" width="150" height="220" rx="18" fill="#0c0c0e" stroke="#3a3a3a" stroke-width="2"/>
<rect x="712" y="588" width="126" height="192" rx="8" fill="#18181b"/>
<g stroke="#8b8e94" stroke-width="2.5" stroke-linecap="round">
<line x1="726" y1="608" x2="824" y2="608"/><line x1="726" y1="622" x2="818" y2="622"/><line x1="726" y1="636" x2="824" y2="636"/><line x1="726" y1="650" x2="790" y2="650"/><line x1="726" y1="670" x2="824" y2="670"/><line x1="726" y1="684" x2="814" y2="684"/><line x1="726" y1="698" x2="824" y2="698"/><line x1="726" y1="712" x2="824" y2="712"/><line x1="726" y1="726" x2="800" y2="726"/><line x1="726" y1="746" x2="824" y2="746"/><line x1="726" y1="760" x2="812" y2="760"/>
</g>
<text x="775" y="812" fill="#8b8e94" font-family="sans-serif" font-size="11" text-anchor="middle">portrait · one page</text>
<path d="M 640 680 q 22 -24 44 0" fill="none" stroke="#a99cf5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="662" y="652" fill="#a99cf5" font-family="sans-serif" font-size="11" text-anchor="middle">your line stays</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#a99cf5"/>
</marker>
</defs>
</svg>
