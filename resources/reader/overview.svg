<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="The overview. Left: a chapter of a book in the Reader, the bar below it with the pages-grid button named Overview highlighted, one tap from any view. Middle: the camera pulling back, the page shrinking in three steps into its own card. Right: the Overview panel, a panel of its own with its title and its ×, no tabs, and a grid of six chapter cards, each the start of its page in your type with its name below: the current one framed in the accent colour with a hairline filled half-way, one read to its end with a full hairline, one with a yellow and a blue tick at its edge and a pen for an ink note, one with the bookmark's ribbon at its corner, and the rest with empty hairlines. Bottom: a card becomes its page, closing without a pick is the same shot backwards, marks are never a number, and under reduced motion every move is instant.">
<rect width="1200" height="780" fill="#141416"/>
<text x="600" y="44" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">THE OVERVIEW: EVERY PAGE OF A BOOK, AT A GLANCE</text>

<!-- ── the page you are reading, and the bar's door ────────────────────── -->
<g font-family="sans-serif">
<rect x="40" y="76" width="360" height="560" rx="14" fill="#1e1e22" stroke="#3a3a3a"/>
<text x="64" y="104" fill="#5f6168" font-size="10" font-weight="600" letter-spacing="1">THINKING, FAST AND SLOW</text>
<text x="376" y="104" fill="#5f6168" font-size="12" text-anchor="end">×</text>
<text x="64" y="150" fill="#dcddde" font-family="serif" font-size="20" font-weight="700">Part two · Heuristics</text>
<g fill="#b3b5ba" font-family="serif" font-size="13">
<text x="64" y="186">Many decisions are based on beliefs</text>
<text x="64" y="208">concerning the likelihood of uncertain</text>
<text x="64" y="230">events, such as the outcome of an</text>
<text x="64" y="252">election or the future value of the</text>
<text x="64" y="274">dollar. These beliefs are expressed in</text>
<text x="64" y="296">statements such as "I think that", "the</text>
<text x="64" y="318">chances are", "it is unlikely that".</text>
<text x="64" y="350">What determines such beliefs? How do</text>
<text x="64" y="372">people assess the probability of an</text>
<text x="64" y="394">uncertain event or the value of an</text>
<text x="64" y="416">uncertain quantity? People rely on a</text>
<text x="64" y="438">limited number of principles.</text>
</g>
<!-- the bar -->
<rect x="58" y="566" width="324" height="44" rx="22" fill="#26262b" stroke="#3a3a3a"/>
<g stroke="#8b8e94" stroke-width="1.6" fill="none" stroke-linecap="round">
<path d="M 82 582 l -6 6 l 6 6"/>
<text x="112" y="593" fill="#8b8e94" stroke="none" font-size="10" text-anchor="middle">2 / 5</text>
<path d="M 140 582 l 6 6 l -6 6"/>
<!-- contents: a list -->
<path d="M 170 582 h 14 M 170 588 h 14 M 170 594 h 14"/>
</g>
<!-- the overview's door: a pages grid, highlighted -->
<rect x="198" y="574" width="30" height="28" rx="7" fill="#7f6df2" fill-opacity="0.25" stroke="#7f6df2" stroke-width="1.5"/>
<g fill="none" stroke="#c9c1fa" stroke-width="1.5">
<rect x="205" y="580" width="7" height="7" rx="1.5"/>
<rect x="215" y="580" width="7" height="7" rx="1.5"/>
<rect x="205" y="590" width="7" height="7" rx="1.5"/>
<rect x="215" y="590" width="7" height="7" rx="1.5"/>
</g>
<g stroke="#8b8e94" stroke-width="1.6" fill="none" stroke-linecap="round">
<circle cx="250" cy="587" r="5"/><path d="M 254 591 l 4 4"/>
<path d="M 276 594 l 9 -11 l 3 3 l -9 11 l -4 1 z"/>
<path d="M 306 582 h 12 M 312 582 v 13"/>
<rect x="334" y="580" width="16" height="14" rx="2"/><path d="M 344 580 v 14"/>
</g>
<path d="M 213 618 v 18" stroke="#a99cf5" stroke-width="1.5"/>
<text x="213" y="652" fill="#a99cf5" font-size="11" text-anchor="middle">Overview: one tap, no menu</text>
<text x="213" y="668" fill="#5f6168" font-size="11" text-anchor="middle">every EPUB and PDF, in the reading view and Page view</text>
</g>

<!-- ── the camera pulls back: the page shrinks into its card ───────────── -->
<g font-family="sans-serif">
<rect x="420" y="190" width="150" height="230" rx="10" fill="none" stroke="#7f6df2" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="470" y="246" width="100" height="150" rx="8" fill="none" stroke="#7f6df2" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="514" y="292" width="62" height="92" rx="6" fill="#26262b" stroke="#a99cf5" stroke-width="1.5"/>
<path d="M 404 300 C 470 300 520 330 650 330" fill="none" stroke="#a99cf5" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M 650 330 l -9 -5 m 9 5 l -9 5" stroke="#a99cf5" stroke-width="1.5" fill="none"/>
<text x="500" y="460" fill="#a99cf5" font-size="11" text-anchor="middle">the camera pulls back:</text>
<text x="500" y="476" fill="#a99cf5" font-size="11" text-anchor="middle">the page shrinks into its own card</text>
<text x="500" y="492" fill="#5f6168" font-size="11" text-anchor="middle">400 ms, one move, never a cut</text>
<text x="500" y="530" fill="#5f6168" font-size="11" text-anchor="middle">on an iPad: a pinch inward on the page</text>
</g>

<!-- ── the Overview panel: its own head and ×, no tabs ─────────────────── -->
<g font-family="sans-serif">
<rect x="660" y="76" width="500" height="560" rx="14" fill="#18181b" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="688" y="114" fill="#dcddde" font-size="13" font-weight="600">Overview</text>
<text x="1000" y="114" fill="#5f6168" font-size="10.5" text-anchor="middle">its own panel · the bar's door or a pinch</text>
<text x="1138" y="114" fill="#8b8e94" font-size="13" text-anchor="end">×</text>
</g>

<!-- six chapter cards: the start of each page, in your type -->
<g font-family="sans-serif">
<!-- 1 · read to its end -->
<rect x="688" y="146" width="140" height="190" rx="8" fill="none"/>
<rect x="696" y="152" width="124" height="148" rx="4" fill="#1e1e22" stroke="#3a3a3a"/>
<text x="706" y="172" fill="#dcddde" font-family="serif" font-size="9" font-weight="700">Part one · Two systems</text>
<g stroke="#6f7177" stroke-width="2" stroke-linecap="round"><line x1="706" y1="184" x2="808" y2="184"/><line x1="706" y1="192" x2="800" y2="192"/><line x1="706" y1="200" x2="810" y2="200"/><line x1="706" y1="208" x2="790" y2="208"/><line x1="706" y1="220" x2="806" y2="220"/><line x1="706" y1="228" x2="798" y2="228"/><line x1="706" y1="236" x2="810" y2="236"/></g>
<rect x="696" y="306" width="124" height="3" rx="1.5" fill="#3a3a3a"/>
<rect x="696" y="306" width="124" height="3" rx="1.5" fill="#7f6df2"/>
<text x="758" y="326" fill="#8b8e94" font-size="10.5" text-anchor="middle">Part one</text>

<!-- 2 · current: framed, hairline half-way -->
<rect x="840" y="146" width="140" height="190" rx="8" fill="none" stroke="#7f6df2" stroke-width="1.5"/>
<rect x="848" y="152" width="124" height="148" rx="4" fill="#1e1e22" stroke="#3a3a3a"/>
<text x="858" y="172" fill="#dcddde" font-family="serif" font-size="9" font-weight="700">Part two · Heuristics</text>
<g stroke="#6f7177" stroke-width="2" stroke-linecap="round"><line x1="858" y1="184" x2="960" y2="184"/><line x1="858" y1="192" x2="954" y2="192"/><line x1="858" y1="200" x2="962" y2="200"/><line x1="858" y1="208" x2="944" y2="208"/><line x1="858" y1="220" x2="958" y2="220"/><line x1="858" y1="228" x2="950" y2="228"/><line x1="858" y1="236" x2="962" y2="236"/></g>
<rect x="848" y="306" width="124" height="3" rx="1.5" fill="#3a3a3a"/>
<rect x="848" y="306" width="62" height="3" rx="1.5" fill="#7f6df2"/>
<text x="910" y="326" fill="#dcddde" font-size="10.5" text-anchor="middle">Part two</text>

<!-- 3 · marks: two ticks in their colours, and a pen -->
<rect x="1000" y="152" width="124" height="148" rx="4" fill="#1e1e22" stroke="#3a3a3a"/>
<rect x="1000" y="178" width="4" height="8" rx="1" fill="#e0c050"/>
<rect x="1000" y="232" width="4" height="8" rx="1" fill="#5b9bd5"/>
<text x="1010" y="172" fill="#dcddde" font-family="serif" font-size="9" font-weight="700">Part three · Overconfidence</text>
<g stroke="#6f7177" stroke-width="2" stroke-linecap="round"><line x1="1010" y1="184" x2="1112" y2="184"/><line x1="1010" y1="192" x2="1106" y2="192"/><line x1="1010" y1="200" x2="1114" y2="200"/><line x1="1010" y1="208" x2="1094" y2="208"/><line x1="1010" y1="220" x2="1110" y2="220"/><line x1="1010" y1="228" x2="1102" y2="228"/><line x1="1010" y1="236" x2="1114" y2="236"/></g>
<path d="M 1008 292 l 9 -11 l 3 3 l -9 11 l -4 1 z" fill="none" stroke="#8b8e94" stroke-width="1.3"/>
<rect x="1000" y="306" width="124" height="3" rx="1.5" fill="#3a3a3a"/>
<text x="1062" y="326" fill="#8b8e94" font-size="10.5" text-anchor="middle">Part three</text>

<!-- 4 · a picture opens it -->
<rect x="696" y="352" width="124" height="148" rx="4" fill="#1e1e22" stroke="#3a3a3a"/>
<rect x="710" y="366" width="96" height="62" rx="3" fill="#2c2c33"/>
<path d="M 714 424 l 26 -26 l 18 18 l 12 -10 l 32 18" fill="none" stroke="#5f6168" stroke-width="1.5"/>
<g stroke="#6f7177" stroke-width="2" stroke-linecap="round"><line x1="706" y1="444" x2="808" y2="444"/><line x1="706" y1="452" x2="796" y2="452"/><line x1="706" y1="460" x2="806" y2="460"/></g>
<rect x="696" y="506" width="124" height="3" rx="1.5" fill="#3a3a3a"/>
<text x="758" y="526" fill="#8b8e94" font-size="10.5" text-anchor="middle">Part four</text>

<!-- 5 · a bookmark: the ribbon at its corner -->
<rect x="848" y="352" width="124" height="148" rx="4" fill="#1e1e22" stroke="#3a3a3a"/>
<path d="M 950 352 h 12 v 20 l -6 -5 l -6 5 z" fill="#7f6df2"/>
<text x="858" y="372" fill="#dcddde" font-family="serif" font-size="9" font-weight="700">Part five · Choices</text>
<g stroke="#6f7177" stroke-width="2" stroke-linecap="round"><line x1="858" y1="384" x2="946" y2="384"/><line x1="858" y1="392" x2="954" y2="392"/><line x1="858" y1="400" x2="962" y2="400"/><line x1="858" y1="408" x2="944" y2="408"/><line x1="858" y1="420" x2="958" y2="420"/><line x1="858" y1="428" x2="950" y2="428"/></g>
<rect x="848" y="506" width="124" height="3" rx="1.5" fill="#3a3a3a"/>
<text x="910" y="526" fill="#8b8e94" font-size="10.5" text-anchor="middle">Part five</text>

<!-- 6 · not drawn yet: a sheet of paper with its name -->
<rect x="1000" y="352" width="124" height="148" rx="4" fill="#1e1e22" stroke="#3a3a3a" stroke-dasharray="4 4"/>
<rect x="1000" y="506" width="124" height="3" rx="1.5" fill="#3a3a3a"/>
<text x="1062" y="526" fill="#8b8e94" font-size="10.5" text-anchor="middle">Conclusions</text>
<text x="1062" y="430" fill="#5f6168" font-size="10" text-anchor="middle">paper, until it</text>
<text x="1062" y="444" fill="#5f6168" font-size="10" text-anchor="middle">scrolls near</text>

<text x="910" y="566" fill="#a99cf5" font-size="11" text-anchor="middle">a tick in its colour · a pen for ink · the ribbon for a bookmark</text>
<text x="910" y="584" fill="#a99cf5" font-size="11" text-anchor="middle">the hairline: filled to your place, filled when read — never a number</text>
<text x="910" y="612" fill="#5f6168" font-size="11" text-anchor="middle">a paper's cards are its printed pages; a comic's, its designed pages</text>
</g>

<!-- ── the shots ───────────────────────────────────────────────────────── -->
<g font-family="sans-serif">
<rect x="40" y="690" width="1120" height="62" rx="12" fill="#1a1a1e" stroke="#2c2c30"/>
<text x="180" y="716" fill="#dcddde" font-size="12" text-anchor="middle">tap a card: it flies up and becomes its page</text>
<text x="180" y="734" fill="#5f6168" font-size="11" text-anchor="middle">your chapter lands on your line, never its top</text>
<text x="460" y="716" fill="#dcddde" font-size="12" text-anchor="middle">Esc, × or the button again</text>
<text x="460" y="734" fill="#5f6168" font-size="11" text-anchor="middle">the card grows back into the page</text>
<text x="740" y="716" fill="#dcddde" font-size="12" text-anchor="middle">Tab, the arrows and Enter</text>
<text x="740" y="734" fill="#5f6168" font-size="11" text-anchor="middle">each pick kept in Where you've been</text>
<text x="1010" y="716" fill="#dcddde" font-size="12" text-anchor="middle">reduced motion: at once</text>
<text x="1010" y="734" fill="#5f6168" font-size="11" text-anchor="middle">nothing written, ever</text>
</g>
</svg>
