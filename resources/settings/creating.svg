<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634" role="img" aria-label="Creating notes: the note ID prefix previews as you type, and wizard density is a two-way choice">
<rect width="1200" height="634" fill="#1e1e1e"/><rect x="16" y="16" width="1168" height="568" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="40" y="46" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Settings  ›  Community plugins  ›  ZettelFlow</text><text x="1160" y="46" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><line x1="16" y1="62" x2="1184" y2="62" stroke="#3a3a3a" stroke-width="1"/><text x="89.5" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Flows</text><rect x="127.0" y="76" width="125.60000000000001" height="32" rx="7" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="189.8" y="97" fill="#fff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Creating notes</text><text x="323.40000000000003" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Your knowledge</text><text x="434.80000000000007" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Thinking</text><text x="501.8" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">AI</text><text x="576.2" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Automation</text><text x="672.8000000000001" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Advanced</text><line x1="60" y1="120" x2="1140" y2="120" stroke="#3a3a3a" stroke-width="1"/><rect x="60" y="140" width="36" height="36" rx="9" fill="#2c2747" stroke="#2c2747" stroke-width="2"/><g transform="translate(69,149) scale(1.0)" fill="none" stroke="#7f6df2" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M11 1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6z"/><path d="M11 1v5h5"/><path d="M9 9v5M6.5 11.5h5"/></g><text x="110" y="156" fill="#dcddde" font-family="sans-serif" font-size="17" font-weight="650" text-anchor="start">Creating notes</text><text x="110" y="174" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">How the wizard behaves when it builds a note.</text><rect x="60" y="192" width="1080" height="366" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="76" y="216" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Keep unfinished notes</text><text x="76" y="235" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">When you close the wizard mid-flow, keep what you answered so you can resume it later.</text><rect x="1084" y="210.0" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="1113" cy="221.0" r="8" fill="#fff" stroke="none" stroke-width="2"/><line x1="60" y1="250" x2="1140" y2="250" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="274" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Create in the current folder</text><text x="76" y="293" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Ignore each step's target folder and create the note beside the one you have open.</text><rect x="1084" y="268.0" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="1095" cy="279.0" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><line x1="60" y1="308" x2="1140" y2="308" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="332" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Note ID prefix</text><text x="76" y="351" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A unique prefix for new note names, as a date pattern (YYYYMMDDHHmm).</text><text x="76" y="370" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Today it reads</text><text x="168" y="370" fill="#dcddde" font-family="monospace" font-size="12.5" font-weight="700" text-anchor="start">202610051432</text><rect x="904" y="329" width="220" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="914" y="350.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">YYYYMMDDHHmm</text><line x1="60" y1="384" x2="1140" y2="384" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="408" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Wizard density</text><text x="76" y="427" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">How much room each option takes in the creation wizard.</text><rect x="935.2" y="397.0" width="188.79999999999998" height="32" rx="7" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><rect x="938.2" y="400.0" width="103.6" height="26" rx="5" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="990.0" y="418.0" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Comfortable</text><text x="1084.3999999999999" y="418.0" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="middle">Compact</text><line x1="60" y1="442" x2="1140" y2="442" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="466" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Colour canvas nodes by phase</text><text x="76" y="485" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Choosing a step's phase paints its node in that phase's colour. A canvas you coloured stays yours.</text><rect x="1084" y="460.0" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="1095" cy="471.0" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><line x1="60" y1="500" x2="1140" y2="500" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="524" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Open Home when Obsidian starts</text><text x="76" y="543" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Greet you with the ZettelFlow Home view when Obsidian launches — your daily front door.</text><rect x="1084" y="518.0" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="1113" cy="529.0" r="8" fill="#fff" stroke="none" stroke-width="2"/><circle cx="44" cy="366" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="371" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="44" cy="412" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="417" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="40" cy="610" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="40" y="615" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="60" y="615" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The prefix shows what it produces while you type it</text><circle cx="630" cy="610" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="630" y="615" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="650" y="615" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Density: both sides always visible, one click</text>
</svg>
