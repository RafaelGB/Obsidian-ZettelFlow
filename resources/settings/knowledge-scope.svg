<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="The kept-out card in Settings: 94 of 300 notes count as knowledge; rules as sentences (in Templates, in Archive/Old, tag #draft, type moc or index) each with what it leaves out; a Keep anyway exception for #evergreen; ZettelFlow's own folders locked; and This note naming the rule that left a note out">
<rect width="1200" height="760" fill="#1e1e1e"/>
<rect x="16" y="16" width="808" height="728" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
<text x="40" y="52" fill="#dcddde" font-family="sans-serif" font-size="17" font-weight="600">Kept out of the thinking system</text>
<text x="40" y="76" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600">What is left out</text>
<text x="40" y="96" fill="#8b8e94" font-family="sans-serif" font-size="12.5">Notes left out never enter the graph, Health, discovery, Cultivate or Home. No note is moved or changed.</text>
<rect x="40" y="112" width="760" height="58" rx="8" fill="#1e1e1e" stroke="#3a3a3a"/>
<circle cx="64" cy="141" r="9" fill="none" stroke="#44cf6e" stroke-width="2"/>
<text x="84" y="137" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600">94 of 300 notes count as knowledge</text>
<text x="84" y="157" fill="#8b8e94" font-family="sans-serif" font-size="12">206 left out by your rules · 34 notes kept by an exception</text>
<rect x="612" y="127" width="174" height="28" rx="5" fill="#363636"/>
<text x="699" y="146" fill="#dcddde" font-family="sans-serif" font-size="12" text-anchor="middle">Show the notes left out</text>
<text x="40" y="198" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600">Leave out notes that…</text>
<text x="40" y="216" fill="#8b8e94" font-family="sans-serif" font-size="12">Any one rule is enough.</text>
<g font-family="sans-serif" font-size="13">
<rect x="40" y="228" width="760" height="40" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/>
<text x="62" y="253" fill="#8b8e94">▢</text><text x="84" y="253" fill="#8b8e94">are in</text>
<rect x="128" y="238" width="78" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="167" y="253" fill="#dcddde" font-size="12" text-anchor="middle">Templates</text>
<text x="214" y="253" fill="#8b8e94">and its subfolders</text>
<rect x="640" y="238" width="124" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="702" y="253" fill="#8b8e94" font-size="11.5" text-anchor="middle">Leaves out 78 notes</text>
<text x="780" y="253" fill="#8b8e94">×</text>
<rect x="40" y="276" width="760" height="40" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/>
<text x="62" y="301" fill="#8b8e94">▢</text><text x="84" y="301" fill="#8b8e94">are in</text>
<rect x="128" y="286" width="86" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="171" y="301" fill="#dcddde" font-size="12" text-anchor="middle">Archive/Old</text>
<text x="222" y="301" fill="#8b8e94">and its subfolders</text>
<rect x="640" y="286" width="124" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="702" y="301" fill="#8b8e94" font-size="11.5" text-anchor="middle">Leaves out 43 notes</text>
<text x="780" y="301" fill="#8b8e94">×</text>
<rect x="40" y="324" width="760" height="40" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/>
<text x="62" y="349" fill="#8b8e94">#</text><text x="84" y="349" fill="#8b8e94">have the tag</text>
<rect x="166" y="334" width="56" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="194" y="349" fill="#dcddde" font-size="12" text-anchor="middle">#draft</text>
<text x="230" y="349" fill="#8b8e94">or a nested tag</text>
<rect x="640" y="334" width="124" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="702" y="349" fill="#8b8e94" font-size="11.5" text-anchor="middle">Leaves out 43 notes</text>
<text x="780" y="349" fill="#8b8e94">×</text>
<rect x="40" y="372" width="760" height="40" rx="6" fill="#1e1e1e" stroke="#3a3a3a"/>
<text x="62" y="397" fill="#8b8e94">≡</text><text x="84" y="397" fill="#8b8e94">have</text>
<rect x="118" y="382" width="44" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="140" y="397" fill="#dcddde" font-size="12" text-anchor="middle">type</text>
<text x="170" y="397" fill="#8b8e94">set to</text>
<rect x="214" y="382" width="44" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="236" y="397" fill="#dcddde" font-size="12" text-anchor="middle">moc</text>
<text x="264" y="397" fill="#8b8e94">or</text>
<rect x="284" y="382" width="52" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="310" y="397" fill="#dcddde" font-size="12" text-anchor="middle">index</text>
<rect x="634" y="382" width="130" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="699" y="397" fill="#8b8e94" font-size="11.5" text-anchor="middle">Leaves out 124 notes</text>
<text x="780" y="397" fill="#8b8e94">×</text>
</g>
<rect x="40" y="422" width="110" height="28" rx="5" fill="#363636"/>
<text x="95" y="441" fill="#dcddde" font-family="sans-serif" font-size="12.5" text-anchor="middle">+  Add a rule</text>
<text x="40" y="480" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600">Keep anyway</text>
<text x="40" y="498" fill="#8b8e94" font-family="sans-serif" font-size="12">A note that matches an exception stays in, even when a rule above leaves it out.</text>
<rect x="40" y="510" width="760" height="40" rx="6" fill="#1e1e1e" stroke="#7f6df2"/>
<text x="62" y="535" fill="#8b8e94" font-family="sans-serif" font-size="13">#</text>
<text x="84" y="535" fill="#8b8e94" font-family="sans-serif" font-size="13">have the tag</text>
<rect x="166" y="520" width="84" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="208" y="535" fill="#dcddde" font-family="sans-serif" font-size="12" text-anchor="middle">#evergreen</text>
<rect x="670" y="520" width="94" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="717" y="535" fill="#8b8e94" font-family="sans-serif" font-size="11.5" text-anchor="middle">Keeps 34 notes</text>
<rect x="40" y="570" width="760" height="70" rx="6" fill="none" stroke="#3a3a3a" stroke-dasharray="5 4"/>
<text x="62" y="594" fill="#8b8e94" font-family="sans-serif" font-size="12">🔒  Always left out — no rule or exception changes these</text>
<g font-family="monospace" font-size="11.5" fill="#dcddde">
<rect x="62" y="606" width="148" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="136" y="621" text-anchor="middle">_ZettelFlow/folders</text>
<rect x="218" y="606" width="140" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="288" y="621" text-anchor="middle">_ZettelFlow/hooks</text>
<rect x="366" y="606" width="226" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="479" y="621" text-anchor="middle">Thinking space · _ZettelFlow/lab</text>
</g>
<text x="40" y="690" fill="#5c5f66" font-family="sans-serif" font-size="12">Folder, tag or property — picked from your vault, never typed. Order changes which rule is named, never what is out.</text>
<rect x="848" y="16" width="336" height="300" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
<text x="872" y="50" fill="#8b8e94" font-family="sans-serif" font-size="11" font-weight="650">THIS NOTE</text>
<text x="872" y="80" fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="600">Weekly template</text>
<text x="872" y="112" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600">This note is outside ZettelFlow</text>
<text x="872" y="134" fill="#8b8e94" font-family="sans-serif" font-size="12">It is left out, so it gets no next step,</text>
<text x="872" y="150" fill="#8b8e94" font-family="sans-serif" font-size="12">no neighbours and no story.</text>
<text x="872" y="180" fill="#8b8e94" font-family="sans-serif" font-size="12">Left out by</text>
<rect x="872" y="190" width="290" height="24" rx="12" fill="#1e1e1e" stroke="#3a3a3a"/>
<text x="1017" y="206" fill="#dcddde" font-family="sans-serif" font-size="11.5" text-anchor="middle">are in Templates and its subfolders</text>
<text x="872" y="236" fill="#8b8e94" font-family="sans-serif" font-size="11.5">Kept out also by have the tag #draft or a nested tag</text>
<rect x="872" y="254" width="168" height="30" rx="5" fill="#363636"/>
<text x="956" y="274" fill="#dcddde" font-family="sans-serif" font-size="12.5" text-anchor="middle">Change what is left out</text>
<rect x="848" y="336" width="336" height="408" rx="12" fill="#262626" stroke="#7f6df2" stroke-width="2"/>
<text x="872" y="368" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600">New rule</text>
<text x="940" y="368" fill="#8b8e94" font-family="sans-serif" font-size="12">Leave out notes that…</text>
<g font-family="sans-serif" font-size="12">
<text x="872" y="400" fill="#8b8e94">Kind</text>
<rect x="912" y="384" width="64" height="26" rx="5" fill="#363636"/><text x="944" y="401" fill="#dcddde" text-anchor="middle">Folder</text>
<rect x="982" y="384" width="48" height="26" rx="5" fill="#7f6df2"/><text x="1006" y="401" fill="#ffffff" text-anchor="middle">Tag</text>
<rect x="1036" y="384" width="74" height="26" rx="5" fill="#363636"/><text x="1073" y="401" fill="#dcddde" text-anchor="middle">Property</text>
<rect x="872" y="424" width="290" height="26" rx="5" fill="#1e1e1e" stroke="#3a3a3a"/><text x="890" y="441" fill="#5c5f66">Search the tags in your vault…</text>
<rect x="872" y="462" width="86" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="915" y="477" fill="#dcddde" text-anchor="middle">#draft  52</text>
<rect x="964" y="462" width="80" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="1004" y="477" fill="#dcddde" text-anchor="middle">#idea  52</text>
<rect x="872" y="490" width="112" height="22" rx="11" fill="#7f6df2"/><text x="928" y="505" fill="#ffffff" text-anchor="middle">✓ #template  51</text>
<rect x="990" y="490" width="104" height="22" rx="11" fill="#262626" stroke="#3a3a3a"/><text x="1042" y="505" fill="#dcddde" text-anchor="middle">#meeting  51</text>
<line x1="872" y1="534" x2="1162" y2="534" stroke="#3a3a3a"/>
<text x="872" y="560" fill="#dcddde" font-size="13.5" font-weight="600">Would leave out 51 notes</text>
<text x="872" y="580" fill="#8b8e94" font-size="11.5">29 of them are already left out by another rule</text>
<text x="872" y="596" fill="#8b8e94" font-size="11.5">Note 0, Note 105, Note 112 and 48 more</text>
<rect x="984" y="700" width="76" height="28" rx="5" fill="#363636"/><text x="1022" y="719" fill="#dcddde" text-anchor="middle">Cancel</text>
<rect x="1068" y="700" width="94" height="28" rx="5" fill="#7f6df2"/><text x="1115" y="719" fill="#ffffff" text-anchor="middle">Add rule</text>
</g>
</svg>
