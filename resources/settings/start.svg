#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">What's new</text><rect x="909.2" y="82" width="68.8" height="28" rx="14" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><g transform="translate(919.2,89) scale(0.78)" fill="none" stroke="#8b8e94" stroke-width="2.31" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15.5V3a1.5 1.5 0 0 1 1.5-1.5H15v15H4.5A1.5 1.5 0 0 1 3 15a1.5 1.5 0 0 1 1.5-1.5H15"/></g><text x="939.2" y="101" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Docs</text><rect x="60.0" y="140" width="262.5" height="74" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><circle cx="76.0" cy="160" r="4" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="88.0" y="164" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Creates notes with</text><text x="74.0" y="187" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="700" text-anchor="start">Nothing yet</text><text x="74.0" y="205" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Choose a way in below</text><rect x="332.5" y="140" width="262.5" height="74" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><circle cx="348.5" cy="160" r="4" fill="#57ab5a" stroke="#57ab5a" stroke-width="2"/><text x="360.5" y="164" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Thinking</text><text x="346.5" y="187" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="700" text-anchor="start">5 of 5 moves</text><text x="346.5" y="205" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Asks before revealing</text><rect x="605.0" y="140" width="262.5" height="74" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><circle cx="621.0" cy="160" r="4" fill="#5c5f66" stroke="#5c5f66" stroke-width="2"/><text x="633.0" y="164" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">AI</text><text x="619.0" y="187" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="700" text-anchor="start">Off</text><text x="619.0" y="205" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Works fully without it</text><rect x="877.5" y="140" width="262.5" height="74" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><circle cx="893.5" cy="160" r="4" fill="#5c5f66" stroke="#5c5f66" stroke-width="2"/><text x="905.5" y="164" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Property hooks</text><text x="891.5" y="187" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="700" text-anchor="start">0 active</text><text x="891.5" y="205" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">0 paused</text><defs><linearGradient id="st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2747"/><stop offset="1" stop-color="#1e1e1e"/></linearGradient></defs><rect x="60" y="234" width="1080" height="228" rx="12" fill="url(#st)" stroke="#5a4cb0" stroke-width="2"/><text x="80" y="266" fill="#dcddde" font-family="sans-serif" font-size="16.5" font-weight="700" text-anchor="start">Start creating notes</text><text x="80" y="288" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">Nothing creates notes yet. Pick one way in — you can change it any time.</text><rect x="80.0" y="306" width="338.6666666666667" height="138" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="96.0" y="334" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="650" text-anchor="start">Install a ready system</text><text x="96.0" y="356" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Zettelkasten, PARA, GTD, research…</text><text x="96.0" y="373" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">rehearsed before it installs.</text><rect x="96.0" y="396" width="150" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="171.0" y="417.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Browse systems</text><rect x="430.6666666666667" y="306" width="338.6666666666667" height="138" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="446.6666666666667" y="334" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="650" text-anchor="start">Use a canvas I already have</text><text x="446.6666666666667" y="356" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Give one of your canvases the</text><text x="446.6666666666667" y="373" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">"Creates notes" role.</text><rect x="446.6666666666667" y="396" width="140" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="516.6666666666667" y="417.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">Choose a canvas</text><rect x="781.3333333333334" y="306" width="338.6666666666667" height="138" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="797.3333333333334" y="334" fill="#dcddde" font-family="sans-serif" font-size="14.5" font-weight="650" text-anchor="start">Just think first</text><text x="797.3333333333334" y="356" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">No setup: open Cultivate and</text><text x="797.3333333333334" y="373" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">grow one idea.</text><rect x="797.3333333333334" y="396" width="140" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="867.3333333333334" y="417.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">Open Cultivate</text><circle cx="44" cy="160" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="165" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="68" cy="316" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="68" y="321" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="418.6666666666667" cy="316" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="418.6666666666667" y="321" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="769.3333333333334" cy="316" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="769.3333333333334" y="321" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="40" cy="506" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="40" y="511" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="60" y="511" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">While nothing creates notes, the card says so — in orange, never red</text><circle cx="40" cy="532" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="40" y="537" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="60" y="537" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The gallery: a ready system, rehearsed before it installs</text><circle cx="620" cy="506" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="620" y="511" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="640" y="511" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Your own canvas: jumps to the role picker under Flows</text><circle cx="620" cy="532" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="620" y="537" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="640" y="537" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Or skip setup entirely and think with Cultivate</text>
</svg>
