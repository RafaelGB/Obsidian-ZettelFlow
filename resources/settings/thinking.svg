<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1128" viewBox="0 0 1200 1128" role="img" aria-label="Thinking: the pauses together, the five Cultivate moves as a grid, returns with their duration, and what ZettelFlow remembers">
<rect width="1200" height="1128" fill="#1e1e1e"/><rect x="16" y="16" width="1168" height="1036" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="40" y="46" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Settings  ›  Community plugins  ›  ZettelFlow</text><text x="1160" y="46" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><line x1="16" y1="62" x2="1184" y2="62" stroke="#3a3a3a" stroke-width="1"/><text x="89.5" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Flows</text><text x="189.8" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Creating notes</text><text x="323.40000000000003" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Your knowledge</text><rect x="394.20000000000005" y="76" width="81.2" height="32" rx="7" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="434.80000000000007" y="97" fill="#fff" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Thinking</text><text x="501.8" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">AI</text><text x="576.2" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Automation</text><text x="672.8000000000001" y="97" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Advanced</text><line x1="60" y1="120" x2="1140" y2="120" stroke="#3a3a3a" stroke-width="1"/><rect x="60" y="140" width="36" height="36" rx="9" fill="#2c2747" stroke="#2c2747" stroke-width="2"/><g transform="translate(69,149) scale(1.0)" fill="none" stroke="#7f6df2" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 11c.2-.8.6-1.3 1.2-1.9a4.5 4.5 0 1 0-7.4 0c.6.6 1 1.1 1.2 1.9"/><path d="M7 14h4M7.8 17h2.4"/></g><text x="110" y="156" fill="#dcddde" font-family="sans-serif" font-size="17" font-weight="650" text-anchor="start">Thinking</text><text x="110" y="174" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">The pauses, the moves and the returns that make you think.</text><rect x="60" y="192" width="1080" height="226" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><path d="M61 228 V202 a9 9 0 0 1 9 -9 H1130 a9 9 0 0 1 9 9 V228 Z" fill="#262626"/><line x1="60" y1="228" x2="1140" y2="228" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="215" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">PAUSES — YOUR READING BEFORE THEIRS</text><text x="76" y="252" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Ask before revealing</text><text x="76" y="271" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">On by default. Connect, challenge and add a source ask for your own reading before they show you theirs.</text><text x="76" y="288" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Always skippable.</text><rect x="1084" y="254.0" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="1113" cy="265.0" r="8" fill="#fff" stroke="none" stroke-width="2"/><line x1="60" y1="302" x2="1140" y2="302" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="326" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Ask for your reading before suggesting links</text><text x="76" y="345" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">In the note builder, pause for your own answer before the connection suggestions appear. Off by default.</text><rect x="1084" y="320.0" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="1095" cy="331.0" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><line x1="60" y1="360" x2="1140" y2="360" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="384" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Think before you look, in Explore</text><text x="76" y="403" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Off by default. Explore stays quiet until you have written what you currently think.</text><rect x="1084" y="378.0" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="1095" cy="389.0" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><rect x="60" y="432" width="1080" height="126" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><path d="M61 468 V442 a9 9 0 0 1 9 -9 H1130 a9 9 0 0 1 9 9 V468 Z" fill="#262626"/><line x1="60" y1="468" x2="1140" y2="468" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="455" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">CULTIVATE MOVES · 4 OF 5 ARE ON</text><rect x="76.0" y="482" width="201.6" height="62" rx="9" fill="#2c2747" stroke="#7f6df2" stroke-width="1.5"/><text x="88.0" y="505" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Connect</text><text x="88.0" y="525" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Link an idea</text><rect x="227.60000000000002" y="492" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="256.6" cy="503" r="8" fill="#fff" stroke="none" stroke-width="2"/><rect x="287.6" y="482" width="201.6" height="62" rx="9" fill="#2c2747" stroke="#7f6df2" stroke-width="1.5"/><text x="299.6" y="505" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Challenge</text><text x="299.6" y="525" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Its counterpoint</text><rect x="439.20000000000005" y="492" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="468.20000000000005" cy="503" r="8" fill="#fff" stroke="none" stroke-width="2"/><rect x="499.2" y="482" width="201.6" height="62" rx="9" fill="#2c2747" stroke="#7f6df2" stroke-width="1.5"/><text x="511.2" y="505" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Question</text><text x="511.2" y="525" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">What it raises</text><rect x="650.8" y="492" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="679.8" cy="503" r="8" fill="#fff" stroke="none" stroke-width="2"/><rect x="710.8" y="482" width="201.6" height="62" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="722.8" y="505" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Advance</text><text x="722.8" y="525" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">The next state</text><rect x="862.4" y="492" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="873.4" cy="503" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><rect x="922.4" y="482" width="201.6" height="62" rx="9" fill="#2c2747" stroke="#7f6df2" stroke-width="1.5"/><text x="934.4" y="505" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Add a source</text><text x="934.4" y="525" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Ground it</text><rect x="1074.0" y="492" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="1103.0" cy="503" r="8" fill="#fff" stroke="none" stroke-width="2"/><rect x="60" y="572" width="1080" height="226" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><path d="M61 608 V582 a9 9 0 0 1 9 -9 H1130 a9 9 0 0 1 9 9 V608 Z" fill="#262626"/><line x1="60" y1="608" x2="1140" y2="608" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="595" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">RETURNS AND THE THINKING SPACE</text><text x="76" y="632" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Days before a claim comes back</text><text x="76" y="651" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A claim you stated comes back to you once, after this long. A duration you set — it never adapts to your</text><text x="76" y="668" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">answers.</text><line x1="834" y1="645.0" x2="1024" y2="645.0" stroke="#3a3a3a" stroke-width="4"/><line x1="834" y1="645.0" x2="878.0502793296089" y2="645.0" stroke="#7f6df2" stroke-width="4"/><circle cx="878.0502793296089" cy="645.0" r="8" fill="#fff" stroke="#7f6df2" stroke-width="2"/><text x="1124" y="650.0" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">90 days</text><line x1="60" y1="682" x2="1140" y2="682" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="706" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Thinking space folder</text><text x="76" y="725" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Where thinking lives before it has to be knowledge. Left out of the knowledge model.</text><rect x="884" y="695.0" width="240" height="32" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><text x="894" y="716.0" fill="#dcddde" font-family="monospace" font-size="13.5" font-weight="400" text-anchor="start">_ZettelFlow/lab</text><line x1="60" y1="740" x2="1140" y2="740" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="764" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Re-run a pattern after the note is indexed</text><text x="76" y="783" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Run a note's on-creation pattern once more after indexing, so graph results fill in. On by default.</text><rect x="1084" y="758.0" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="1113" cy="769.0" r="8" fill="#fff" stroke="none" stroke-width="2"/><rect x="60" y="812" width="1080" height="214" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><path d="M61 848 V822 a9 9 0 0 1 9 -9 H1130 a9 9 0 0 1 9 9 V848 Z" fill="#262626"/><line x1="60" y1="848" x2="1140" y2="848" stroke="#3a3a3a" stroke-width="1"/><text x="76" y="835" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">WHAT ZETTELFLOW REMEMBERS — LOCAL ONLY</text><rect x="76.0" y="862" width="341.3333333333333" height="150" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="90.0" y="888" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Record development events</text><rect x="363.3333333333333" y="874" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="392.3333333333333" cy="885" r="8" fill="#fff" stroke="none" stroke-width="2"/><text x="90.0" y="914" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">A per-day count of ideas developed.</text><line x1="90.0" y1="936" x2="403.3333333333333" y2="936" stroke="#3a3a3a" stroke-width="1"/><g transform="translate(90.0,952) scale(0.75)" fill="none" stroke="#5c5f66" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="12" height="9" rx="2"/><path d="M6 8V5.5a3 3 0 0 1 6 0V8"/></g><text x="108.0" y="964" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Stored locally as day → count only —</text><text x="108.0" y="982" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">no note names, no content, no network.</text><rect x="429.3333333333333" y="862" width="341.3333333333333" height="150" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="443.3333333333333" y="888" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Record my decisions</text><rect x="716.6666666666666" y="874" width="40" height="22" rx="11" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><circle cx="745.6666666666666" cy="885" r="8" fill="#fff" stroke="none" stroke-width="2"/><text x="443.3333333333333" y="914" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">What you accepted, changed or rejected.</text><line x1="443.3333333333333" y1="936" x2="756.6666666666666" y2="936" stroke="#3a3a3a" stroke-width="1"/><g transform="translate(443.3333333333333,952) scale(0.75)" fill="none" stroke="#5c5f66" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="12" height="9" rx="2"/><path d="M6 8V5.5a3 3 0 0 1 6 0V8"/></g><text x="461.3333333333333" y="964" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">A note path, a short label and the verdict.</text><text x="461.3333333333333" y="982" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Never note content, never AI output.</text><rect x="782.6666666666666" y="862" width="341.3333333333333" height="150" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="796.6666666666666" y="888" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="650" text-anchor="start">Record conceptual snapshots</text><rect x="1070.0" y="874" width="40" height="22" rx="11" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/><circle cx="1081.0" cy="885" r="8" fill="#8b8e94" stroke="none" stroke-width="2"/><text x="796.6666666666666" y="914" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">How a note's state and claims changed.</text><line x1="796.6666666666666" y1="936" x2="1110.0" y2="936" stroke="#3a3a3a" stroke-width="1"/><g transform="translate(796.6666666666666,952) scale(0.75)" fill="none" stroke="#5c5f66" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="12" height="9" rx="2"/><path d="M6 8V5.5a3 3 0 0 1 6 0V8"/></g><text x="814.6666666666666" y="964" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Stores claim texts, so it is opt-in;</text><text x="814.6666666666666" y="982" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">turning it off clears what was captured.</text><circle cx="44" cy="210" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="215" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="44" cy="450" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="455" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="44" cy="634" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="639" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="44" cy="830" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="44" y="835" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="40" cy="1078" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="40" y="1083" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="60" y="1083" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Your reading before theirs — the three pauses in one place</text><circle cx="40" cy="1104" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="40" y="1109" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="60" y="1109" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The moves as a grid that says how many are on</text><circle cx="630" cy="1078" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="630" y="1083" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="650" y="1083" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The slider says its duration: 90 days</text><circle cx="630" cy="1104" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="630" y="1109" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="650" y="1109" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Each memory: its switch, and exactly what is stored</text>
</svg>
