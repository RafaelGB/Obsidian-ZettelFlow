<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d" font-family="sans-serif">
<title id="t">A before/after idea card</title>
<desc id="d">The shareable idea card: 'How this idea grew', the note title, a Before panel (fleeting, 2 claims) and an After panel (permanent, 3 claims) joined by an arrow, a stats strip (+1 claims, 9 links, 4 decisions, 46 days), the direction line, and the claim as it was and as it is now.</desc>
<rect width="1200" height="630" fill="#0b0e14"/><text x="64" y="72" fill="#aeb6c4" font-size="24" font-weight="600">How this idea grew</text><text x="64" y="132" fill="#e8eaed" font-size="52" font-weight="700">Writing is thinking</text><rect x="64" y="200" width="491" height="200" rx="16" fill="#161b26" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="309.5" y="248" fill="#8b93a7" font-size="22" font-weight="600" text-anchor="middle">BEFORE</text><text x="309.5" y="316" fill="#22d3ee" font-size="44" font-weight="700" text-anchor="middle">fleeting</text><text x="309.5" y="366" fill="#aeb6c4" font-size="22" text-anchor="middle">2 claims</text><rect x="645" y="200" width="491" height="200" rx="16" fill="#161b26" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="890.5" y="248" fill="#8b93a7" font-size="22" font-weight="600" text-anchor="middle">AFTER</text><text x="890.5" y="316" fill="#22d3ee" font-size="44" font-weight="700" text-anchor="middle">permanent</text><text x="890.5" y="366" fill="#aeb6c4" font-size="22" text-anchor="middle">3 claims</text><text x="600" y="320" fill="#60a5fa" font-size="64" font-weight="700" text-anchor="middle">→</text><text x="600" y="480" fill="#4ade80" font-size="30" font-weight="600" text-anchor="middle">+1 claims   ·   9 links   ·   4 decisions   ·   46 days</text><text x="600" y="528" fill="#aeb6c4" font-size="26" text-anchor="middle">Advancing — you ruled on it recently.</text><text x="64" y="566" fill="#aeb6c4" font-size="26">“Writing records what I already think.”</text><text x="64" y="604" fill="#e8eaed" font-size="26">“Writing is where I find out what I think.”</text><text x="1136" y="590" fill="#8b93a7" font-size="22" font-weight="600" text-anchor="end">ZettelFlow</text>

</svg>
