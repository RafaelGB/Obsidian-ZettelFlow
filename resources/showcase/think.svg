<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d" font-family="sans-serif">
<title id="t">Think — a place for what is not knowledge yet</title>
<desc id="d">The Think space: the composer holding an answer about two notes, a stream of thoughts with forks and challenges threaded under each other and links to the notes they are about, and the 'Two things far apart' panel showing two notes from distant regions, asking what they could share, with Another pair, Nothing here and Close.</desc>
<rect x="0" y="0" width="1200" height="720" rx="0" fill="#1e1e1e"/><rect x="0" y="0" width="1200" height="40" rx="0" fill="#181818"/><rect x="12" y="8" width="76.4" height="32" rx="7" fill="#1e1e1e"/><circle cx="30" cy="24" r="5" fill="none" stroke="#dcddde" stroke-width="1.6"/><text x="42" y="29" fill="#dcddde" font-size="13">Home</text><rect x="24" y="54" width="270" height="32" rx="7" fill="#2b2b2b"/><rect x="207" y="57" width="84" height="26" rx="5" fill="#1e1e1e"/><text x="68" y="75" fill="#8b8e94" font-size="13" text-anchor="middle">Home</text><text x="159" y="75" fill="#8b8e94" font-size="13" text-anchor="middle">Cultivate</text><text x="250" y="75" fill="#dcddde" font-size="13" text-anchor="middle">Think</text><text x="24" y="116" fill="#8b8e94" font-size="14">Write what you are thinking. None of this is a note, and none of it has to become one.</text><rect x="24" y="130" width="640" height="72" rx="8" fill="#262626" stroke="#7f6df2" stroke-width="2"/><text x="40" y="156" fill="#dcddde" font-size="15">Both turn private knowledge into a signal others can act on</text><text x="40" y="184" fill="#7f6df2" font-size="12.5">about Bees' waggle dance and Code review checklists</text><line x1="436" y1="143" x2="436" y2="163" stroke="#dcddde" stroke-width="1.5"/><rect x="24" y="222" width="640" height="70" rx="8" fill="#262338" stroke="#7f6df2" stroke-width="2"/><text x="40" y="246" fill="#dcddde" font-size="14.5">Maybe the slip-box is a conversation partner, not an archive.</text><text x="650" y="246" fill="#8b8e94" font-size="12" text-anchor="end">today</text><text x="40" y="272" fill="#7f6df2" font-size="12.5">about Luhmann's slip-box</text><text x="650" y="274" fill="#c9c0ff" font-size="12.5" text-anchor="end">Fork · Challenge · Connect</text><line x1="40" y1="294" x2="40" y2="339" stroke="#3a3a3a" stroke-width="2"/><line x1="40" y1="339" x2="56" y2="339" stroke="#3a3a3a" stroke-width="2"/><rect x="56" y="304" width="608" height="70" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="72" y="328" fill="#dcddde" font-size="14.5">Then an unanswered note is a question left hanging in the conversation.</text><text x="650" y="328" fill="#8b8e94" font-size="12" text-anchor="end">today</text><text x="72" y="354" fill="#aeb6c4" font-size="12.5" font-style="italic">went its own way from another thought</text><line x1="40" y1="376" x2="40" y2="421" stroke="#3a3a3a" stroke-width="2"/><line x1="40" y1="421" x2="56" y2="421" stroke="#3a3a3a" stroke-width="2"/><rect x="56" y="386" width="608" height="70" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="72" y="410" fill="#dcddde" font-size="14.5">An archive can be a conversation too — libraries talk back.</text><text x="650" y="410" fill="#8b8e94" font-size="12" text-anchor="end">yesterday</text><text x="72" y="436" fill="#aeb6c4" font-size="12.5" font-style="italic">argues with another thought</text><rect x="24" y="468" width="640" height="70" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="40" y="492" fill="#dcddde" font-size="14.5">Spacing works because forgetting is part of the work.</text><text x="650" y="492" fill="#8b8e94" font-size="12" text-anchor="end">last week</text><text x="40" y="518" fill="#7f6df2" font-size="12.5">about Spaced repetition</text><rect x="688" y="104" width="488" height="492" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="710" y="134" fill="#8b8e94" font-size="11.5" font-weight="700">TWO THINGS FAR APART</text><text x="710" y="166" fill="#dcddde" font-size="19" font-weight="700">What could these two have in common?</text><text x="710" y="192" fill="#8b8e94" font-size="13.5">Two notes with nothing between them. The answer is yours —</text><text x="710" y="210" fill="#8b8e94" font-size="13.5">nothing here will offer one.</text><rect x="710" y="232" width="210" height="170" rx="10" fill="#1e1e1e" stroke="#fbbf24" stroke-width="2"/><text x="726" y="262" fill="#dcddde" font-size="15" font-weight="700">Bees' waggle dance</text><text x="726" y="290" fill="#8b8e94" font-size="13">A forager tells the hive</text><text x="726" y="310" fill="#8b8e94" font-size="13">where food is, by dancing.</text><text x="726" y="346" fill="#fbbf24" font-size="12">in Biology</text><text x="726" y="384" fill="#7f6df2" font-size="12.5">Open this note</text><rect x="944" y="232" width="210" height="170" rx="10" fill="#1e1e1e" stroke="#22d3ee" stroke-width="2"/><text x="960" y="262" fill="#dcddde" font-size="15" font-weight="700">Code review checklists</text><text x="960" y="290" fill="#8b8e94" font-size="13">Short lists catch what</text><text x="960" y="310" fill="#8b8e94" font-size="13">experts stop noticing.</text><text x="960" y="346" fill="#22d3ee" font-size="12">in Engineering</text><text x="960" y="384" fill="#7f6df2" font-size="12.5">Open this note</text><text x="932" y="326" fill="#e0a351" font-size="30" font-weight="700" text-anchor="middle">?</text><rect x="710" y="420" width="202" height="24" rx="12" fill="#303030"/><text x="811" y="436.5" fill="#aeb6c4" font-size="12.5" text-anchor="middle">As far as this vault goes</text><text x="710" y="478" fill="#e0a351" font-size="14" font-weight="600">You answer in the composer on the left —</text><text x="710" y="498" fill="#e0a351" font-size="14" font-weight="600">nothing here suggests one, and nothing is counted</text><rect x="710" y="540" width="130" height="34" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="775" y="562" fill="#dcddde" font-size="14" font-weight="400" text-anchor="middle">Another pair</text><rect x="850" y="540" width="130" height="34" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="915" y="562" fill="#dcddde" font-size="14" font-weight="400" text-anchor="middle">Nothing here</text><rect x="1064" y="540" width="90" height="34" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="1109" y="562" fill="#dcddde" font-size="14" font-weight="400" text-anchor="middle">Close</text>
<rect x="0" y="664" width="1200" height="56" fill="#111" opacity="0.92"/><text x="24" y="698" fill="#dcddde" font-size="17" font-weight="700">Think — a place for what is not knowledge yet</text><text x="1176" y="698" fill="#8b8e94" font-size="13" text-anchor="end">ZettelFlow · illustration</text>
</svg>
