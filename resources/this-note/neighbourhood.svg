08" y="48" width="668" height="430" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="530" y="82" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="700" text-anchor="start">NEIGHBOURHOOD</text><rect x="1050" y="66" width="104" height="24" rx="5" fill="#303030" stroke="#303030" stroke-width="1"/><text x="1077" y="82" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Graph</text><rect x="1102" y="68" width="50" height="20" rx="4" fill="#1e1e1e" stroke="#1e1e1e" stroke-width="1"/><text x="1127" y="82" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">List</text><text x="530" y="124" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Links in</text><text x="598.8" y="124" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">· 3</text><text x="534" y="154" fill="#7f6df2" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">The notes owe nothing</text><rect x="810" y="139" width="93" height="21" rx="10" fill="#303030" stroke="#3a3a3a" stroke-width="1"/><text x="856.5" y="154" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Contradicts</text><text x="534" y="184" fill="#7f6df2" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Zettelkasten method</text><text x="534" y="214" fill="#7f6df2" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Luhmann's slip-box</text><line x1="530.0" y1="234.0" x2="1154.0" y2="234.0" stroke="#3a3a3a" stroke-width="1" opacity="1.0"/><text x="530" y="266" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Links out</text><text x="606.4" y="266" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">· 5</text><text x="534" y="296" fill="#7f6df2" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Compound interest</text><rect x="810" y="281" width="72" height="21" rx="10" fill="#303030" stroke="#3a3a3a" stroke-width="1"/><text x="846.0" y="296" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Supports</text><text x="534" y="326" fill="#7f6df2" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Orphan notes</text><rect x="810" y="311" width="72" height="21" rx="10" fill="#303030" stroke="#3a3a3a" stroke-width="1"/><text x="846.0" y="326" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Supports</text><text x="534" y="356" fill="#7f6df2" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Refactoring notes</text><rect x="810" y="341" width="65" height="21" rx="10" fill="#303030" stroke="#3a3a3a" stroke-width="1"/><text x="842.5" y="356" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Example</text><text x="534" y="386" fill="#7f6df2" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Atomic notes</text><rect x="810" y="371" width="65" height="21" rx="10" fill="#303030" stroke="#3a3a3a" stroke-width="1"/><text x="842.5" y="386" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Expands</text><text x="534" y="416" fill="#7f6df2" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="start">Zettelkasten method</text><circle cx="34.0" cy="210.0" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="215" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="466.0" cy="150.0" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="466" y="155" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="334.0" cy="78.0" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="334" y="83" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="632.0" cy="119.0" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="632" y="124" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="46.0" cy="524.0" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="529" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="66" y="529" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Colour is the relation: supports green, contradicts red, an example blue; any other link faint.</text><circle cx="46.0" cy="552.0" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="557" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="66" y="557" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The dashed ring: notes near it you do not link with — the first of Near and forgotten.</text><circle cx="46.0" cy="580.0" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="585" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="66" y="585" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Graph or list, remembered. At most twelve are drawn; past that, “+N more notes” opens the list.</text><circle cx="46.0" cy="608.0" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="46" y="613" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="66" y="613" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The counts match the head's “links in / links out”, which open this list on that group.</text><text x="46" y="660" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">It writes nothing, and reads only this note's links — the same cost in a vault of 100 notes or 20,000.</text>
</svg>
