<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Undo, in the moment: a flow writes one batch — a note created, two properties set, a line appended to an index — and the notice offers Undo for thirty seconds. Undo previews the counts and the notes, sends the created note to the trash, restores the properties, removes exactly the appended text, and leaves alone, by name, any note you edited since.">
<rect x="0" y="0" width="1200" height="600" rx="0" fill="#1a1a1a"/>
<rect x="24" y="20" width="1152" height="560" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
<circle cx="46" cy="40" r="5.5" fill="#fb464c"/>
<circle cx="64" cy="40" r="5.5" fill="#e0a351"/>
<circle cx="82" cy="40" r="5.5" fill="#5cc98a"/>
<text x="600.0" y="45" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">My vault — Obsidian</text>
<line x1="24" y1="60" x2="1176" y2="60" stroke="#3a3a3a" stroke-width="1"/>
<text x="64" y="100" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">One flow, one batch</text>
<rect x="64" y="116" width="520" height="236" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="88" y="148" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="650" text-anchor="start">Permanent note · Zettelkasten</text>
<rect x="88" y="184" width="472" height="36" rx="6" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
<circle cx="106" cy="202" r="4.5" fill="#5cc98a"/>
<text x="120" y="206.5" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Created</text>
<text x="196" y="206.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Zettelkasten/Permanent/Retrieval practice.md</text>
<rect x="88" y="230" width="472" height="36" rx="6" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
<circle cx="106" cy="248" r="4.5" fill="#5aa9f0"/>
<text x="120" y="252.5" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Set</text>
<text x="196" y="252.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">maturity, related  on  Retrieval practice</text>
<rect x="88" y="276" width="472" height="36" rx="6" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
<circle cx="106" cy="294" r="4.5" fill="#e0a351"/>
<text x="120" y="298.5" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Appended</text>
<text x="196" y="298.5" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">one line to  Index.md</text>
<path d="M 572 184 L 578 184 L 578 312 L 572 312" fill="none" stroke="#8f7ff5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="336" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">every write underneath shares one batch id</text>
<text x="632" y="100" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">The notice, for thirty seconds</text>
<rect x="632" y="116" width="504" height="96" rx="10" fill="#2a2938" stroke="#3d3b54" stroke-width="1.5"/>
<text x="656" y="148" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="start">Note created: Retrieval practice</text>
<text x="656" y="170" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">3 changes in one batch</text>
<rect x="1036" y="136" width="80" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="1"/>
<text x="1076.0" y="156.5" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="500" text-anchor="middle">Undo</text>
<rect x="656" y="190" width="456" height="4" rx="2" fill="#3a3850"/>
<rect x="656" y="190" width="300" height="4" rx="2" fill="#8f7ff5"/>
<text x="1112" y="206" fill="#5c5f66" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="end">30 s</text>
<path d="M 884 222 L 884 250" fill="none" stroke="#8f7ff5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 878 244 L 884 252 L 890 244" fill="none" stroke="#8f7ff5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="632" y="260" width="504" height="210" rx="12" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="656" y="292" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="650" text-anchor="start">Take this back?</text>
<circle cx="664" cy="318" r="4" fill="#5cc98a"/>
<text x="676" y="322" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">1 note to Obsidian's trash — nothing is deleted</text>
<circle cx="664" cy="342" r="4" fill="#5aa9f0"/>
<text x="676" y="346" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">2 properties back to what they were</text>
<circle cx="664" cy="366" r="4" fill="#e0a351"/>
<text x="676" y="370" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">the appended line removed, and nothing around it</text>
<rect x="656" y="390" width="464" height="30" rx="6" fill="#2b2722" stroke="#3a352d" stroke-width="1"/>
<text x="670" y="409.5" fill="#cfc6b2" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">A note you edited since ZettelFlow wrote it is left alone, and named</text>
<rect x="984" y="428" width="64" height="26" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="1"/>
<text x="1016.0" y="445.5" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="500" text-anchor="middle">Undo</text>
<rect x="1056" y="428" width="64" height="26" rx="6" fill="#2a2936" stroke="#3a3a3a" stroke-width="1"/>
<text x="1088.0" y="445.5" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">Cancel</text>
<text x="64" y="404" fill="#dcddde" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="start">Ctrl+Z reaches the note you have open.</text>
<text x="64" y="426" fill="#8b8e94" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">This reaches what you actually did.</text>
<text x="64" y="470" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Kept in memory for two minutes, never written to disk.</text>
<text x="64" y="490" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">A flow you regret an hour later is no longer reversible from inside the plugin.</text>
<text x="600" y="556" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">The same offer follows a hook that sets a property, and a gallery install.</text>
</svg>
