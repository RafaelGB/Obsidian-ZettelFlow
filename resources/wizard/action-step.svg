<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="A yes-or-no step: Obsidian's checkbox with its words, the whole row clickable">
<rect width="1200" height="700" fill="#1e1e1e"/><rect x="808" y="24" width="368" height="540" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="824" y="52" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">LIVE PREVIEW</text><rect x="824" y="66" width="336" height="198" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="840" y="96" fill="#dcddde" font-family="sans-serif" font-size="17" font-weight="650" text-anchor="start">Notes owe nothing</text><line x1="840" y1="110" x2="840" y2="154" stroke="#3a3a3a" stroke-width="2"/><text x="850" y="122" fill="#8b8e94" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">idea: </text><text x="895.6" y="122" fill="#dcddde" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">Notes owe nothing</text><text x="850" y="144" fill="#8b8e94" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">shared: </text><text x="910.8" y="144" fill="#a99cf7" font-family="monospace" font-size="12.5" font-weight="600" text-anchor="start">true</text><text x="840" y="174" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start"># Notes owe nothing</text><line x1="840" y1="202" x2="1144" y2="202" stroke="#3a3a3a" stroke-width="1"/><text x="840" y="224" fill="#5c5f66" font-family="sans-serif" font-size="11" font-weight="650" text-anchor="start">WHAT THIS WILL CHANGE</text><rect x="840" y="236" width="40.64" height="20" rx="10.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="860.32" y="249.96" fill="#44cf6e" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="middle">Adds</text><text x="888.64" y="250" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">shared → true</text><rect x="24" y="24" width="760" height="540" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="46" y="58" fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="650" text-anchor="start">Notes owe nothing</text><rect x="647" y="42" width="89" height="24" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="659" y="59" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Zettel/</text><rect x="716" y="51" width="10" height="8" rx="2" fill="none" stroke="#8b8e94" stroke-width="1.5"/><path d="M718.5 51 v-2 a2.5 2.5 0 0 1 5 0 v2" fill="none" stroke="#8b8e94" stroke-width="1.5"/><text x="762" y="60" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><rect x="46" y="80" width="560" height="6" rx="3" fill="#3a3a3a" stroke="none" stroke-width="0"/><rect x="46" y="80" width="504.0" height="6" rx="3" fill="#7f6df2" stroke="none" stroke-width="0"/><text x="762" y="87" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end"></text><text x="760.0" y="87" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">Step 5</text><text x="46" y="112" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Zettelkasten</text><text x="140" y="112" fill="#5c5f66" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">›</text><text x="154" y="112" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Idea</text><text x="192" y="112" fill="#5c5f66" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">›</text><text x="206" y="112" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">Ready</text><line x1="24" y1="126" x2="784" y2="126" stroke="#3a3a3a" stroke-width="1"/><circle cx="50" cy="152" r="4" fill="#a882ff" stroke="none" stroke-width="2"/><text x="60" y="156" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Review</text><text x="112" y="156" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Ask yes or no</text><text x="46" y="186" fill="#dcddde" font-family="sans-serif" font-size="22" font-weight="650" text-anchor="start">Is it ready to share?</text><line x1="24" y1="508" x2="784" y2="508" stroke="#3a3a3a" stroke-width="1"/><rect x="42" y="520" width="74" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="79" y="541" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">‹ Back</text><rect x="686.8" y="520" width="79.19999999999999" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="726.4" y="541.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Confirm</text><text x="674.8" y="541" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Press Enter to confirm.</text><rect x="342.5" y="520" width="178" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="431.5" y="541" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Build with what I have</text><text x="330.5" y="541" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Ctrl+Z back</text><g transform="translate(0,24)"><rect x="44" y="196" width="720" height="64" rx="8" fill="#262626" stroke="#7f6df2" stroke-width="1.5"/><rect x="62" y="214" width="18" height="18" rx="4" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><polyline points="66,223 70,227 77,218" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="224" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">Ready to share</text><text x="94" y="244" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Writes shared to the note.</text><circle cx="34" cy="228" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="233" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="1166" cy="70" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="1166" y="75" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="672" cy="512" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="672" y="517" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="50" cy="600" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="605" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="605" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Every action asks the same way: a label, the control, one quiet line saying what the answer writes.</text><circle cx="50" cy="626" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="631" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="631" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The live preview shows the property before the note exists — nothing is written until the last step.</text><circle cx="50" cy="652" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="657" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="657" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Space ticks the box; Enter confirms. The footer's Confirm is the same button on every step.</text></g>
</svg>
