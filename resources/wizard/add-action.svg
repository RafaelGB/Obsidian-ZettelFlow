ight="22" rx="11.0" fill="#7f6df2" stroke="#7f6df2" stroke-width="1.5"/><text x="90" y="229.32" fill="#fff" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">✎ Manipulation</text><rect x="200.08" y="214" width="93.92" height="22" rx="11.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="210.08" y="229.32" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">⛓ Relations</text><rect x="300.0" y="214" width="93.92" height="22" rx="11.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="310.0" y="229.32" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">◉ Knowledge</text><rect x="399.92" y="214" width="87.2" height="22" rx="11.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="409.92" y="229.32" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">⌕ Research</text><rect x="493.12" y="214" width="46.88" height="22" rx="11.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="503.12" y="229.32" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">✦ AI</text><rect x="80.0" y="256" width="177.5" height="74" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="94.0" y="282" fill="#a99cf7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="start">T</text><text x="114.0" y="282" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Ask for text</text><text x="94.0" y="306" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">A text field the wizard asks.</text><rect x="267.5" y="256" width="177.5" height="74" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="281.5" y="282" fill="#a99cf7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="start">#</text><text x="301.5" y="282" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Ask for a number</text><text x="281.5" y="306" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">A number, written as one.</text><rect x="455.0" y="256" width="177.5" height="74" rx="6" fill="#262626" stroke="#7f6df2" stroke-width="1.5"/><text x="469.0" y="282" fill="#a99cf7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="start">▦</text><text x="489.0" y="282" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Pick a date</text><text x="469.0" y="306" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">A date, and a time if you want.</text><rect x="642.5" y="256" width="177.5" height="74" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="656.5" y="282" fill="#a99cf7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="start">☑</text><text x="676.5" y="282" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Yes or no</text><text x="656.5" y="306" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">A box to tick: true or false.</text><rect x="80.0" y="340" width="177.5" height="74" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="94.0" y="366" fill="#a99cf7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="start">≡</text><text x="114.0" y="366" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Choose an option</text><text x="94.0" y="390" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">The options you define.</text><rect x="267.5" y="340" width="177.5" height="74" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="281.5" y="366" fill="#a99cf7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="start">⚙</text><text x="301.5" y="366" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Choose from a script</text><text x="281.5" y="390" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Options a script builds.</text><rect x="455.0" y="340" width="177.5" height="74" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="469.0" y="366" fill="#a99cf7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="start">#</text><text x="489.0" y="366" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Add tags</text><text x="469.0" y="390" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Pick tags for the new note.</text><rect x="642.5" y="340" width="177.5" height="74" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="656.5" y="366" fill="#a99cf7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="start">↗</text><text x="676.5" y="366" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Link a note</text><text x="656.5" y="390" fill="#8b8e94" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Link the new note elsewhere.</text><circle cx="240" cy="144" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="240" y="149" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="806" cy="182" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="806" y="187" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="624" cy="225" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="624" y="230" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="622.5" cy="258" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="622.5" y="263" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="910" cy="110" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="910" y="115" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="930" y="115" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Suggestions first</text><text x="930" y="137" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">What fits this step, from the</text><text x="930" y="156" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">actions it already holds.</text><circle cx="910" cy="210" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="910" y="215" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="930" y="215" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Search</text><text x="930" y="237" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">By name or by what an</text><text x="930" y="256" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">action is for.</text><circle cx="910" cy="310" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="910" y="315" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="930" y="315" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">Five categories</text><text x="930" y="337" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Lucide icons, no emoji, so</text><text x="930" y="356" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">the picker follows the theme.</text><circle cx="910" cy="410" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="910" y="415" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="930" y="415" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">A tidy grid</text><text x="930" y="437" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Each action says what it is</text><text x="930" y="456" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">for; click to add it, open.</text>
