<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-label="The new-note wizard: one progress header, the step with its heading, the live preview beside it and a footer that never moves">
<rect width="1200" height="830" fill="#1e1e1e"/><rect x="24" y="24" width="1152" height="600" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="46" y="58" fill="#dcddde" font-family="sans-serif" font-size="16" font-weight="650" text-anchor="start">Event sourcing</text><rect x="1039" y="42" width="89" height="24" rx="12" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="1051" y="59" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Zettel/</text><rect x="1108" y="51" width="10" height="8" rx="2" fill="none" stroke="#8b8e94" stroke-width="1.5"/><path d="M1110.5 51 v-2 a2.5 2.5 0 0 1 5 0 v2" fill="none" stroke="#8b8e94" stroke-width="1.5"/><text x="1154" y="60" fill="#8b8e94" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="end">✕</text><rect x="46" y="80" width="952" height="6" rx="3" fill="#3a3a3a" stroke="none" stroke-width="0"/><rect x="46" y="80" width="285.6" height="6" rx="3" fill="#7f6df2" stroke="none" stroke-width="0"/><text x="1154" y="87" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">· about 3 left</text><text x="1077.8" y="87" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">Step 2</text><text x="46" y="112" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Zettelkasten</text><text x="140" y="112" fill="#5c5f66" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">›</text><text x="154" y="112" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Kind</text><text x="192" y="112" fill="#5c5f66" font-family="sans-serif" font-size="13" font-weight="400" text-anchor="start">›</text><text x="206" y="112" fill="#dcddde" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="start">What kind of note is it?</text><line x1="24" y1="126" x2="1176" y2="126" stroke="#3a3a3a" stroke-width="1"/><circle cx="50" cy="152" r="4" fill="#ec7500" stroke="none" stroke-width="2"/><text x="60" y="156" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Classify</text><text x="126" y="156" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="start">Choose one</text><text x="46" y="186" fill="#dcddde" font-family="sans-serif" font-size="22" font-weight="650" text-anchor="start">What kind of note is it?</text><line x1="24" y1="568" x2="1176" y2="568" stroke="#3a3a3a" stroke-width="1"/><rect x="42" y="580" width="74" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="79" y="601" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">‹ Back</text><rect x="1078.8" y="580" width="79.19999999999999" height="32" rx="6" fill="#7f6df2" stroke="#7f6df2" stroke-width="2"/><text x="1118.3999999999999" y="601.0" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Confirm</text><text x="1066.8" y="601" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Press Enter to confirm.</text><rect x="734.5" y="580" width="178" height="32" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="823.5" y="601" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">Build with what I have</text><text x="722.5" y="601" fill="#5c5f66" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Ctrl+Z back</text><line x1="684" y1="126" x2="684" y2="568" stroke="#3a3a3a" stroke-width="1"/><text x="46" y="212" fill="#8b8e94" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Pick one. Each option leads to the steps that fit it.</text><rect x="46" y="228" width="616" height="34" rx="6" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="1.5"/><circle cx="64" cy="244" r="5.5" fill="none" stroke="#5c5f66" stroke-width="1.6"/><line x1="68" y1="248" x2="72" y2="252" stroke="#5c5f66" stroke-width="1.6"/><text x="82" y="250" fill="#5c5f66" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Search options</text><rect x="46" y="274" width="616" height="56" rx="9" fill="#2b2840" stroke="#7f6df2" stroke-width="1.5"/><rect x="55" y="283" width="4" height="38" rx="2" fill="#00bfbc" stroke="none" stroke-width="0"/><text x="72" y="299" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">Concept</text><rect x="138.8" y="284" width="59.120000000000005" height="20" rx="10.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="168.36" y="297.96" fill="#8b8e94" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="middle">default</text><text x="72" y="318" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">An idea, in your own words</text><rect x="634" y="294" width="14" height="14" rx="3" fill="none" stroke="#5c5f66" stroke-width="1.5"/><rect x="612" y="294" width="14" height="14" rx="3" fill="none" stroke="#5c5f66" stroke-width="1.5"/><rect x="46" y="338" width="616" height="56" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><rect x="55" y="347" width="4" height="38" rx="2" fill="#e0ac00" stroke="none" stroke-width="0"/><text x="72" y="363" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">Literature</text><text x="72" y="382" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Something you read, with its source</text><rect x="634" y="358" width="14" height="14" rx="3" fill="none" stroke="#5c5f66" stroke-width="1.5"/><rect x="612" y="358" width="14" height="14" rx="3" fill="none" stroke="#5c5f66" stroke-width="1.5"/><rect x="46" y="402" width="616" height="56" rx="9" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><rect x="55" y="411" width="4" height="38" rx="2" fill="#e93147" stroke="none" stroke-width="0"/><text x="72" y="427" fill="#dcddde" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="start">Question</text><text x="72" y="446" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Something you want to find out</text><rect x="634" y="422" width="14" height="14" rx="3" fill="none" stroke="#5c5f66" stroke-width="1.5"/><rect x="612" y="422" width="14" height="14" rx="3" fill="none" stroke="#5c5f66" stroke-width="1.5"/><text x="46" y="484" fill="#5c5f66" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">⏷ 1 option is hidden by a condition</text><rect x="700" y="136" width="460" height="420" rx="8" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="2"/><text x="716" y="164" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">LIVE PREVIEW</text><rect x="716" y="178" width="428" height="218" rx="8" fill="#262626" stroke="#3a3a3a" stroke-width="2"/><text x="732" y="208" fill="#dcddde" font-family="sans-serif" font-size="17" font-weight="650" text-anchor="start">Event sourcing</text><line x1="732" y1="222" x2="732" y2="266" stroke="#3a3a3a" stroke-width="2"/><text x="742" y="234" fill="#8b8e94" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">state: </text><text x="795.2" y="234" fill="#dcddde" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">fleeting</text><text x="742" y="256" fill="#8b8e94" font-family="monospace" font-size="12.5" font-weight="400" text-anchor="start">type: </text><text x="787.6" y="256" fill="#a99cf7" font-family="monospace" font-size="12.5" font-weight="600" text-anchor="start">concept</text><text x="732" y="286" fill="#dcddde" font-family="sans-serif" font-size="14" font-weight="650" text-anchor="start">## Summary</text><text x="732" y="308" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Waiting for your answer…</text><line x1="732" y1="332" x2="1128" y2="332" stroke="#3a3a3a" stroke-width="1"/><text x="732" y="354" fill="#5c5f66" font-family="sans-serif" font-size="11" font-weight="650" text-anchor="start">WHAT THIS WILL CHANGE</text><rect x="732" y="366" width="40.64" height="20" rx="10.0" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/><text x="752.32" y="379.96" fill="#44cf6e" font-family="sans-serif" font-size="11" font-weight="400" text-anchor="middle">Adds</text><text x="780.64" y="380" fill="#8b8e94" font-family="sans-serif" font-size="12.5" font-weight="400" text-anchor="start">type → concept</text><text x="716" y="430" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="650" text-anchor="start">CONNECTION SUGGESTIONS</text><text x="716" y="450" fill="#5c5f66" font-family="sans-serif" font-size="11.5" font-weight="400" text-anchor="start">From shared tags and title words — yours to accept or ignore.</text><line x1="716" y1="462" x2="1144" y2="462" stroke="#3a3a3a" stroke-width="1"/><text x="716" y="486" fill="#a99cf7" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">CQRS</text><text x="1144" y="486" fill="#8b8e94" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="end">Not related</text><rect x="974" y="470" width="80" height="26" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="1014" y="487" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Other words</text><rect x="924" y="470" width="44" height="26" rx="6" fill="#262626" stroke="#3a3a3a" stroke-width="1.5"/><text x="946" y="487" fill="#dcddde" font-family="sans-serif" font-size="12" font-weight="400" text-anchor="middle">Link</text><circle cx="34" cy="58" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="63" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="34" cy="186" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="191" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="34" cy="304" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="309" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="694" cy="164" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="694" y="169" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="34" cy="596" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="34" y="601" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><circle cx="630" cy="596" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="630" y="601" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">6</text><circle cx="50" cy="660" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="665" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="70" y="665" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">One progress header: the title, edited in place; where it lands (locked when the flow fixes it); a real bar.</text><circle cx="50" cy="686" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="691" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="70" y="691" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The step has a heading, with its phase and what it asks for — and the path walked so far above it.</text><circle cx="50" cy="712" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="717" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="70" y="717" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">Options mean something: the edge is the colour of the step each one leads to; the default is marked in words.</text><circle cx="50" cy="738" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="743" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="70" y="743" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The live preview: the note as it will be, what the build will change, and suggestions you accept or not.</text><circle cx="50" cy="764" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="769" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="70" y="769" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">A footer that never moves: Back · Skip this step · Build with what I have · Confirm.</text><circle cx="50" cy="790" r="10" fill="#e0a351" stroke="#e0a351" stroke-width="2"/><text x="50" y="795" fill="#1e1e1e" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">6</text><text x="70" y="795" fill="#dcddde" font-family="sans-serif" font-size="13.5" font-weight="400" text-anchor="start">The keys sit beside it: Ctrl+Z goes back, Enter (Ctrl+Enter in a text box) confirms.</text>
</svg>
